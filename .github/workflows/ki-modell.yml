name: KI-Modell bereitstellen

# Lädt das freie Sprachmodell Qwen2.5-7B-Instruct (Apache-2.0) einmalig und legt es in Teilen (< 2 GB je Datei)
# als Release-Dateien ab, damit es zusammen mit dem Windows-Installer ausgeliefert werden kann.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/ki-modell.yml"

permissions:
  contents: write

jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - name: Modell herunterladen und teilen
        run: |
          curl -L --fail --retry 3 -o Qwen2.5-7B-Instruct-Q4_K_M.gguf "https://huggingface.co/bartowski/Qwen2.5-7B-Instruct-GGUF/resolve/main/Qwen2.5-7B-Instruct-Q4_K_M.gguf"
          curl -L --fail --retry 3 -o LICENSE-Qwen2.5.txt "https://huggingface.co/Qwen/Qwen2.5-7B-Instruct/resolve/main/LICENSE" || echo "Apache-2.0 – https://huggingface.co/Qwen/Qwen2.5-7B-Instruct" > LICENSE-Qwen2.5.txt
          sha256sum Qwen2.5-7B-Instruct-Q4_K_M.gguf | tee SHA256-7B.txt
          split -b 1900M -d -a 2 Qwen2.5-7B-Instruct-Q4_K_M.gguf Qwen2.5-7B-Instruct-Q4_K_M.gguf.part
          ls -la
      - name: Als Release-Dateien ablegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ki-modell-v1 -R "${{ github.repository }}" >/dev/null 2>&1 || gh release create ki-modell-v1 -R "${{ github.repository }}" --target "${{ github.sha }}" --title "KI-Modell für Medienmanager 2027" --notes "Freie Sprachmodelle (Apache-2.0) für die eingebaute KI."
          gh release upload ki-modell-v1 Qwen2.5-7B-Instruct-Q4_K_M.gguf.part* SHA256-7B.txt LICENSE-Qwen2.5.txt -R "${{ github.repository }}" --clobber
