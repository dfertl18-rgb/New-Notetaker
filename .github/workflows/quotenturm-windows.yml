name: Medienmanager 2027 Windows-Build

on:
  workflow_dispatch:
  push:
    paths:
      - "quotenturm/**"
      - ".github/workflows/quotenturm-windows.yml"

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: quotenturm/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: Medienmanager-2027-Windows
          path: |
            quotenturm/desktop/dist/*.exe
          retention-days: 30
