<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quotenturm</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Quotenturm">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: Manager-Oberfläche – Kopfleiste mit „Weiter“, Navigationsleiste links, Inhalt rechts (Hochhaus, Räume, Tabellen).
   Bewusst ein einziges dunkles Erscheinungsbild wie moderne Manager-Simulationen. */
:root {
  --bg: #0e1116;
  --rail: #12161c;
  --surface: #171c24;
  --surface-2: #1f2631;
  --line: #2a3340;
  --text: #e9eef5;
  --muted: #8a96a8;
  --accent: #4c8dff;
  --club: #f0a818;
  --good: #3fcf7f;
  --mid: #e6c34a;
  --bad: #ef5b5b;
  --font-head: "Barlow Semi Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: var(--font-body); font-size: 15px; line-height: 1.35;
  overflow: hidden; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); }

/* Kopfleiste */
#top {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(90deg, #2a1f08 0, var(--rail) 320px); border-bottom: 1px solid var(--line);
}
.club { display: flex; align-items: center; gap: 10px; }
.badge { width: 40px; height: 40px; border-radius: 8px; background: var(--club); color: #1a1406; display: grid; place-items: center; font-family: var(--font-head); font-weight: 700; font-size: 20px; }
.club b { display: block; font-family: var(--font-head); font-size: 19px; letter-spacing: .02em; line-height: 1.05; }
.club small { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
.spacer { flex: 1; }
.stat { display: grid; gap: 1px; }
.stat small { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
.stat b { font-family: var(--font-head); font-weight: 600; font-size: 20px; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat b.neg { color: var(--bad); }
.pill { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.pill.live { background: var(--bad); color: #fff; }
.imgmini { display: grid; gap: 4px; width: 170px; }
.bar3 { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--surface-2); }
.bar3 span { height: 100%; transition: width .5s; }
.seg { display: flex; background: var(--surface-2); border-radius: 8px; padding: 3px; gap: 2px; }
.seg button { background: transparent; border: 0; border-radius: 6px; min-width: 40px; height: 34px; font-weight: 600; color: var(--muted); }
.seg button.on { background: var(--line); color: var(--text); }
.go { background: var(--accent); color: #fff; border: 0; border-radius: 8px; height: 42px; padding: 0 20px; font-family: var(--font-head); font-weight: 700; font-size: 17px; letter-spacing: .04em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
.go.running { background: var(--surface-2); color: var(--text); }

/* Seitenleiste + Inhalt */
#body { display: grid; grid-template-columns: 210px minmax(0, 1fr); min-height: 0; }
#nav { background: var(--rail); border-right: 1px solid var(--line); padding: 12px 8px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; padding-left: max(8px, env(safe-area-inset-left, 0px)); }
#nav button { display: flex; align-items: center; gap: 10px; width: 100%; background: transparent; border: 0; border-radius: 8px; padding: 10px 12px; text-align: left; font-weight: 500; color: var(--muted); min-height: 44px; }
#nav button svg { width: 18px; height: 18px; flex: 0 0 auto; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
#nav button:hover { background: var(--surface); color: var(--text); }
#nav button.on { background: var(--surface-2); color: var(--text); box-shadow: inset 3px 0 0 var(--club); }
#nav button .cnt { margin-left: auto; background: var(--accent); color: #fff; font-size: 11px; font-weight: 600; border-radius: 999px; padding: 1px 7px; }
#nav .room-now { color: var(--club); }
.nav-sep { height: 1px; background: var(--line); margin: 8px 6px; }
.nav-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; padding: 6px 12px 2px; }
#main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.vhead { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; padding: 14px 20px 12px; border-bottom: 1px solid var(--line); background: var(--surface); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.vhead .crumb { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
.vhead h1 { margin: 2px 0 0; font-family: var(--font-head); font-weight: 700; font-size: 26px; line-height: 1.05; text-wrap: balance; }
.vhead .grow { flex: 1; min-width: 0; }
.vbody { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 20px 28px; display: grid; gap: 16px; align-content: start; -webkit-overflow-scrolling: touch; padding-right: max(20px, env(safe-area-inset-right, 0px)); }

/* Hochhaus */
#towerView { flex: 1; min-height: 0; display: flex; flex-direction: column; }
#stage { position: relative; flex: 1; min-height: 0; }
#tower { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#toast { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); background: var(--surface-2); border: 1px solid var(--line); border-left: 4px solid var(--accent); padding: 10px 14px; border-radius: 8px; max-width: min(90%, 520px); pointer-events: none; opacity: 0; transition: opacity .2s; box-shadow: 0 10px 30px rgba(0,0,0,.4); z-index: 30; }
#toast.show { opacity: 1; }
#live { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; padding: 10px 20px; border-top: 1px solid var(--line); background: var(--surface); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.lv { min-width: 0; display: grid; gap: 4px; }
.lv-top { display: flex; align-items: center; gap: 8px; min-width: 0; }
.dot { width: 10px; height: 10px; border-radius: 3px; flex: 0 0 auto; }
.lv-top b { font-family: var(--font-head); font-size: 14px; letter-spacing: .04em; }
.lv-top span { margin-left: auto; font-family: var(--font-head); font-weight: 600; font-variant-numeric: tabular-nums; }
.lv-t { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.share { height: 4px; background: var(--surface-2); border-radius: 2px; overflow: hidden; }
.share i { display: block; height: 100%; }

/* Bausteine */
.btn { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; min-height: 40px; font-weight: 600; }
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.club { background: var(--club); border-color: var(--club); color: #1a1406; }
.btn.sm { min-height: 34px; padding: 5px 10px; font-size: 14px; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; min-width: 0; }
.panel > header { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.panel > header h2 { margin: 0; font-family: var(--font-head); font-weight: 600; font-size: 17px; flex: 1; }
.panel > .pad { padding: 12px 14px; }
.lead { margin: 0; color: var(--muted); max-width: 70ch; }
.note { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: rgba(76,141,255,.1); border: 1px solid rgba(76,141,255,.35); border-radius: 10px; padding: 10px 14px; }
.note p { margin: 0; flex: 1; min-width: 200px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 2px; }
.tile small { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
.tile b { font-family: var(--font-head); font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
.tile span { color: var(--muted); font-size: 13px; }
.tbl { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { text-align: left; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface); position: sticky; top: 0; }
td { padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tbody tr:hover { background: rgba(255,255,255,.025); }
td.num, th.num { text-align: right; }
td.title { white-space: normal; min-width: 180px; font-weight: 500; }
.attr { display: inline-grid; place-items: center; min-width: 30px; height: 24px; border-radius: 5px; font-family: var(--font-head); font-weight: 700; font-size: 15px; color: #10141a; }
.a4 { background: var(--good); } .a3 { background: #9bd65a; } .a2 { background: var(--mid); } .a1 { background: #f08c4a; } .a0 { background: var(--bad); }
.chip { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .04em; padding: 2px 7px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); color: var(--text); }
.chip.fsk { background: var(--bad); border-color: var(--bad); color: #fff; }
.chip.good { background: rgba(63,207,127,.15); border-color: rgba(63,207,127,.5); color: var(--good); }
.chip.warn { background: rgba(230,195,74,.12); border-color: rgba(230,195,74,.5); color: var(--mid); }
.mbar { width: 80px; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; display: inline-block; vertical-align: middle; }
.mbar i { display: block; height: 100%; background: var(--accent); }
.muted { color: var(--muted); }
.stars { color: var(--club); letter-spacing: 1px; }
.win { color: var(--good); font-weight: 600; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
.tabs button { background: transparent; border: 0; padding: 10px 14px; color: var(--muted); font-weight: 600; border-bottom: 2px solid transparent; }
.tabs button.on { color: var(--text); border-bottom-color: var(--club); }

/* Sendeplan */
.plan { display: grid; }
.slot { display: grid; grid-template-columns: 70px minmax(0, 1.3fr) minmax(0, 1fr) 90px; align-items: stretch; border-bottom: 1px solid var(--line); }
.slot:last-child { border-bottom: 0; }
.slot .hr { font-family: var(--font-head); font-size: 22px; font-weight: 600; display: grid; align-content: center; padding: 0 14px; }
.slot .hr small { font-family: var(--font-body); font-size: 10px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; }
.slot.prime .hr { color: var(--club); }
.slot.aired { background: rgba(255,255,255,.02); }
.cell { background: transparent; border: 0; border-left: 1px solid var(--line); text-align: left; padding: 9px 12px; min-width: 0; display: grid; gap: 2px; align-content: center; min-height: 56px; }
.cell:not(:disabled):hover { background: rgba(76,141,255,.08); }
.cell .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cell .s { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cell:disabled { cursor: default; }
.cell.bad .t { color: var(--bad); }
.cell.cont .t { color: var(--muted); }
.slot .res { border-left: 1px solid var(--line); display: grid; align-content: center; justify-items: end; padding: 0 12px; font-family: var(--font-head); font-weight: 600; font-variant-numeric: tabular-nums; }
.slot .res small { font-family: var(--font-body); font-weight: 400; font-size: 11px; color: var(--muted); }

/* Posteingang */
.inbox { display: grid; }
.msg { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 11px 14px; border-bottom: 1px solid var(--line); }
.msg:last-child { border-bottom: 0; }
.msg i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.msg.ok i { background: var(--good); } .msg.warn i { background: var(--bad); } .msg.info i { background: var(--muted); }
.msg.new { background: rgba(76,141,255,.06); }
.msg span { min-width: 0; }
.msg time { color: var(--muted); font-size: 13px; white-space: nowrap; }

/* Dialoge */
.modal { position: fixed; inset: 0; z-index: 50; background: rgba(5, 7, 10, .72); display: flex; align-items: center; justify-content: center; overflow-y: auto;
  padding-block: max(16px, env(safe-area-inset-top, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.dialog { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; width: min(760px, 100%); margin: auto; box-shadow: 0 30px 80px rgba(0,0,0,.5); overflow: hidden; }
.dialog > header { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.dialog > header h2 { margin: 0; flex: 1; font-family: var(--font-head); font-weight: 700; font-size: 20px; }
.dialog .dbody { padding: 16px 18px 20px; display: grid; gap: 14px; }
.dialog.narrow { width: min(560px, 100%); }
.hero { padding: 26px 18px 20px; background: radial-gradient(circle at 85% 0%, rgba(240,168,24,.25), transparent 55%), linear-gradient(180deg, #1c222c, var(--surface)); border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.hero h1 { margin: 0; font-family: var(--font-head); font-weight: 700; font-size: clamp(36px, 7vw, 60px); line-height: .95; letter-spacing: .01em; text-wrap: balance; }
.hero h1 em { font-style: normal; color: var(--club); }
.hero p { margin: 0; color: var(--muted); max-width: 60ch; }
.rules { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.rules li { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.rules b { display: block; font-family: var(--font-head); font-size: 15px; color: var(--club); text-transform: uppercase; letter-spacing: .06em; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.pick { width: 100%; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; text-align: left; display: grid; gap: 4px; }
.pick:hover:not(:disabled) { border-color: var(--accent); }
.pick:disabled { opacity: .4; cursor: not-allowed; }
.pick .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; }
.picklist { display: grid; gap: 6px; max-height: 60vh; overflow-y: auto; }
.meter { height: 10px; background: var(--surface-2); border-radius: 5px; overflow: hidden; position: relative; }
.meter span { display: block; height: 100%; background: var(--club); }
.meter i { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--bad); }

@media (max-width: 860px) {
  #body { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  #nav { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 6px; padding-left: max(8px, env(safe-area-inset-left, 0px)); }
  #nav button { width: auto; white-space: nowrap; padding: 8px 10px; }
  .nav-sep, .nav-label { display: none; }
  .imgmini { width: 120px; }
  #live { grid-template-columns: minmax(0, 1fr); gap: 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); }
  .slot { grid-template-columns: 54px minmax(0, 1fr) 70px; }
  .slot .cell.ad { grid-column: 2; border-top: 1px dashed var(--line); }
  .slot .res { grid-row: 1; grid-column: 3; }
  .vhead, .vbody { padding-left: max(16px, env(safe-area-inset-left, 0px)); }
}
@media (max-width: 520px) {
  .club small, .imgmini, .hide-s { display: none; }
}
@media (prefers-reduced-motion: reduce) { .bar3 span { transition: none; } #toast { transition: none; } }
</style>
</head>
<body>

<div id="app">
  <header id="top">
    <div class="club"><div class="badge">13</div><div><b>KANAL 13</b><small>Programmdirektion</small></div></div>
    <div class="spacer"></div>
    <div class="stat"><small id="hudDay">Tag 1</small><b id="hudClock">08:00</b></div>
    <span class="pill" id="hudAir">Sendestart 16:00</span>
    <div class="stat"><small>Kontostand</small><b id="hudMoney">0 €</b></div>
    <div class="stat imgmini"><small id="hudImg">Image</small><div class="bar3" id="hudBar"></div></div>
    <div class="seg" role="group" aria-label="Spieltempo">
      <button data-speed="1" class="on">1×</button><button data-speed="2">2×</button><button data-speed="3">3×</button>
    </div>
    <button class="go" id="goBtn">Weiter ▸</button>
  </header>
  <div id="body">
    <nav id="nav" aria-label="Navigation"></nav>
    <main id="main">
      <div class="vhead" id="vhead"></div>
      <div id="towerView">
        <div id="stage">
          <canvas id="tower" aria-label="Das Sender-Hochhaus. Tippen Sie auf eine Tür, um dorthin zu gehen."></canvas>
          <div id="toast" role="status" aria-live="polite"></div>
        </div>
        <div id="live"></div>
      </div>
      <div class="vbody" id="vbody" hidden></div>
    </main>
  </div>
</div>
<div class="modal" id="modal" hidden><div class="dialog" id="dialog"></div></div>

<script>
"use strict";
// ---------- Grunddaten ----------
const HOURS = [16, 17, 18, 19, 20, 21, 22, 23];
const BASE = [1.0, 1.4, 2.0, 2.6, 3.6, 3.8, 3.0, 1.8]; // Mio. Zuschauer vor dem Fernseher je Stunde
const OUTSIDE = 34; // „Abschalten“ als vierte Option
const MS_PER_MIN = 170; // Echtzeit pro Spielminute bei 1×
const DAY_START = 8 * 60, DAY_END = 24 * 60;
const STATION_DEF = [
  { name: "KANAL 13", color: "#f0a818", skin: "#c68a5c" },

  { name: "SONNENKANAL", color: "#e8487c", skin: "#8d5a3b" },
];
const GENRES = {

  "Krimi": [18, 19], "Kultur": [22], "Show": [20], "Science-Fiction": [20], "Serie": [18, 19],
};
const TITLES = {

  "Action": ["Turbo-Alarm", "Explosion über Duisburg", "Kommando Mitternacht", "Stahlfaust", "Die Jagd nach dem Goldkoffer", "Vollgas auf der A9", "Zone 9", "Feuer im Hafen"],
  "Monumental": ["Das Goldene Imperium", "Die Wikinger von Haithabu", "Barbarossa", "Sturm über Karthago", "Die Pharaonin", "Der Turm von Babel"],
  "Komödie": ["Hilfe, die Schwiegermutter kommt", "Urlaub mit Opa", "Chaos in der WG", "Ein Kamel für Bielefeld", "Familie Krause zieht um", "Der Pinguin im Kofferraum", "Diät ab Montag", "Zwei Trottel auf Tour"],
  "Krimi": ["Spurensuche in Kreuzberg", "Der Fall Lenz", "Schatten über dem Moor", "Mord auf der Zugspitze", "Die tote Tante", "Kommissarin Kowalski", "Tod im Weinberg", "Der Schlüssel im Brunnen"],
  "Kultur": ["Oper am Abend: Fidelio", "Auf Bachs Spuren", "Museumsnacht live", "Lyrik um zehn", "Theater: Der zerbrochne Krug", "Bauhaus – Form und Idee", "Sinfonie der Großstadt", "Dürer und die Welt"],
  "Show": ["Das Quotenquiz", "Schlager-Karussell", "Wer kocht, gewinnt", "Samstagabend-Spektakel", "Die Talentgala", "Hausmusik XXL", "Das große Ratespiel"],
  "Science-Fiction": ["Raumschiff Gurke", "Die Marsbäcker", "Planet der Hausmeister", "Zeitreise nach Gestern", "Roboter Rudi", "Invasion aus dem Kleingarten", "Sternenstaub 2099"],
  "Serie": ["Die Hafenklinik", "Schrebergarten-Geschichten", "Revier 12", "Familie Brömmel", "Wache Ost", "Das Landarzt-Team", "Hotel Alpenglück", "Die Werkstatt"],
};

// ---------- Hilfsfunktionen ----------
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const r1000 = v => Math.round(v / 1000) * 1000;
const eur = v => (v < 0 ? "−" : "") + Math.abs(Math.round(v)).toLocaleString("de-DE") + " €";
const mio = v => v.toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " Mio.";
const hhmm = m => String(Math.floor(m / 60) % 24).padStart(2, "0") + ":" + String(Math.floor(m % 60)).padStart(2, "0");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
function fit(genre, h) {
  const d = Math.min(...GENRES[genre].map(b => Math.abs(b - h)));
  return Math.max(0.45, 1 - 0.13 * d);
}
const stars = f => f >= 0.9 ? "★★★" : f >= 0.7 ? "★★☆" : "★☆☆";
const attr = q => `<span class="attr a${q >= 80 ? 4 : q >= 65 ? 3 : q >= 50 ? 2 : q >= 35 ? 1 : 0}">${q}</span>`;
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function uid() { return ++G.idc; }
function newTitle(genre) {
  const base = pick(TITLES[genre]);
  let t = base, n = 1;
  while (G.used.includes(t)) { n++; t = base + (n === 2 ? " II" : n === 3 ? " III" : " " + n); }
  G.used.push(t);
  return t;
}
function makeProgram(qMin = 20, qMax = 95) {
  const genre = pick(Object.keys(GENRES));
  const q = ri(qMin, qMax);
  if (genre === "Serie") {
    const eps = ri(6, 13);
    return { id: uid(), title: newTitle(genre), genre, kind: "serie", q, len: 1, eps, ep: 0, topic: 1, fsk: false,
      price: r1000((6000 + q * q * 9) * (eps / 9) * rnd(0.85, 1.15)) };
  }
  let len = 1;
  if (genre === "Monumental") len = 2;
  else if (["Action", "Liebesfilm", "Komödie", "Science-Fiction", "Kultur"].includes(genre)) len = Math.random() < 0.45 ? 2 : 1;
  const fsk = ["Action", "Krimi", "Science-Fiction"].includes(genre) && Math.random() < 0.3;
  const price = r1000((8000 + q * q * 13) * (len === 2 ? 1.3 : 1) * (fsk ? 0.85 : 1) * rnd(0.85, 1.2));
  return { id: uid(), title: newTitle(genre), genre, kind: "film", q, len, topic: 1, fsk, price };
}
function makeAd() {
  const min = pick([0.15, 0.2, 0.3, 0.4, 0.5, 0.65, 0.8, 1.0, 1.2]);
  const spots = ri(2, 6);
  const pay = r1000(min * 42000 * rnd(0.85, 1.2) + 3000);
  return { id: uid(), brand: pick(BRANDS), min, spots, done: 0, days: spots + ri(1, 3), pay, penalty: r1000(pay * spots * 0.6) };
}
function makeNews() {
  const fresh = HEADLINES.filter(h => !G.newsOffers.some(n => n.title === h));
  const q = ri(15, 95);
  return { id: uid(), title: pick(fresh), q, price: r1000(2000 + q * q * 2.2) };
}
function emptySched() { return HOURS.map(() => ({ p: null, ad: null, cont: false })); }

function newGame() {
  G = { day: 1, min: DAY_START, idc: 0, used: [], market: [], adOffers: [], newsOffers: [], log: [], unread: 0, over: null, today: HOURS.map(() => null), stations: [] };
  G.stations = STATION_DEF.map((d, i) => ({
    i, name: d.name, color: d.color, money: 400000, credit: 0, image: i === 0 ? 34 : 33, favor: 0,
    progs: [], contracts: [], sched: emptySched(), news: [], last: HOURS.map(() => 0), hist: [],
    income: 0, giftDay: 0, imageStart: 0, moneyStart: 0,
  }));
  for (const st of G.stations) {
    for (let k = 0; k < 5; k++) st.progs.push(makeProgram(30, 65));
    for (let k = 0; k < 2; k++) { const a = makeAd(); a.min = pick([0.15, 0.2, 0.3]); a.pay = r1000(a.min * 42000 + 3000); a.penalty = r1000(a.pay * a.spots * 0.6); st.contracts.push(a); }
    autoPlan(st, 0);
  }
  refreshOffers(true);
  logMsg("Willkommen bei KANAL 13! Ihr Vorgänger hat einen Sendeplan hinterlassen. Ab 16:00 Uhr wird gesendet.", false, "ok");
  startDay();
}

function refreshOffers(first) {
  if (!first) {
    shuffle(G.market);
    G.market.splice(0, Math.min(4, G.market.length));
  }
  while (G.market.length < 9) G.market.push(makeProgram());
  G.adOffers = [];
  for (let k = 0; k < 6; k++) G.adOffers.push(makeAd());
  G.newsOffers = [];
  for (let k = 0; k < 5; k++) G.newsOffers.push(makeNews());
}

function logMsg(msg, toastIt, kind = "info") {

// ---------- Sendeplan-Logik ----------
const progOf = (st, id) => st.progs.find(p => p.id === id);
const adOf = (st, id) => st.contracts.find(c => c.id === id);
function clearProgAt(st, i) {
  const c = st.sched[i];
  if (!c.p) return;
  const p = progOf(st, c.p);
  let start = c.cont ? i - 1 : i;
  st.sched[start].p = null; st.sched[start].cont = false;
  if (p && p.len === 2 && st.sched[start + 1]) { st.sched[start + 1].p = null; st.sched[start + 1].cont = false; }
  if (!p) { c.p = null; c.cont = false; }
}
function canPlace(p, i) {
  if (p.len === 2 && i >= HOURS.length - 1) return "Zu lang für den letzten Sendeplatz";
  if (p.fsk && HOURS[i] < 21) return "FSK 18 erst ab 21 Uhr";
  if (slotLocked(i) || (p.len === 2 && slotLocked(i + 1))) return "Sendeplatz läuft bereits";
  return "";
}
function setProg(st, i, p) {
  clearProgAt(st, i);
  if (!p) return;
  if (p.len === 2) clearProgAt(st, i + 1);
  st.sched[i].p = p.id; st.sched[i].cont = false;
  if (p.len === 2) { st.sched[i + 1].p = p.id; st.sched[i + 1].cont = true; }
}
const slotLocked = i => G.min >= HOURS[i] * 60;
// Fortsetzung eines bereits laufenden Zweistünders ist ebenfalls gesperrt
const cellLocked = (st, i) => slotLocked(i) || (st.sched[i].cont && slotLocked(i - 1));
function expected(st, i) { return st.last[i] || BASE[i] * 0.24; }
function plannedSpots(st, adId) { let n = 0; st.sched.forEach((c, i) => { if (!slotLocked(i) && c.ad === adId) n++; }); return n; }

// Automatischer Plan (KI und „Vorschlag“-Knopf), nur für noch nicht gesendete Plätze
function autoPlan(st, fromIdx) {
  for (let i = fromIdx; i < HOURS.length; i++) {
    if (st.sched[i].cont && i === fromIdx) continue; // Fortsetzung eines laufenden Films behalten
    st.sched[i].p = null; st.sched[i].cont = false; st.sched[i].ad = null;
  }
  const used = {};
  st.sched.forEach((c, i) => { if (i < fromIdx && c.p && !c.cont) used[c.p] = (used[c.p] || 0) + 1; });
  const order = HOURS.map((h, i) => i).filter(i => i >= fromIdx).sort((a, b) => BASE[b] - BASE[a]);
  for (const i of order) {
    if (st.sched[i].p) continue;
    let best = null, bestS = 0;
    for (const p of st.progs) {
      if (canPlace(p, i)) continue;
      if (p.len === 2 && st.sched[i + 1].p) continue;
      let s = p.q * fit(p.genre, HOURS[i]) * (0.35 + 0.65 * p.topic);
      if (used[p.id]) s *= 0.35;
      if (s > bestS) { bestS = s; best = p; }
    }
    if (best) { setProg(st, i, best); used[best.id] = (used[best.id] || 0) + 1; }
  }
  // Werbung: höchste Mindestquote, die sicher erreicht wird
  for (let i = fromIdx; i < HOURS.length; i++) {
    if (!st.sched[i].p) continue;
    const exp = expected(st, i) * 0.92;
    let best = null;
    for (const c of st.contracts) {
      const left = c.spots - c.done - plannedSpots(st, c.id);
      if (left <= 0 || c.min > exp) continue;
      if (!best || c.pay > best.pay) best = c;
    }
    if (best) st.sched[i].ad = best.id;
  }
}

// ---------- Sendung auswerten ----------
function airHour(i) {
  const h = HOURS[i];
  const res = G.stations.map(st => {
    const c = st.sched[i];
    const p = c.p ? progOf(st, c.p) : null;
    const newsMult = 1 + Math.min(st.news.reduce((a, n) => a + n.q, 0) / 3, 100) / 420;
    const imgMod = 1 + (st.image - 33) / 120;
    let A = 2;
    if (p) {
      A = p.q * fit(p.genre, h) * (0.35 + 0.65 * p.topic) * imgMod * newsMult * rnd(0.9, 1.1);
      if (c.cont) A *= 0.95;
      A = Math.max(1, A);
    }
    return { st, p, c, A };
  });
  const sum = res.reduce((a, r) => a + r.A, 0) + OUTSIDE;
  for (const r of res) {
    r.v = BASE[i] * r.A / sum;
    const st = r.st;
    st.last[i] = r.v;
    r.title = r.p ? r.p.title + (r.p.kind === "serie" ? ` (Folge ${(r.p.ep % r.p.eps) + 1})` : "") : "Testbild";
    if (r.p && !r.c.cont) {
      if (r.p.kind === "serie") { r.p.ep++; r.p.topic = Math.max(0.15, r.p.topic - (r.p.ep % r.p.eps === 0 ? 0.5 : 0.07)); }
      else r.p.topic = Math.max(0.1, r.p.topic * 0.68);
      if (r.p.genre === "Kultur" && h >= 21) st.favor = Math.min(st.image * 2, 100, st.favor + 2 + r.p.q / 25);
    }
    // Werbespot
    const ad = r.c.ad ? adOf(st, r.c.ad) : null;
    if (ad && ad.done < ad.spots) {
      if (r.v >= ad.min) {
        ad.done++; st.money += ad.pay; st.income += ad.pay;
        if (st.i === 0) logMsg(`${HOURS[i]}:00 Spot „${ad.brand}“ gesendet: +${eur(ad.pay)}`, false, "ok");
        if (ad.done >= ad.spots) {
          st.contracts = st.contracts.filter(x => x !== ad);
          st.sched.forEach(s => { if (s.ad === ad.id) s.ad = null; });
          if (st.i === 0) logMsg(`Vertrag „${ad.brand}“ erfüllt.`, true, "ok");
        }
      } else if (st.i === 0) logMsg(`${HOURS[i]}:00 Spot „${ad.brand}“ verfehlt: ${mio(r.v)} statt ${mio(ad.min)}`, true, "warn");
    }
    if (!r.p) { st.image = Math.max(0, st.image - 1); if (st.i === 0) logMsg(`${HOURS[i]}:00 Sendepause! Testbild kostet Image.`, true, "warn"); }
  }
  // Imagepunkt vom schwächsten zum stärksten Sender
  const sorted = [...res].sort((a, b) => b.v - a.v);
  if (sorted[0].v > sorted[2].v * 1.1) { sorted[0].st.image++; sorted[2].st.image--; }
  // Punkte aus Sendepausen dem Quotensieger gutschreiben, damit es 100 bleiben
  const total = G.stations.reduce((a, s) => a + s.image, 0);
  sorted[0].st.image += 100 - total;
  G.stations.forEach(s => { s.image = clamp(s.image, 0, 100); s.favor = Math.min(s.favor, s.image * 2); });
  G.today[i] = res.map(r => ({ v: r.v, title: r.title }));
  if (sorted[0].st.i === 0) logMsg(`${HOURS[i]}:00 Quotensieg mit ${mio(sorted[0].v)}!`, false, "ok");
  renderLive(); renderHud();
  if (view !== "tower") renderView();
}

// ---------- Tagesablauf ----------
function startDay() {
  G.min = DAY_START;
  G.today = HOURS.map(() => null);
  for (const st of G.stations) {
    st.income = 0; st.imageStart = st.image; st.moneyStart = st.money; st.news = [];
    st.sched.forEach(c => { if (c.ad && !adOf(st, c.ad)) c.ad = null; if (c.p && !progOf(st, c.p)) { c.p = null; c.cont = false; } });
  }
  ROOMS.forEach(r => { r.occ = null; });
  lift = { y: 0, queue: [], occ: null, phase: "idle", timer: 0 };
  actors = G.stations.map((st, i) => ({ st: i, floor: 0, x: 120 + i * 40, mode: "idle", target: null, timer: 0, bubble: "", face: 1 }));
  player = actors[0];
  for (const st of G.stations.slice(1)) planAI(st);
  openRoom = null;
  save();
  setView("tower");
  renderAll();
}
function planAI(st) {
  const first = shuffle(["market", "ads", "news"]);
  if (Math.random() < 0.35) first.splice(ri(0, 2), 0, "kantine");
  if (st.money > 180000 && Math.random() < 0.45) first.push("jury");
  st.ai = { queue: [...first, st.i === 1 ? "r1" : "r2", pick(["market", "ads"]), st.i === 1 ? "r1" : "r2"], next: DAY_START + ri(0, 40) };
}
function endDay() {
  paused = true; setSpeedUI();
  if (openRoom) leaveCurrentRoom();
  const report = [];
  for (const st of G.stations) {
    const costs = 15000 + Math.round(st.credit * 0.015);
    st.money -= costs;
    st.costs = costs; st.penalties = 0;
    for (const c of [...st.contracts]) {
      c.days--;
      if (c.days <= 0 && c.done < c.spots) {
        st.money -= c.penalty; st.penalties += c.penalty;
        st.contracts = st.contracts.filter(x => x !== c);
        if (st.i === 0) report.push(`Vertragsstrafe „${c.brand}“: −${eur(c.penalty)}`);
      }
    }
    st.progs.forEach(p => { p.topic = Math.min(1, p.topic + 0.08); });
    st.hist.push({ day: G.day, image: st.image, money: st.money, income: st.income, costs: st.costs + st.penalties, views: G.today.reduce((a, r) => a + (r ? r[st.i].v : 0), 0) });
  }
  const me = G.stations[0];
  let over = null;
  if (me.favor >= 100) over = { win: true, why: "Die Jury verleiht KANAL 13 die Goldene Antenne. Ihr Programm hat Kultur und Quote verbunden." };
  else if (me.image >= 60) over = { win: true, why: "KANAL 13 ist unangefochtener Marktführer mit " + me.image + " Imagepunkten." };
  else if (me.image < 5) over = { win: false, why: "Das Senderimage ist unter 5 Punkte gefallen. Die Intendanz setzt Sie vor die Tür." };
  else if (me.money < -250000) over = { win: false, why: "Die Schulden sind zu hoch. Die Intendanz zieht die Notbremse." };
  else {
    const rival = G.stations.slice(1).find(s => s.favor >= 100 || s.image >= 60);
    if (rival) over = { win: false, why: `${rival.name} hat das Rennen gemacht (${rival.favor >= 100 ? "Goldene Antenne" : "Marktführerschaft"}).` };
  }
  G.over = over;
  showSummary(report);
}
function nextDay() {
  G.day++;
  // KI-Kredit: Konkurrenten fangen sich bei Schulden
  for (const st of G.stations.slice(1)) if (st.money < 0 && st.credit < 400000) { st.money += 150000; st.credit += 150000; }
  refreshOffers(false);
  startDay();
  paused = false;
  setSpeedUI();
}

// ---------- KI ----------
function aiEnter(actor, room) {
  const st = G.stations[actor.st];
  if (room.id === "market") {
    let bought = 0;
    const cands = [...G.market].sort((a, b) => b.q / b.price - a.q / a.price + (b.q - a.q) / 400);
    for (const p of cands) {
      if (bought >= (st.i === 1 ? 1 : 2) || st.progs.length >= 12) break;
      if (p.price < st.money - 90000) { buyProgram(st, p); bought++; }
    }
  } else if (room.id === "ads") {
    const prime = Math.max(...st.last, 0.3);
    const cands = [...G.adOffers].filter(a => a.min <= prime * 0.85).sort((a, b) => b.pay - a.pay);
    for (const a of cands.slice(0, 2)) if (st.contracts.length < 5) takeAd(st, a);
  } else if (room.id === "news") {
    const cands = [...G.newsOffers].sort((a, b) => b.q - a.q);
    for (const n of cands) if (st.news.length < 3 && n.price < st.money - 60000) buyNews(st, n);
  } else if (room.id === "jury") {
    if (st.giftDay !== G.day && st.money > 150000) { st.money -= 20000; st.giftDay = G.day; st.favor = Math.min(st.image * 2, 100, st.favor + 8); }
  } else if (room.id === "r1" || room.id === "r2") {
    const from = HOURS.findIndex((h, i) => !slotLocked(i));
    if (from >= 0) autoPlan(st, from);
  }
}
function buyProgram(st, p) {
  st.money -= p.price; st.progs.push(p);
  G.market = G.market.filter(x => x !== p);
  if (st.i !== 0) logMsg(`${st.name} kauft „${p.title}“.`, false, "info");
}
function takeAd(st, a) { st.contracts.push(a); G.adOffers = G.adOffers.filter(x => x !== a); }
function buyNews(st, n) { st.money -= n.price; st.news.push(n); G.newsOffers = G.newsOffers.filter(x => x !== n); }

// ---------- Figuren & Aufzug ----------
const WALK = 42; // Einheiten pro Spielminute
function setTarget(a, floor, x, room) {
  if (a.mode === "room") return;
  a.target = { floor, x, room };
  a.bubble = "";
  if (a.mode === "lift") return;
  if (a.mode === "waitLift") {
    if (floor !== a.floor) return;
    lift.queue = lift.queue.filter(q => q.actor !== a);
  }
  a.mode = "walk";
}
function updateActor(a, dm) {
  const st = G.stations[a.st];
  if (a.st !== 0 && st.ai) {
    if (a.mode === "idle" && st.ai.queue.length && G.min >= st.ai.next && G.min < DAY_END - 30) {
      const r = RM[st.ai.queue.shift()];
      setTarget(a, r.f, r.x, r.id);
    }
  }
  if (a.mode === "walk") {
    const goal = a.target.floor !== a.floor ? LIFT_X : a.target.x;
    const d = goal - a.x;
    const step = WALK * dm;
    if (Math.abs(d) <= step) {
      a.x = goal;
      if (a.target.floor !== a.floor) { a.mode = "waitLift"; lift.queue.push({ actor: a, floor: a.floor }); }
      else if (a.target.room) tryEnter(a);
      else { a.mode = "idle"; a.target = null; }
    } else { a.x += Math.sign(d) * step; a.face = Math.sign(d); }
  } else if (a.mode === "waitDoor") {
    tryEnter(a);
  } else if (a.mode === "room" && a.st !== 0) {
    a.timer -= dm;
    if (a.timer <= 0) { leaveRoom(a); st.ai.next = G.min + ri(4, 18); }
  }
}
function tryEnter(a) {
  const r = RM[a.target.room];
  if (r.owner !== undefined && r.owner !== a.st) {
    if (a.st === 0) toast(`Abgeschlossen. Das ist das Büro von ${r.name}.`);
    a.mode = "idle"; a.target = null; return;
  }

let lastT = performance.now();

      const s = Math.min(dm, 0.5); dm -= s;
      const prev = G.min; G.min += s;
      if (Math.floor(G.min / 60) > Math.floor(prev / 60)) {
        const idx = HOURS.indexOf(Math.floor(G.min / 60));

function openPicker(kind, i) {

        return `<button class="pick" data-act="setProg" data-i="${i}" data-id="${p.id}" ${why ? "disabled" : ""}>
          <b>${esc(p.title)}</b>
          <span class="meta">${attr(p.q)}<span class="chip">${esc(p.genre)}</span>${p.fsk ? '<span class="chip fsk">FSK 18</span>' : ""}<span class="stars">${stars(fit(p.genre, hr))}</span><span>Akt. ${Math.round(p.topic * 100)} %</span><span>${p.len} Std.</span>${usedToday ? '<span class="chip warn">heute schon geplant</span>' : ""}${why ? `<span>${why}</span>` : ""}</span></button>`;
      }).join("");
  } else {
    const exp = expected(me, i);
    list = `<button class="pick" data-act="setAd" data-i="${i}" data-id=""><b>Keine Werbung</b><span class="meta">Erwartet ca. ${mio(exp)}</span></button>` +
      me.contracts.map(a => {
        const left = a.spots - a.done - plannedSpots(me, a.id) + (me.sched[i].ad === a.id ? 1 : 0);
        return `<button class="pick" data-act="setAd" data-i="${i}" data-id="${a.id}" ${left <= 0 ? "disabled" : ""}>
          <b>${esc(a.brand)} · ${eur(a.pay)}</b>
          <span class="meta"><span class="chip ${a.min <= exp * 0.95 ? "good" : "warn"}">mind. ${mio(a.min)}</span><span>${a.done}/${a.spots} gesendet</span><span>noch ${Math.max(0, left)} einplanbar</span><span>Frist ${a.days} T.</span></span></button>`;
      }).join("");
  }
  openModal(`<header><h2>${hr}:00 Uhr · ${kind === "prog" ? "Programm wählen" : "Werbespot wählen"}</h2><button class="btn sm" data-act="closeModal">Abbrechen</button></header><div class="dbody"><div class="picklist">${list}</div></div>`, true);
}

// ---------- Aktionen ----------
function act(b) {
  if (b.dataset.act === "new") { closeModal(); newGame(); paused = false; setSpeedUI(); return; }
  if (b.dataset.act === "load") { if (load()) { closeModal(); startDay(); paused = false; setSpeedUI(); } return; }
  if (!G) return;
  const me = G.stations[0];
  const id = b.dataset.id ? +b.dataset.id : null, i = b.dataset.i !== undefined ? +b.dataset.i : null;
  switch (b.dataset.act) {
    case "leave": leaveCurrentRoom(); return;
    case "gooffice": { const r = RM.office; setView("tower"); setTarget(player, r.f, r.x, r.id); if (paused) { paused = false; setSpeedUI(); } return; }
    case "tab": officeTab = b.dataset.k; break;
    case "buy": { const p = G.market.find(x => x.id === id); if (p && p.price <= me.money) { buyProgram(me, p); toast(`„${p.title}“ gekauft.`); } break; }
    case "ad": { const a = G.adOffers.find(x => x.id === id); if (a && me.contracts.length < 6) { takeAd(me, a); toast(`Vertrag mit ${a.brand} geschlossen.`); } break; }
    case "news": { const n = G.newsOffers.find(x => x.id === id); if (n && me.news.length < 3) { buyNews(me, n); toast("Meldung gekauft."); } break; }
    case "sell": { const p = progOf(me, id); if (p) { me.money += r1000(p.price * 0.4); me.progs = me.progs.filter(x => x !== p); toast(`„${p.title}“ verkauft.`); } break; }
    case "credit": me.money += 100000; me.credit += 100000; toast("Kredit über 100.000 € erhalten."); break;
    case "repay": me.money -= 100000; me.credit -= 100000; toast("100.000 € zurückgezahlt."); break;
    case "gift": {
      const [c, f] = [[5000, 3], [20000, 8], [60000, 18]][+b.dataset.k];
      me.money -= c; me.giftDay = G.day; me.favor = Math.min(me.image * 2, 100, me.favor + f);
      toast("Die Jury bedankt sich."); break;
    }
    case "pickProg": openPicker("prog", i); return;
    case "pickAd": openPicker("ad", i); return;
    case "closeModal": closeModal(); return;
    case "setProg": {
      if (openRoom !== "office" || cellLocked(me, i)) break;
      const p = id ? progOf(me, id) : null;
      if (p && canPlace(p, i)) break;
      setProg(me, i, p);
      me.sched.forEach((c, k) => { if (!c.p && !slotLocked(k)) c.ad = null; });
      closeModal(); break;
    }
    case "setAd": if (openRoom === "office" && !slotLocked(i)) me.sched[i].ad = id; closeModal(); break;
    case "auto": {
      const from = HOURS.findIndex((h, k) => !slotLocked(k));
      if (from >= 0) { autoPlan(me, from); toast("Offene Plätze wurden gefüllt."); }
      break;
    }
    case "next": closeModal(); if (G.over) showEnd(); else nextDay(); return;
  }
  renderView(); renderHud(); renderLive();
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b || b.disabled) return;
  act(b);
});

  openModal(`<header><h2>Sendeschluss · Tag ${G.day}</h2></header><div class="dbody">
    <div class="tiles">
      <div class="tile"><small>Image</small><b>${me.image}</b><span class="${dImg >= 0 ? "win" : ""}">${dImg >= 0 ? "+" : ""}${dImg} heute</span></div>
      <div class="tile"><small>Werbung</small><b>${eur(me.income)}</b><span>Einnahmen</span></div>
      <div class="tile"><small>Kosten & Strafen</small><b>${eur(-me.costs - me.penalties)}</b><span>Fixkosten, Zinsen</span></div>
      <div class="tile"><small>Saldo</small><b>${eur(dMoney)}</b><span>Kontostand ${eur(me.money)}</span></div>
    </div>
    <section class="panel"><div class="tbl"><table><thead><tr><th>Mio. Zuschauer</th>${G.stations.map(s => `<th class="num">${esc(s.name)}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div></section>
    <p class="lead">Jury-Ansehen: ${G.stations.map(s => `${esc(s.name)} ${Math.round(s.favor)}`).join(" · ")}</p>
    ${report.length ? `<section class="panel"><div class="inbox">${report.map(r => `<div class="msg warn"><i></i><span>${esc(r)}</span><time></time></div>`).join("")}</div></section>` : ""}
    <div class="actions"><button class="btn primary" data-act="next">${G.over ? "Weiter" : "Nächster Tag"}</button></div></div>`);
}
function showEnd() {
  const o = G.over;
  clearSave();
  openModal(`<div class="hero"><p>${o.win ? "Saisonende · Sieg" : "Saisonende"}</p><h1>${o.win ? "GOLDENE <em>QUOTE</em>" : "SENDE<em>SCHLUSS</em>"}</h1><p>${esc(o.why)}</p></div>
    <div class="dbody"><p class="lead">Gespielt: ${G.day} ${G.day === 1 ? "Tag" : "Tage"} · Endstand Image ${G.stations.map(s => `${esc(s.name)} ${s.image}`).join(", ")}</p>
    <div class="actions"><button class="btn primary" data-act="new">Neues Spiel</button></div></div>`);
}

// ---------- Speichern (nur lokal im Browser) ----------
const KEY = "quotenturm-v1";
function save() { try { localStorage.setItem(KEY, JSON.stringify(G)); } catch (e) { /* ohne Speicher spielbar */ } }
function hasSave() { try { return !!localStorage.getItem(KEY); } catch (e) { return false; } }
function load() { try { const s = localStorage.getItem(KEY); if (!s) return false; G = JSON.parse(s); return true; } catch (e) { return false; } }
function clearSave() { try { localStorage.removeItem(KEY); } catch (e) { /* egal */ } }

// ---------- Start ----------
function start(data) {
  resize();
  lift = { y: 0, queue: [], occ: null, phase: "idle", timer: 0 };
  if (data && data.G && !data.G.over) {
    G = data.G; const m = G.min; startDay(); G.min = m; paused = false; setSpeedUI();
  } else showStart();
  requestAnimationFrame(t => { lastT = t; tick(t); });
}
if (window.claude && window.claude.hot && typeof window.claude.hot.snapshot === "function") {
  window.claude.hot.snapshot(() => ({ G }));
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
</body>
