<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quotenturm</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Quotenturm">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: Manager-Portal im Stil moderner Fußball-Manager – dunkle Navy-Kopfleiste mit Senderwappen, Hauptmenü, Datum und „Weiter“,
   Untermenüzeile, darunter Dashboard aus Panels. Akzentfarbe Violett, Senderfarbe nur im Wappenblock. */
:root {
  --bg: #0b0e1c;
  --panel: #121629;
  --panel-2: #191e36;
  --row: #151a2f;
  --line: #262c47;
  --text: #f2f3f8;
  --muted: #9aa3b8;
  --club: #e3a019;
  --club-ink: #15110a;
  --club-sub: #10142a;
  --hot: #b265ff;
  --hot-2: #e0218a;
  --violet: #7b2ff7;
  --grad: linear-gradient(90deg, #7b2ff7, #e0218a);
  --top: #0e1124;
  --good: #22c55e;
  --mid: #eab308;
  --bad: #ef4444;
  --font-head: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Inter", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0; color: var(--text); font-family: var(--font-body); font-size: 14.5px; line-height: 1.4;
  background: var(--bg);
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation; overflow: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--hot); outline-offset: 2px; }
#app { height: 100%; display: grid; grid-template-rows: auto auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); }

/* Kopfleiste */
#top {
  display: flex; align-items: center; gap: 14px; background: var(--top); color: var(--text); border-bottom: 1px solid var(--line);
  padding-block: 8px; min-height: 56px;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
}
.histbtns { display: flex; gap: 2px; }
.histbtns button { width: 38px; height: 46px; border: 0; background: var(--panel-2); color: var(--text); font-size: 20px; font-weight: 700; }
.histbtns button:first-child { border-radius: 6px 0 0 6px; } .histbtns button:last-child { border-radius: 0 6px 6px 0; }
.histbtns button:disabled { opacity: .35; cursor: default; }
#topCrest { display: grid; place-items: center; min-width: 58px; height: 46px; padding: 0 8px; box-sizing: border-box; position: relative; border-radius: 3px;
  background: linear-gradient(135deg, var(--club), color-mix(in srgb, var(--club) 35%, #1b2a6b)); }
#topCrest img.logo { max-height: 34px; max-width: 110px; object-fit: contain; }
#topCrest::before, #topCrest::after { content: ""; position: absolute; width: 8px; height: 8px; border: 2px solid rgba(255,255,255,.75); }
#topCrest::before { left: 3px; top: 3px; border-right: 0; border-bottom: 0; }
#topCrest::after { right: 3px; bottom: 3px; border-left: 0; border-top: 0; }
#mainnav { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; min-width: 0; }
#mainnav::-webkit-scrollbar { display: none; }
#mainnav button { background: transparent; border: 0; font-family: var(--font-head); font-weight: 700; font-size: 19px; letter-spacing: .01em; padding: 8px 6px 8px 8px; white-space: nowrap; position: relative; color: var(--text); display: flex; align-items: center; gap: 3px; border-radius: 4px; }
#mainnav button svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; transition: transform .15s; }
#mainnav button.open { background: var(--panel-2); color: var(--hot); }
#mainnav button.open svg { transform: rotate(180deg); }
#mainnav button.on { color: var(--hot); }
#mainnav button:hover { color: var(--hot); }
#dropdown { position: fixed; z-index: 45; width: 280px; background: var(--panel-2); border: 1px solid var(--line); border-top: 2px solid var(--hot); border-radius: 0 0 8px 8px; box-shadow: 0 18px 40px rgba(0,0,0,.55); padding: 6px; display: grid; gap: 2px; }
#dropdown .dd-head { font-family: var(--font-head); font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); padding: 6px 10px 4px; }
#dropdown button { background: transparent; border: 0; border-radius: 6px; text-align: left; padding: 9px 10px; display: grid; gap: 1px; min-height: 44px; }
#dropdown button:hover { background: #232a4a; }
#dropdown button.on { background: var(--violet); }
#dropdown button.on span { color: rgba(255,255,255,.8); }
#dropdown button b { font-weight: 600; font-size: 15px; }
#dropdown button span { font-size: 13px; color: var(--muted); }
#dropdown .cnt { background: var(--hot-2); color: #fff; border-radius: 999px; padding: 0 7px; font-size: 12px; }
#mainnav button.on::after { content: ""; position: absolute; left: 50%; bottom: 0; width: 16px; height: 3px; transform: translateX(-50%); background: var(--hot); border-radius: 2px; }
.top-spacer { flex: 1; }
.datewrap { display: flex; align-items: center; gap: 10px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 4px 12px; height: 46px; box-sizing: border-box; white-space: nowrap; }
.datebox { line-height: 1.15; }
.datebox b { display: block; font-family: var(--font-head); font-weight: 700; font-size: 18px; }
.datebox span { font-size: 12px; color: var(--muted); }
.timebox { color: var(--hot); font-family: var(--font-head); font-weight: 700; font-size: 22px; font-variant-numeric: tabular-nums; }
#cont { background: var(--grad); color: #fff; border: 0; border-radius: 4px; height: 46px; min-width: 190px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; gap: 20px; font-family: var(--font-head); font-weight: 700; font-size: 20px; }
#cont svg { width: 22px; height: 22px; stroke: #fff; fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
#cont.busy { background: linear-gradient(90deg, #3d1a7a, #6d1446); }

/* Untermenü */
#subbar {
  display: flex; align-items: center; gap: 14px; background: var(--club-sub); border-bottom: 1px solid var(--line);
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  min-height: 44px; overflow-x: auto; scrollbar-width: none;
}
#subbar::-webkit-scrollbar { display: none; }
#subbar .sec { font-family: var(--font-head); font-weight: 700; font-size: 16px; padding-right: 12px; border-right: 1px solid var(--line); color: var(--text); white-space: nowrap; }
#subtabs { display: flex; gap: 2px; }
#subtabs button { background: transparent; border: 0; color: var(--muted); padding: 11px 9px; white-space: nowrap; font-size: 14px; font-weight: 500; position: relative; }
#subtabs button.on { color: var(--hot); }
#subtabs button:hover { color: var(--text); }
#subtabs button.on::after { content: ""; position: absolute; left: 9px; right: 9px; bottom: 6px; height: 2px; background: var(--hot); }
.quick { margin-left: auto; display: flex; gap: 4px; }
.quick button { background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 5px 11px; white-space: nowrap; font-size: 14px; display: flex; align-items: center; gap: 6px; color: var(--text); }
.ico { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }

/* Inhalt */
#content { overflow-y: auto; min-height: 0; padding: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: max(24px, env(safe-area-inset-bottom, 0px)); -webkit-overflow-scrolling: touch; }
.grid { display: grid; gap: 14px; align-items: start; }
.dash { grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); }
.two { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
.col { display: grid; gap: 14px; min-width: 0; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; min-width: 0; }
.ph { display: flex; align-items: center; gap: 10px; padding: 12px 14px 10px; flex-wrap: wrap; }
.ph h2 { margin: 0; font-family: var(--font-head); font-weight: 700; font-size: 20px; color: var(--hot); letter-spacing: .01em; flex: 1; }
.ph .aside { color: var(--muted); font-size: 13px; }
.st { font-family: var(--font-head); font-weight: 700; font-size: 20px; color: var(--hot); margin: 0; }
.st-wrap { padding: 12px 14px 6px; }
.pad { padding: 0 14px 14px; }
.lead { margin: 0; color: var(--muted); max-width: 76ch; }
.mb { margin-bottom: 14px; }
.page-title { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.page-title h1 { margin: 0; font-family: var(--font-head); font-weight: 700; font-size: 32px; line-height: 1; }
.page-title .grow { flex: 1; min-width: 0; }

/* Tabellen */
.tbl { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { text-align: left; font-size: 13px; font-weight: 500; color: var(--muted); padding: 6px 10px; white-space: nowrap; }
td { padding: 7px 10px; white-space: nowrap; vertical-align: middle; }
tbody tr:nth-child(odd) td { background: var(--row); }
tbody tr:hover td { background: #1f2644; }
tr.mine td { background: rgba(178,101,255,.12) !important; }
td.num, th.num { text-align: right; }
td.title { white-space: normal; min-width: 170px; }
.marker td:first-child { box-shadow: inset 3px 0 0 var(--c); }
.attr { display: inline-grid; place-items: center; min-width: 30px; height: 22px; border-radius: 3px; font-family: var(--font-head); font-weight: 700; font-size: 15px; color: #0b0e1c; padding: 0 3px; }
.a4 { background: #22c55e; } .a3 { background: #84cc16; } .a2 { background: #eab308; } .a1 { background: #f97316; } .a0 { background: #ef4444; }
.chip { display: inline-block; font-size: 12px; padding: 2px 7px; border-radius: 4px; border: 1px solid #343b5c; color: var(--muted); white-space: nowrap; }
.chip.fsk { background: var(--bad); border-color: var(--bad); color: #fff; }
.chip.live { background: var(--hot); border-color: var(--hot); color: #fff; }
.chip.real { border-color: rgba(178,101,255,.7); color: #cfa5ff; }
.chip.good { border-color: rgba(34,197,94,.6); color: var(--good); }
.chip.warn { border-color: rgba(234,179,8,.6); color: var(--mid); }
.mbar { width: 70px; height: 5px; border-radius: 3px; background: #262c47; overflow: hidden; display: inline-block; vertical-align: middle; }
.mbar i { display: block; height: 100%; background: var(--muted); }
.muted { color: var(--muted); }
.up { color: var(--good); } .down { color: var(--bad); }
.res { display: inline-flex; align-items: center; gap: 6px; }
.res i { width: 11px; height: 11px; border-radius: 50%; }
.res i.w { background: var(--good); } .res i.l { border: 2px solid var(--bad); width: 9px; height: 9px; } .res i.d { background: var(--mid); }
.stars { color: var(--club); letter-spacing: 1px; }
.legend { display: flex; gap: 14px; padding: 8px 14px 12px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.legend span::before { content: ""; display: inline-block; width: 3px; height: 11px; margin-right: 6px; background: var(--c); vertical-align: -1px; }

/* Buttons & Formulare */
.btn { background: var(--panel-2); border: 1px solid #333a5e; border-radius: 4px; padding: 7px 12px; min-height: 36px; font-weight: 600; font-size: 14px; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn.hot { background: var(--grad); border-color: transparent; color: #fff; }
.btn.violet { background: var(--violet); border-color: var(--violet); color: #fff; }
.btn:disabled { opacity: .35; cursor: not-allowed; }
.pills { display: flex; gap: 4px; flex-wrap: wrap; }
.pills button { background: transparent; border: 1px solid #333a5e; border-radius: 4px; padding: 6px 11px; font-size: 14px; }
.pills button.on { background: var(--violet); border-color: var(--violet); color: #fff; }
select, input[type=number] { background: var(--panel-2); color: var(--text); border: 1px solid #333a5e; border-radius: 4px; padding: 7px 10px; font: inherit; min-height: 36px; }
input[type=number] { width: 130px; }

/* Nachrichten */
.msgs { display: grid; }
.mday { background: #1a2038; color: var(--muted); font-size: 13px; padding: 7px 14px; }
.msg { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; padding: 11px 14px; border-bottom: 1px solid var(--line); }
.msg .from { font-size: 14px; color: var(--muted); }
.msg .tag { justify-self: end; }
.msg .txt { font-size: 17px; color: #c9ced6; line-height: 1.25; }
.msg time { align-self: end; font-size: 14px; color: var(--muted); }
.msg.new .txt { color: var(--text); font-weight: 500; }

/* News-Karte */
.hero { margin: 0 14px; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); background: var(--panel-2); }
.hero-img { height: 150px; position: relative; display: flex; align-items: center; justify-content: center; gap: 22px;
  background: repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 2px, transparent 2px 46px), linear-gradient(180deg, #6b7380, #3b414b); }
.hero-img .score { font-family: var(--font-head); font-weight: 700; font-size: 42px; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,.5); font-variant-numeric: tabular-nums; white-space: nowrap; text-align: center; line-height: 1; }
.hero-img .score small { display: block; font-size: 13px; font-weight: 600; letter-spacing: .1em; opacity: .85; margin-bottom: 4px; }
.hero-body { padding: 12px 14px; display: grid; gap: 6px; }
.hero-body h3 { margin: 0; font-size: 20px; font-weight: 700; line-height: 1.2; text-wrap: balance; }
.hero-body p { margin: 0; color: #c2c7cf; }
.hero-meta, .nmeta { display: flex; gap: 10px; align-items: center; color: var(--muted); font-size: 13px; flex-wrap: wrap; }
.nitem { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); align-items: center; }
.nitem .thumb { width: 64px; height: 52px; border-radius: 4px; background: linear-gradient(135deg, #e6246e, #7c3aed); display: grid; place-items: center; font-family: var(--font-head); font-weight: 700; font-size: 13px; color: #fff; }
.nitem b { display: block; font-size: 15px; line-height: 1.25; }

/* Statistik-Liste */
.slist { display: grid; }
.srow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 9px 14px; align-items: center; }
.srow:nth-child(odd) { background: var(--row); }
.srow b { font-weight: 600; font-size: 16px; }
.srow span { color: #c2c7cf; display: flex; align-items: center; gap: 6px; min-width: 0; }
.srow em { font-style: normal; font-family: var(--font-head); font-weight: 700; font-size: 20px; grid-row: 1 / 3; grid-column: 2; text-align: right; }

/* Rechte Spalte */
.goal { padding: 6px 14px 12px; display: grid; gap: 6px; }
.goal .row { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.track { height: 8px; border-radius: 4px; background: #2a2f37; overflow: hidden; position: relative; }
.track i { display: block; height: 100%; }
.track b { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; }
.fixture { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; padding: 6px 14px 14px; }
.fixture .side { display: flex; align-items: center; gap: 8px; min-width: 0; }
.fixture .side:last-child { justify-content: flex-end; text-align: right; }
.fixture .t { border: 1px solid var(--line); background: #0f1114; border-radius: 4px; padding: 6px 12px; font-family: var(--font-head); font-weight: 700; font-size: 18px; }
.rings { display: flex; gap: 14px; padding: 4px 14px 12px; flex-wrap: wrap; }
.ring { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 14px; }
.ring b { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--c, #fff); display: grid; place-items: center; color: var(--text); font-size: 14px; }
.form { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; padding: 4px 14px 14px; text-align: center; font-size: 13px; color: var(--muted); }
.form div { display: grid; gap: 5px; justify-items: center; }
.form i { width: 100%; height: 26px; border-radius: 4px; background: #2a2f37; display: grid; place-items: center; font-style: normal; font-weight: 600; color: #0b0d10; font-size: 12px; }
.form i.w { background: var(--good); } .form i.l { background: var(--bad); } .form i.d { background: var(--mid); }

/* Sendeplan */
.plan td { padding: 0; }
.plan .hr { font-family: var(--font-head); font-weight: 700; font-size: 20px; padding: 0 12px; }
.plan tr.prime .hr { color: var(--club); }
.cell { width: 100%; background: transparent; border: 0; text-align: left; padding: 8px 10px; min-height: 52px; display: grid; gap: 1px; align-content: center; }
.cell:not(:disabled):hover { background: rgba(178,101,255,.1); }
.cell:disabled { cursor: default; }
.cell .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 36ch; }
.cell .s { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 42ch; }
.cell.bad .t { color: var(--bad); }
.cell.cont .t { color: var(--muted); }
.plan td.r { padding: 0 12px; text-align: right; }

/* Live-Regie */
.live-head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 14px; padding: 16px 18px; background: linear-gradient(180deg, #232830, var(--panel)); border-bottom: 1px solid var(--line); }
.live-clock { font-family: var(--font-head); font-weight: 700; font-size: 54px; line-height: 1; text-align: center; font-variant-numeric: tabular-nums; }
.live-clock small { display: block; font-size: 13px; letter-spacing: .14em; color: var(--hot); }
.wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; padding: 12px; }
.mon { background: #0d0f13; border: 1px solid var(--line); border-radius: 6px; padding: 9px 10px; display: grid; gap: 5px; min-width: 0; }
.mon.me { border-color: var(--club); box-shadow: 0 0 0 1px var(--club) inset; }
.mon-top { display: flex; align-items: center; gap: 8px; min-width: 0; }
.mon-top b { font-family: var(--font-head); font-size: 16px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mon-top span { font-family: var(--font-head); font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
.mon-t { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lbar { height: 6px; border-radius: 3px; background: #2a2f37; overflow: hidden; }
.lbar i { display: block; height: 100%; transition: width .35s ease; }
.chart { display: block; width: 100%; height: auto; }
.chart text { font-family: var(--font-body); font-size: 11px; fill: var(--muted); }

.daytabs { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.daytabs button { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 7px 4px; font-family: var(--font-head); font-weight: 700; font-size: 17px; display: grid; gap: 1px; }
.daytabs button span { font-family: var(--font-body); font-weight: 400; font-size: 12px; color: var(--muted); }
.daytabs button.on { background: var(--violet); border-color: var(--violet); }
.daytabs button.on span { color: #e9ddff; }
.plan tr.dp td { background: #1a2038 !important; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .1em; padding: 5px 12px; }
.sn { display: inline-flex; align-items: center; gap: 7px; }
.sbadge { display: inline-block; font-family: var(--font-head); font-weight: 700; font-size: 12px; padding: 1px 6px; border-radius: 3px; background: var(--c); color: #fff; text-shadow: 0 1px 1px rgba(0,0,0,.4); }
img.logo { object-fit: contain; flex: 0 0 auto; }
label { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

.stages { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; padding: 0 14px 14px; }
.stage { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; display: grid; gap: 6px; align-content: start; }
.stage.done { border-color: rgba(34,197,94,.5); }
.row-s { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.event-head { display: grid; gap: 6px; }
.event-head .chip { justify-self: start; }
.event-head h3 { margin: 0; font-size: 22px; line-height: 1.2; text-wrap: balance; }
.event-card { border-color: var(--hot); }
.fgrid { display: grid; gap: 12px; }
.field { display: grid; gap: 4px; }
.field > span { font-size: 13px; color: var(--muted); }
.field select, .field input[type=text] { width: 100%; background: var(--panel-2); color: var(--text); border: 1px solid #353b45; border-radius: 4px; padding: 8px 10px; font: inherit; min-height: 40px; }

.rules b { display: block; font-family: var(--font-head); font-size: 16px; color: var(--text); text-transform: uppercase; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.tile { background: var(--panel-2); border-radius: 6px; padding: 10px 12px; display: grid; gap: 1px; }
.tile small { color: var(--muted); font-size: 13px; }
.tile b { font-family: var(--font-head); font-weight: 700; font-size: 26px; font-variant-numeric: tabular-nums; }
.tile span { font-size: 13px; color: var(--muted); }
.picklist { display: grid; gap: 6px; max-height: 62vh; overflow-y: auto; }
.pick { width: 100%; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 9px 12px; text-align: left; display: grid; gap: 4px; }
.pick:hover:not(:disabled) { border-color: var(--hot); }
.pick:disabled { opacity: .35; cursor: not-allowed; }
.pick .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; }
.fine { font-size: 13px; color: var(--muted); margin: 0; }
#toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); background: var(--panel-2); border: 1px solid var(--line); border-left: 4px solid var(--hot); border-radius: 6px; padding: 10px 14px; max-width: min(420px, calc(100% - 32px)); z-index: 60; opacity: 0; transform: translateY(8px); transition: opacity .2s, transform .2s; pointer-events: none; box-shadow: 0 12px 30px rgba(0,0,0,.5); }
#toast.show { opacity: 1; transform: none; }

@media (max-width: 1260px) {
  #top { gap: 10px; }
  #mainnav button { font-size: 17px; padding: 8px 4px 8px 6px; }
  #cont { min-width: 150px; }
}
@media (max-width: 900px) {
  #top { flex-wrap: wrap; }
  #mainnav { order: 5; width: 100%; }
  .datebox span, .quick { display: none; }
  #cont { min-width: 0; }
  .live-head { grid-template-columns: 1fr; text-align: center; }
  .live-head .actions { justify-content: center !important; }
}
@media (max-width: 520px) {
  .histbtns, .datebox { display: none; }
  .live-clock { font-size: 40px; }
  .hero-img .score { font-size: 32px; }
}
@media (prefers-reduced-motion: reduce) { .lbar i, #toast { transition: none; } }
</style>

    const dry = Math.floor((G.day - (S.lastHit || G.day)) / 14);

  const svod = shares ? S.subs * 1e6 * shares.reduce((a, sh, k) => a + sh * S.tiers[k], 0) / 30 * (campaign ? 0.85 : 1) * arpuFactor(S) : 0;

      logMsg("Casting", "Personal", `${p.name} unterschreibt exklusiv bei ${P.name}: ${n.weeks} Wochen, ${eur(offer)} pro Woche${n.clauses.length ? ` · Klauseln: ${n.clauses.map(k => CLAUSES[k].name).join(", ")}` : ""}.`, true);
    }
    if (n.ctx === "slot" && draft) { draft.cast[n.slot] = p.id; draft.deals = draft.deals || {}; if (n.type === "proj") draft.deals[p.id] = { fee: offer, clauses: n.clauses.slice() }; }
    if (n.ctx === "anchor") G.newsroom.anchor = p.id;
    p.pat = Math.min(100, pPat(p) + 10);
    nego = null; closeModal(); toast(`Deal! ${p.name} ist an Bord.`); render(); return;
  }
  const ratio = offer / floor;
  p.pat = Math.max(0, pPat(p) - (ratio >= 0.8 ? 30 : 55));
  if (p.pat <= 0) {
    p.ban = G.day + BLOCK_DAYS;
    const rivals = ["rtl", "pro7"].filter(id => id !== P.id);
    let extra = "";
    if (Math.random() < 0.6) { p.holder = pick(rivals); p.until = G.day + ri(60, 200); extra = ` Kurz darauf meldet ${holderName(p.holder)} die Verpflichtung.`; }

  renderNego();
}

// Nachrichtenredaktion
function newsroomCalc() {
  const N = G.newsroom, a = N.anchor ? person(N.anchor) : null;
  const ser = a ? a.talent : 45;
  const budgetF = [0, 33, 66, 100][N.budget];
  const match = a ? Math.max(0, 100 - Math.abs(a.lean - (N.line - 2)) * 35) : 60;
  const cred = Math.round(ser * 0.5 + budgetF * 0.3 + match * 0.2 - (N.style === 2 ? 12 : N.style === 0 ? -5 : 0));
  const extreme = Math.abs(N.line - 2);
  const adF = Math.round((1 - 0.1 * extreme - (N.style === 2 ? 0.05 : 0) + (N.style === 0 && extreme === 0 ? 0.05 : 0)) * 100) / 100;
  const q = clamp(Math.round(35 + cred * 0.5 + (N.style === 2 ? 8 : 0) + (a ? a.buzz * 0.05 : 0)), 20, 99);
  const cost = [0, 60000, 150000, 300000][N.budget] + (N.style === 0 ? 50000 : 0);
  return { a, cred, adF, q, cost, extreme, match };
}
function newsroomDay() {
  const P = me(), c = newsroomCalc(), N = G.newsroom;
  P.progs.filter(p => p.genre === "Nachrichten").forEach(p => { p.q = c.q; p.topic = Math.max(p.topic, 0.5 + 0.1 * c.extreme); });
  if (N.style === 0 && c.cred >= 70) P.favor += 0.3;
  if (N.style === 2) { P.favor = Math.max(0, P.favor - 0.3); if (Math.random() < 0.06) { const fine = r1000(rnd(30000, 90000)); book(P, "Strafen", -fine); P.conf = clamp(P.conf - 1, 0, 100); logMsg("Landesmedienanstalt", "Nachrichten", `Prüfverfahren wegen verletzter Sorgfaltspflicht: Ein Boulevard-Beitrag fiel auf eine Falschmeldung herein. Bußgeld ${eur(fine)}.`, true); } }
  if (c.extreme === 2 && Math.random() < 0.15) {
    const k = [...P.contracts].sort((a, b) => b.pay - a.pay)[0];
    logMsg("Medien-Insider", "Nachrichten", `Kritik an ${P.name}: Die Nachrichten verlassen nach Ansicht vieler Beobachter den Boden der Ausgewogenheit.${k ? ` ${k.brand} zieht sein Werbebudget zurück.` : ""}`, true);
    if (k) { P.contracts = P.contracts.filter(x => x !== k); allPlans(P).forEach(d => d.forEach(s => { if (s.ad === k.id) s.ad = null; })); buildToday(P); }

  }
}

  // Bietergefecht um begehrte Titel: reiche Sender schnappen Topware schnell weg

  if (hot && st.money > hot.price * 1.5 && Math.random() < 0.18 * (st.base / 8 + 0.5)) {
    G.market = G.market.filter(x => x !== hot); applyLicense(hot, pick([1, 2])); st.progs.push(hot);
    logMsg("Branchendienst", "Konkurrenz", `Bietergefecht entschieden: ${st.name} sichert sich ${hot.kind === "film" ? "den begehrten Film" : "die begehrte Serie"} „${hot.title}“${hot.imdb ? ` (IMDb ${hot.imdb[0].toLocaleString("de-DE")})` : ""}.`);
    bought = true;
  }
  if (!bought && st.type === "privat" && Math.random() < 0.3) {
    const cands = G.market.filter(p => STATIONS[st.i].profile.includes(p.genre)).sort((a, b) => b.q - a.q);
    if (cands[0]) { G.market = G.market.filter(x => x !== cands[0]); applyLicense(cands[0], pick([1, 2])); st.progs.push(cands[0]); logMsg("Branchendienst", "Konkurrenz", `${st.name} sichert sich ${cands[0].kind === "film" ? "den Film" : "die Lizenz für"} „${cands[0].title}“.`); }
  }
  st.progs = st.progs.filter(p => !(p.kind === "film" && p.runs >= p.maxRuns) && !(p.kind === "serie" && !p.own && p.ep >= (p.maxEp || p.eps * 2)) && !(p.until && p.until < G.day));
  if (st.progs.length < 20) st.progs.push(makeFiller(pick(STATIONS[st.i].profile), st));
  st.news = Math.random() < 0.6 ? [{ q: ri(30, 80) }, { q: ri(30, 80) }] : [];
  const wd = weekday(G.day);
  planDayFor(st, wd); buildToday(st);
}

function lineChart() {
  const W = 640, H = 200, pl = 36, pr = 10, pt = 12, pb = 24;
  const P = me();
  const done = HOURS.filter(i => G.today[i]);
  const leaders = standings().slice(0, 3).map(x => x.s.i).filter(i => i !== G.me);
  const series = [G.me, ...leaders.slice(0, 2)];
  const maxV = Math.max(10, ...done.flatMap(i => series.map(k => G.today[i][k].ma))) * 1.15;
  const x = i => pl + i * (W - pl - pr) / 23, y = v => pt + (H - pt - pb) * (1 - v / maxV);
  let svg = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Marktanteil je Stunde">`;
  for (let k = 0; k <= 4; k++) { const v = maxV / 4 * k; svg += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="#2a2f37"/><text x="${pl - 6}" y="${y(v) + 4}" text-anchor="end">${Math.round(v)}</text>`; }
  [0, 6, 12, 18, 20, 23].forEach(i => { svg += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${i}</text>`; });
  svg += `<line x1="${pl}" x2="${W - pr}" y1="${y(P.target)}" y2="${y(P.target)}" stroke="#e3a019" stroke-dasharray="4 4"/>`;
  for (const k of series.slice().reverse()) {
    const pts = done.map(i => `${x(i)},${y(G.today[i][k].ma)}`).join(" ");
    if (!pts) continue;
    svg += `<polyline points="${pts}" fill="none" stroke="${STATIONS[k].color}" stroke-width="${k === G.me ? 3 : 2}" stroke-linejoin="round"/>`;
    const li = done[done.length - 1];
    svg += `<circle cx="${x(li)}" cy="${y(G.today[li][k].ma)}" r="${k === G.me ? 4.5 : 3.5}" fill="${STATIONS[k].color}"/>`;
  }
  return svg + `</svg><div class="legend">${series.map(k => `<span style="--c:${STATIONS[k].color}">${esc(STATIONS[k].name)}</span>`).join("")}<span style="--c:#e3a019">Ihr Ziel</span></div>`;
}

  </div>`;

    case "moveCancel": moveSrc = null; break;
    case "fillAll": if (!planLocked()) { fillHorizon(P); const c = planCheck(P); toast(c.firstBad == null ? `Der Assistent hat den Kalender bis ${dateShort(c.until)} lückenlos gefüllt.` : `Noch ${c.holes} Stunden offen.`); } break;
    case "toPlanDay": closeModal(); planDay = wd; go("plan"); return;
    case "pickAd": openPicker("ad", i, wd); return;
    case "swap": openPicker("prog", i, G.day, true); return;
    case "swapTo": {
      const p = progOf(P, id);
      if (G.phase === "live" && G.min < i * 60 && p && p.len === 1 && !canPlace(P, P.sched, p, i)) {
        clearAt(P, P.sched, i); P.sched[i].p = p.id; P.sched[i].cont = false;
        logMsg("Live-Regie", "Warnung", `Programmänderung: Um ${hh(i)} läuft jetzt „${p.title}“.`, true);
      }
      closeModal(); break;
    }
    case "adbreak": if (G.phase === "live" && G.min < i * 60) G.adBreak[i] = !G.adBreak[i]; break;
    case "setProg": {
      if (wd === G.day && planLocked()) break;
      const p = id ? progOf(P, id) : null;
      editPlan(wd, sc => {
        if (p && canPlace(P, sc, p, i)) return;
        placeAt(P, sc, i, p);
        sc.forEach(c => { if (!c.p) c.ad = null; });
      });
      closeModal(); break;
    }
    case "setAd": if (!(wd === G.day && planLocked())) editPlan(wd, sc => { sc[i].ad = id; }); closeModal(); break;
  }
  render();
}

const isFiction = p => p.kind === "serie" || ["Serie", "Krimi", "Soap", "Sitcom", "Komödie", "Drama"].includes(p.genre);

    ["Publikumsliebling Serie", p => p.kind === "serie" || ["Soap", "Sitcom"].includes(p.genre), p => (p.bestMA || 0) * 3 + p.q * 0.3]] },

function awardDay(a, fromDay) {
  for (let d = fromDay; d < fromDay + 370; d++) { const dt = dateOf(d); if (dt.getMonth() === a.m && dt.getDate() === a.d) return d; }
  return null;
}
function awardRace(cat) {
  const seen = new Set(), out = [];
  for (const st of G.stations) for (const p of st.progs) {
    if (p.filler || p.kind === "sport" || seen.has(p.title) || !(p.lastAired >= G.day - 365) || !cat[1](p)) continue;
    seen.add(p.title); out.push({ p, st, s: cat[2](p) });
  }
  return out.sort((a, b) => b.s - a.s);
}
function awardsDay() {
  for (const a of AWARDS) {
    const day = awardDay(a, G.day);
    if (day === G.day + 10) {
      const noms = a.cats.map(c => [c[0], awardRace(c).slice(0, 4)]);
      const mine = noms.flatMap(([c, l]) => l.filter(x => isMe(x.st)).map(x => `„${x.p.title}“ (${c})`));
      logMsg("Medien-Insider", "Preise", `${a.name}: Die Nominierungen stehen fest – Verleihung am ${dateShort(day)}.${mine.length ? ` Ihr Sender ist nominiert mit ${mine.join(", ")}.` : ""}`, mine.length > 0);
    }
    if (day !== G.day) continue;
    const res = [];
    for (const c of a.cats) {
      const noms = awardRace(c).slice(0, 4);
      if (!noms.length) continue;
      const win = noms.map(x => ({ ...x, r: x.s * rnd(0.9, 1.1) })).sort((x, y) => y.r - x.r)[0];
      win.p.q = Math.min(99, win.p.q + 3); win.p.topic = Math.min(1, (win.p.topic || 1) + 0.15);
      win.st.brand += 0.15; win.st.favor += 5;
      if (isMe(win.st)) win.st.conf = clamp(win.st.conf + 4, 0, 100);
      for (const n of noms) if (n !== win && isMe(n.st)) n.st.brand += 0.03;
      res.push({ cat: c[0], title: win.p.title, st: win.st.id, noms: noms.map(n => [n.p.title, n.st.id]) });
    }
    if (!res.length) continue;
    (G.awards = G.awards || []).push({ id: a.id, name: a.name, day: G.day, res });
    const myWins = res.filter(r => r.st === me().id);
    logMsg("Medien-Insider", "Preise", `${a.name} verliehen: ${res.map(r => `${r.cat} – „${r.title}“ (${holderName(r.st)})`).join(" · ")}`, true);
    if (myWins.length) logMsg("Senderleitung", "Preise", `Glückwunsch! ${myWins.length} ${a.name}${myWins.length > 1 ? "e" : ""} für ${me().name}: ${myWins.map(r => `„${r.title}“`).join(", ")}. Image und Vertrauen steigen.`);
  }
}

function idbReq(store, mode, fn) {

// ---------------------------------------------------------------------
// Excel-Import (xlsx) über SheetJS – wird nur bei Bedarf geladen
// ---------------------------------------------------------------------
const XLSX_SRC = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
function loadXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((res, rej) => { const s = document.createElement("script"); s.src = XLSX_SRC; s.onload = () => res(window.XLSX); s.onerror = () => rej(new Error("Excel-Modul konnte nicht geladen werden (offline?). Alternativ als CSV speichern.")); document.head.appendChild(s); });
}
async function readSheetRows(file) {
  const X = await loadXLSX();
  const wb = X.read(await file.arrayBuffer(), { type: "array" });
  const sheet = wb.SheetNames.includes("Profile") ? "Profile" : wb.SheetNames[0]; // Vita-Dateien: Blatt „Profile“
  return X.utils.sheet_to_json(wb.Sheets[sheet], { defval: "" });
}
const starCount = v => { const s = String(v ?? ""); const n = (s.match(/[⭐★]/g) || []).length; return n || num(s, 0); };
// Zeile aus den Personen-Tabellen (Moderatoren / Schauspieler DACH / International) in einen Editor-Eintrag umwandeln
// ---------------------------------------------------------------------
// Vita-Format (Wikidata/Wikipedia): Geburtsjahr, Herkunft, Kurzvita, belegte Arbeiten mit Rolle, IMDb-Link
// Bekanntheit und Fähigkeiten gibt es dort nicht – das Spiel leitet Spielwerte aus den belegten Arbeiten ab.
// ---------------------------------------------------------------------
const GAME_YEAR = 2026;
const COUNTRY = { deutschland: "DE", österreich: "AT", schweiz: "CH", "vereinigte staaten": "US", "vereinigtes königreich": "GB", frankreich: "FR", italien: "IT", spanien: "ES", kanada: "CA", australien: "AU", irland: "IE", niederlande: "NL", belgien: "BE", dänemark: "DK", schweden: "SE", norwegen: "NO", polen: "PL", türkei: "TR", japan: "JP", "südkorea": "KR", mexiko: "MX", neuseeland: "NZ", indien: "IN", brasilien: "BR" };
let GAME_TITLES = null;
const gameTitleSet = () => GAME_TITLES || (GAME_TITLES = new Set(FILM_DB.concat(SERIES_DB).map(r => normT(r[0]))));
function rowToVitaPerson(o) {
  const name = String(pickKey(o, ["name"]) ?? "").trim().slice(0, 60);
  const wd = String(pickKey(o, ["wikidata-id"]) ?? "").trim(), id = wd || String(pickKey(o, ["id"]) ?? "").trim();
  if (!name || !id) return null;
  const works = String(pickKey(o, ["ausgewählte arbeiten / stationen"]) ?? "").trim();
  const items = works.split(";").map(x => { const m = x.match(/^(.*?)\s*\[([^\]]*)\]\s*$/); return m ? [m[1].trim(), m[2].trim()] : [x.trim(), ""]; }).filter(x => x[0]);
  const fields = String(pickKey(o, ["berufsfelder (datenbank)"]) ?? "").toLowerCase();
  const role = /nachrichten/.test(fields) ? "Nachrichten" : /moderation/.test(fields) ? "Moderation" : /journalis/.test(fields) ? "Journalismus" : "Schauspiel";
  const year = Math.round(num(pickKey(o, ["geburtsjahr"]), 0));
  const country = String(pickKey(o, ["staatsangehörigkeit / landbezug"]) ?? "").split(/[;,/]/)[0].trim();
  // Spielwert Bekanntheit: Zahl der belegten Arbeiten, Treffer im Spiel, Popularität laut IMDb-Wertungen (falls importiert)
  let hits = 0, votes = 0;
  for (const [t] of items) { const k = normT(t); if (gameTitleSet().has(k)) hits++; const s = IMDB_SCORES.get(k); if (s) { hits++; votes = Math.max(votes, s[1]); } }
  const r = seeded(hashStr(id));
  const fame = clamp(Math.round(16 + items.length * 5 + hits * 12 + (votes ? Math.log10(votes) * 4 : 0) + r() * 8), 8, 97);
  const talent = clamp(Math.round(30 + fame * 0.45 + r() * 22), 15, 96), charisma = clamp(Math.round(25 + fame * 0.5 + r() * 20), 15, 96);
  return { eindeutige_id: wd ? wd : "VITA-" + id, name, rolle: role, talent, charisma, skandal: 30, gage: autoGage(talent, charisma), manual: false,
    alter: year > 1900 ? GAME_YEAR - year : null, herkunft: COUNTRY[country.toLowerCase()] || country.slice(0, 14) || "", sprachen: "",
    bekanntheit: fame, bekannt_aus: items.map(x => x[0]).slice(0, 12).join("; "), sender: "", treffer: hits,
    vita: String(pickKey(o, ["kurzvita (deutsch)"]) ?? "").slice(0, 900), werke: items.slice(0, 20).map(x => x.join("|")).join("; "),
    ausbildung: String(pickKey(o, ["ausbildung / hochschule (belegt)"]) ?? "").slice(0, 200), institutionen: String(pickKey(o, ["berufliche institutionen (belegt)"]) ?? "").slice(0, 200),
    imdb_url: String(pickKey(o, ["imdb-profil"]) ?? "").slice(0, 80), quelle: String(pickKey(o, ["biografiequelle"]) ?? "").slice(0, 160), geburtsort: String(pickKey(o, ["geburtsort / geburtsregion"]) ?? "").slice(0, 60) };
}
// Personen aus dem lokalen Datenbestand, die ins laufende Spiel übernommen werden (internationale nur mit Bezug zu Titeln im Spiel)
const playable = e => !e.vita || e.herkunft === "DE" || e.herkunft === "AT" || e.herkunft === "CH" || e.rolle !== "Schauspiel" || (e.treffer || 0) > 0;
function rowToPerson(o, prefix, clean) {
  const id = String(pickKey(o, ["eindeutige_id", "id"]) ?? "").trim(), name = String(pickKey(o, ["name"]) ?? "").trim().slice(0, 60);
  if (!id || !name) return null;
  const genre = String(pickKey(o, ["genre", "genre & inhalt"]) ?? ""), langs = String(pickKey(o, ["sprachkenntnisse", "sprachen"]) ?? "");
  let role = ROLE_ALIASES[String(pickKey(o, ["rolle", "role"]) ?? "").toLowerCase()];
  if (!role) role = /nachricht/i.test(genre) ? "Nachrichten" : /reality/i.test(genre) ? "Reality" : /doku|reportage/i.test(genre) ? "Journalismus" : langs ? "Schauspiel" : "Moderation";
  const stars = starCount(pickKey(o, ["bekanntheitsgrad", "rating", "bekanntheit"]));
  const fame = clamp(stars <= 5 ? stars * 19 : stars, 5, 100);
  const r = seeded(hashStr(prefix + id));
  let age = Math.round(num(pickKey(o, ["alter (2026)", "alter", "age"]), 0)) || null;
  let status = String(pickKey(o, ["beschäftigungsstatus", "status"]) ?? "");
  let known = String(pickKey(o, ["hauptformat / bekannt aus", "hauptformat", "bekannt aus", "bekannt_aus"]) ?? "").replace(/\*/g, "").trim();
  const at = String(pickKey(o, ["primärer sender/plattform", "primäre plattform/studio", "sender", "plattform"]) ?? "").trim();
  if (clean) {
    if (age && (age < 16 || age > 95)) age = clamp(age, 16, 95);
    if (/ruhestand/i.test(status) && age && age < 60) status = "Aktiv (Freischaffend)";
    known = ""; // zufällige Zuordnungen zu echten Serien nicht übernehmen
  }
  const origin = String(pickKey(o, ["herkunft", "origin"]) ?? "").trim();
  const talent = clamp(Math.round(fame * 0.65 + 15 + r() * 20), 10, 100), charisma = clamp(Math.round(fame * 0.7 + 10 + r() * 20), 10, 100);
  return { eindeutige_id: prefix + id, name, rolle: role, talent, charisma, skandal: 35, gage: autoGage(talent, charisma), manual: false,
    alter: age, herkunft: ({ Deutschland: "DE", Österreich: "AT", Schweiz: "CH" })[origin] || origin.slice(0, 12) || "DE", sprachen: langs.replace(/\s*\([^)]*\)/g, "").slice(0, 80) || "Deutsch",
    bekanntheit: fame, bekannt_aus: known.slice(0, 160), sender: at.slice(0, 40), status: status.slice(0, 40), ruhestand: /ruhestand/i.test(status) };

// Muster generierter Einträge: „Der Bergdoktor (ORF)“, „*WDR Kulturreport*“, „Kinofilm …“, „Erfolgreiche Netflix-Original-Serie …“
const FAKE_CREDIT = /\((ARD|ZDF|ORF|SRF|RTL|Sat\.1|ProSieben|VOX|Netflix|Sky|3sat|ARTE|ServusTV|Prime)[^)]*\)|^\s*Kinofilm |Erfolgreiche|Original-Serie|\*/i;
function importPrefix(fname) { const f = fname.toLowerCase(); return f.includes("moderator") ? "MOD-" : f.includes("international") ? "INT-" : f.includes("dach") || f.includes("schauspiel") ? "DACH-" : "IMP-"; }
async function importPeopleFile(file) {
  const rows = /\.xlsx?$/i.test(file.name) ? await readSheetRows(file) : parseFile(await file.text(), file.name);
  // Editor-Format (Talent, Charisma, Gage …): IDs unverändert, nur gelieferte Felder überschreiben
  if (rows.length && ["talent", "charisma", "skandal", "basis_gage", "gage"].some(k => pickKey(rows[0], [k]) !== undefined)) {
    const have = new Map(loadDB().people.map(e => [e.eindeutige_id, e]));
    const clean = rows.map(o => { const eid = String(pickKey(o, ["eindeutige_id", "id"]) ?? "").trim(), e = have.get(eid);
      return cleanPerson(e ? { eindeutige_id: e.eindeutige_id, name: e.name, rolle: e.rolle, talent: e.talent, charisma: e.charisma, skandal: e.skandal, basis_gage: e.manual ? e.gage : undefined, ...o } : o); }).filter(Boolean);
    const r = upsert(loadDB().people, clean, "eindeutige_id");
    await storeDBAsync();
    return { rows: rows.length, add: r.add, upd: r.upd, dup: 0, bad: rows.length - clean.length, gen: 0, prefix: "(eigene IDs)" };
  }
  // Vita-Format: Wikidata-ID als eindeutige_id; vorhandene Einträge gleichen Namens werden ergänzt statt doppelt angelegt
  if (rows.length && pickKey(rows[0], ["ausgewählte arbeiten / stationen"]) !== undefined) {
    const D = loadDB(), byName = new Map(D.people.map(e => [e.name.toLowerCase(), e]));
    let add = 0, upd = 0, bad = 0;
    const fresh = [];
    for (const o of rows) {
      const e = rowToVitaPerson(o); if (!e) { bad++; continue; }
      const old = byName.get(e.name.toLowerCase());
      if (old) { // vorhandene Angaben behalten, Titel zusammenführen
        const known = [...new Set(String(old.bekannt_aus || "").split(/;\s*/).concat(e.bekannt_aus.split(/;\s*/)).filter(Boolean))].join("; ");
        Object.assign(old, e, { eindeutige_id: old.eindeutige_id, rolle: old.rolle || e.rolle, bekannt_aus: known, sender: old.sender || e.sender, herkunft: old.herkunft || e.herkunft, bekanntheit: Math.max(old.bekanntheit || 0, e.bekanntheit) }); upd++;
      }

  const seen = new Set(), out = []; let dup = 0, bad = 0, gen = 0;

// ---------------------------------------------------------------------
// IMDb-Import: offizielle Dateien title.ratings, title.basics (optional title.akas) – .tsv oder .tsv.gz
// Nur für den privaten Gebrauch; die Dateien lädt der Spieler selbst von IMDb herunter.
// ---------------------------------------------------------------------
async function* tsvLines(file) {
  let stream = file.stream();
  if (/\.gz$/i.test(file.name)) stream = stream.pipeThrough(new DecompressionStream("gzip"));
  const reader = stream.pipeThrough(new TextDecoderStream()).getReader();
  let buf = "";
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += value;
    let i;
    while ((i = buf.indexOf("\n")) >= 0) { yield buf.slice(0, i); buf = buf.slice(i + 1); }
  }
  if (buf) yield buf;
}
const IMDB_GENRE = { crime: "Krimi", mystery: "Krimi", comedy: "Komödie", family: "Komödie", animation: "Komödie", drama: "Drama", history: "Drama", biography: "Drama", war: "Action", romance: "Liebesfilm", action: "Action", adventure: "Action", thriller: "Action", western: "Action", horror: "Action", "sci-fi": "Science-Fiction", fantasy: "Science-Fiction", documentary: "Doku", "reality-tv": "Reality", "talk-show": "Talk", news: "Nachrichten", "game-show": "Show", music: "Kultur", musical: "Kultur", sport: "Doku" };
async function importIMDb(files, max, progress) {
  const by = n => files.find(f => f.name.toLowerCase().includes(n));
  const fr = by("title.ratings"), fb = by("title.basics"), fa = by("title.akas");
  if (!fr || !fb) throw new Error("Bitte mindestens title.ratings und title.basics auswählen (gleichzeitig).");
  const rat = new Map(); let n = 0;
  for await (const l of tsvLines(fr)) { const [id, avg, votes] = l.split("\t"); if (+votes >= 3000) rat.set(id, [+avg, +votes]); if (++n % 200000 === 0) progress(`Bewertungen: ${n.toLocaleString("de-DE")} Zeilen`); }
  const keep = [];
  n = 0;
  for await (const l of tsvLines(fb)) {
    if (++n % 300000 === 0) progress(`Titel: ${n.toLocaleString("de-DE")} Zeilen`);
    const c = l.split("\t"); const r = rat.get(c[0]);
    if (!r || !["movie", "tvSeries", "tvMiniSeries", "tvMovie"].includes(c[1]) || c[4] === "1" || +c[5] < 1950) continue;
    keep.push({ id: c[0], type: c[1], title: c[2], orig: c[3], year: +c[5], mins: +c[7] || 100, genres: c[8], avg: r[0], votes: r[1] });
  }
  keep.sort((a, b) => b.votes - a.votes);
  // Wertungen für alle bewerteten Titel merken (auch über die Titelauswahl hinaus), deutsche Titel inklusive
  if (fa) {
    const want = new Map(keep.map(k => [k.id, k])); n = 0;
    for await (const l of tsvLines(fa)) { if (++n % 500000 === 0) progress(`Deutsche Titel: ${n.toLocaleString("de-DE")} Zeilen`); const c = l.split("\t"); if (c[3] === "DE" && want.has(c[0]) && c[2]) want.get(c[0]).de = c[2]; }
  }
  const scores = new Map();
  for (const k of keep) for (const t of [k.de, k.title, k.orig]) { const key = t && normT(t); if (key && (!scores.has(key) || scores.get(key)[1] < k.votes)) scores.set(key, [k.avg, k.votes]); }
  IMDB_SCORES = scores;
  if (IDB.db) await idbSet("quotenturm-imdb-scores", [...scores]).catch(() => {});
  keep.length = Math.min(keep.length, max);
  const T = loadTitles(), rows = keep.map(k => {
    const g = k.genres.split(",").map(x => IMDB_GENRE[x.toLowerCase()]).find(Boolean) || "Drama", tv = k.type !== "movie" && k.type !== "tvMovie";
    return { eindeutige_id: "imdb_" + k.id, title: (k.de || k.title).slice(0, 80), genre: g, q: clamp(Math.round(20 + k.avg * 7.5), 20, 94), tv, eps: tv ? 13 : 0, len: k.mins > 140 ? 3 : 2, year: k.year, fsk: /horror/i.test(k.genres) ? 16 : ["Krimi", "Action"].includes(g) ? 12 : 0, pop: k.votes };
  });
  const r = upsert(T, rows, "eindeutige_id");
  T.sort((a, b) => b.pop - a.pop); if (T.length > TITLE_MAX) T.length = TITLE_MAX;
  await storeTitlesAsync();
  return { add: r.add, upd: r.upd, total: T.length, scores: scores.size };
}
async function storeDBAsync() { if (IDB.db) { try { await idbSet(DB_KEY, EDB); return true; } catch (e) { /* weiter */ } } return storeDB(); }
async function storeTitlesAsync() { if (IDB.db) { try { await idbSet(TITLE_KEY, TITLES); return true; } catch (e) { /* weiter */ } } return storeTitles(); }

const KEY = "quotenturm-v7";
