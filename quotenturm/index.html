<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quotenturm</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Quotenturm">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow+Condensed:wght@400;500;600;700&family=VT323&display=swap">
<style>
/* Layout: HUD oben, Hochhaus (Canvas) in der Mitte, Live-Quotenleiste unten; Räume öffnen sich als Seitenblatt. Bewusst ein dunkles „Sendeturm bei Nacht“-Design. */
:root {
  --night: #0d1330;
  --deep: #141b3d;
  --panel: #19214a;
  --line: #2c3668;
  --ink: #f3efe4;
  --muted: #a3abd0;
  --amber: #ffb21a;
  --cyan: #3ad1e6;
  --pink: #ff5d8f;
  --onair: #ff3b3b;
  --good: #5ee08a;
  --warn: #ffcc4d;
  --font-display: "Bungee", "Arial Black", Impact, sans-serif;
  --font-body: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-screen: "VT323", "Courier New", monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--night);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
#app { height: 100%; display: flex; flex-direction: column; }

/* HUD */
#hud {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--deep); border-bottom: 1px solid var(--line);
}
.logo { font-family: var(--font-display); color: var(--amber); font-size: 20px; letter-spacing: .02em; line-height: 1; }
.logo small { display: block; font-family: var(--font-body); color: var(--muted); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; margin-top: 3px; }
.clock { font-family: var(--font-screen); font-size: 40px; line-height: .8; color: var(--ink); min-width: 4ch; }
.onair { font-family: var(--font-display); font-size: 11px; padding: 3px 6px; border-radius: 3px; background: var(--line); color: var(--muted); letter-spacing: .06em; }
.onair.live { background: var(--onair); color: #fff; animation: pulse 1.6s infinite; }
@keyframes pulse { 50% { opacity: .55; } }
.money { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 22px; }
.money.neg { color: var(--onair); }
.stat-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }
.imagebar { flex: 1 1 200px; min-width: 160px; display: grid; gap: 3px; }
.bar3 { display: flex; height: 14px; border-radius: 3px; overflow: hidden; background: var(--line); }
.bar3 span { display: block; height: 100%; transition: width .6s; }
.bar3-legend { display: flex; justify-content: space-between; font-size: 13px; font-variant-numeric: tabular-nums; }
.speed { display: flex; gap: 4px; }
.speed button { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; min-width: 44px; height: 40px; font-weight: 700; }
.speed button.on { background: var(--amber); color: var(--night); border-color: var(--amber); }

/* Bühne */
#stage { position: relative; flex: 1; min-height: 0; }
#tower { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#toast {
  position: absolute; left: 50%; top: 14px; transform: translateX(-50%);
  background: var(--panel); border: 1px solid var(--amber); color: var(--ink);
  padding: 8px 14px; border-radius: 8px; font-weight: 600; max-width: min(90%, 520px); text-align: center;
  pointer-events: none; opacity: 0; transition: opacity .25s;
}
#toast.show { opacity: 1; }

/* Live-Leiste */
#live {
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px;
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--deep); border-top: 1px solid var(--line);
}
.live-cell { min-width: 0; border-left: 4px solid var(--c); padding-left: 8px; }
.live-cell b { font-family: var(--font-display); font-size: 12px; color: var(--c); font-weight: 400; }
.live-cell div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 15px; }
.live-cell .v { font-variant-numeric: tabular-nums; color: var(--muted); }

/* Raum-Blatt */
#panel {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(640px, 100%);
  background: var(--panel); border-left: 1px solid var(--line);
  display: flex; flex-direction: column; z-index: 20;
  box-shadow: -20px 0 40px rgba(0,0,0,.45);
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-right: env(safe-area-inset-right, 0px);
}
.panel-head { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.panel-head h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 22px; line-height: 1.05; text-wrap: balance; }
.panel-head p { margin: 2px 0 0; color: var(--muted); font-size: 14px; letter-spacing: .06em; text-transform: uppercase; }
.panel-head .grow { flex: 1; min-width: 0; }
.panel-clock { font-family: var(--font-screen); font-size: 28px; color: var(--muted); }
.btn { background: var(--deep); border: 1px solid var(--line); border-radius: 8px; padding: 9px 14px; font-weight: 600; min-height: 44px; }
.btn.primary { background: var(--amber); color: var(--night); border-color: var(--amber); }
.btn.danger { border-color: var(--onair); color: var(--onair); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.panel-body { flex: 1; overflow-y: auto; padding: 14px 16px 24px; -webkit-overflow-scrolling: touch; display: grid; gap: 14px; align-content: start; }
.intro { margin: 0; color: var(--muted); line-height: 1.35; max-width: 62ch; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tabs button { background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; min-height: 40px; font-weight: 600; }
.tabs button.on { background: var(--ink); color: var(--night); border-color: var(--ink); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.card { background: var(--deep); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.card h3 { margin: 0; font-size: 19px; line-height: 1.1; text-wrap: balance; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 14px; color: var(--muted); }
.chip { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; padding: 2px 7px; border-radius: 4px; background: var(--line); color: var(--ink); font-weight: 600; }
.chip.fsk { background: var(--onair); color: #fff; }
.chip.good { background: var(--good); color: var(--night); }
.chip.warn { background: var(--warn); color: var(--night); }
.qbar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.qbar span { display: block; height: 100%; background: var(--amber); }
.row-end { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.price { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 18px; }
.empty { color: var(--muted); font-style: italic; }

/* Sendeplan */
.plan { display: grid; gap: 6px; }
.slot { display: grid; grid-template-columns: 58px minmax(0, 1fr) minmax(0, .8fr); gap: 6px; align-items: stretch; }
.slot .hour { font-family: var(--font-screen); font-size: 28px; line-height: 1; display: flex; flex-direction: column; justify-content: center; }
.slot .hour small { font-family: var(--font-body); font-size: 11px; color: var(--muted); letter-spacing: .05em; text-transform: uppercase; }
.cell { text-align: left; background: var(--deep); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; min-height: 52px; min-width: 0; display: grid; gap: 2px; align-content: center; }
.cell .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cell .s { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cell.locked { opacity: .55; cursor: default; }
.cell.cont { border-style: dashed; }
.cell.bad { border-color: var(--onair); }
.slot.prime .hour { color: var(--amber); }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 15px; }
th, td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--muted); font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; }
td.win { color: var(--good); font-weight: 700; }

/* Auswahl */
#picker { position: absolute; inset: 0; background: rgba(8, 11, 28, .78); display: flex; align-items: flex-end; justify-content: center; z-index: 5; }
.picker-box { background: var(--panel); border-top: 2px solid var(--amber); width: 100%; max-height: 82%; display: flex; flex-direction: column; }
.picker-box header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.picker-box header h3 { margin: 0; flex: 1; font-size: 20px; }
.picker-list { overflow-y: auto; padding: 10px 16px 20px; display: grid; gap: 8px; }
.pick { text-align: left; background: var(--deep); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; display: grid; gap: 3px; }
.pick:disabled { opacity: .35; }

/* Vollbild-Overlays */
.overlay {
  position: fixed; inset: 0; z-index: 40; background: rgba(8, 11, 28, .9);
  display: flex; align-items: center; justify-content: center; overflow-y: auto;
  padding-block: max(20px, env(safe-area-inset-top, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.sheet { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; width: min(760px, 100%); padding: 22px; display: grid; gap: 14px; margin: auto; }
.sheet h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(34px, 7vw, 64px); line-height: .95; color: var(--amber); text-wrap: balance; }
.sheet h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 26px; text-wrap: balance; }
.sheet p, .sheet li { line-height: 1.4; max-width: 66ch; }
.sheet ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.sheet .actions { display: flex; gap: 10px; flex-wrap: wrap; }
.testcard { height: 14px; border-radius: 3px; background: linear-gradient(90deg, #fff 0 14%, #ffe600 14% 28%, #19e3ff 28% 42%, #19d35a 42% 57%, #ff3bd4 57% 71%, #ff2b2b 71% 85%, #2a3cff 85%); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.kpi { background: var(--deep); border-radius: 10px; padding: 10px 12px; border-top: 3px solid var(--c, var(--line)); }
.kpi b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; }
.kpi span { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.feed { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 15px; max-height: 180px; overflow-y: auto; }
.feed li { border-left: 3px solid var(--line); padding-left: 8px; }
.meter { height: 12px; background: var(--line); border-radius: 6px; overflow: hidden; position: relative; }
.meter span { display: block; height: 100%; background: var(--amber); }
.meter i { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); }

@media (max-width: 640px) {
  body { font-size: 16px; }
  .clock { font-size: 32px; }
  .logo { font-size: 16px; }
  #live { grid-template-columns: 1fr; gap: 4px; }
  .slot { grid-template-columns: 48px minmax(0, 1fr); }
  .slot .cell.ad { grid-column: 2; }
}
@media (prefers-reduced-motion: reduce) {
  .onair.live { animation: none; }
  .bar3 span { transition: none; }
}
</style>
</head>
<body>

<div id="app">
  <header id="hud">
    <div class="logo">KANAL 13<small id="hudDay">Tag 1</small></div>
    <div style="display:flex;align-items:center;gap:8px">
      <div class="clock" id="hudClock">08:00</div>
      <span class="onair" id="hudAir">Sendepause</span>
    </div>
    <div>
      <div class="stat-label">Kontostand</div>
      <div class="money" id="hudMoney">0 €</div>
    </div>
    <div class="imagebar">
      <div class="stat-label">Senderimage (100 Punkte)</div>
      <div class="bar3" id="hudBar"></div>
      <div class="bar3-legend" id="hudLegend"></div>
    </div>
    <div class="speed" role="group" aria-label="Spieltempo">
      <button id="spPause" aria-label="Pause">II</button>
      <button data-speed="1" class="on">1×</button>
      <button data-speed="2">2×</button>
      <button data-speed="3">3×</button>
    </div>
  </header>
  <div id="stage">
    <canvas id="tower" aria-label="Das Sender-Hochhaus. Tippen Sie auf eine Tür, um dorthin zu gehen."></canvas>
    <div id="toast" role="status" aria-live="polite"></div>
  </div>
  <footer id="live"></footer>
</div>

<aside id="panel" hidden>
  <div class="panel-head">
    <div class="grow"><h2 id="pTitle">Raum</h2><p id="pSub"></p></div>
    <span class="panel-clock" id="pClock">08:00</span>
    <button class="btn" id="pPause" aria-label="Pause">II</button>
    <button class="btn primary" id="pLeave">Raum verlassen</button>
  </div>
  <div class="panel-body" id="pBody"></div>
  <div id="picker" hidden></div>
</aside>

<div class="overlay" id="ovl" hidden><div class="sheet" id="ovlSheet"></div></div>

<script>
"use strict";
// ---------- Grunddaten ----------
const HOURS = [16, 17, 18, 19, 20, 21, 22, 23];
const BASE = [1.0, 1.4, 2.0, 2.6, 3.6, 3.8, 3.0, 1.8]; // Mio. Zuschauer vor dem Fernseher je Stunde
const OUTSIDE = 34; // „Abschalten“ als vierte Option
const MS_PER_MIN = 170; // Echtzeit pro Spielminute bei 1×
const DAY_START = 8 * 60, DAY_END = 24 * 60;
const STATION_DEF = [
  { name: "KANAL 13", color: "#ffb21a", skin: "#c68a5c" },
  { name: "FLIMMER TV", color: "#3ad1e6", skin: "#f0c8a2" },
  { name: "SONNENKANAL", color: "#ff5d8f", skin: "#8d5a3b" },
];
const GENRES = {
  "Liebesfilm": [20], "Action": [21, 22], "Monumental": [20], "Komödie": [20],
  "Krimi": [18, 19], "Kultur": [22], "Show": [20], "Science-Fiction": [20], "Serie": [18, 19],
};
const TITLES = {
  "Liebesfilm": ["Herzklopfen in Husum", "Liebe auf Gleis 7", "Ein Sommer am Chiemsee", "Rosen für Rosemarie", "Küsse unter Kastanien", "Verliebt in Meran", "Zwei Herzen im Funkloch", "Der Antrag von Rimini"],
  "Action": ["Turbo-Alarm", "Explosion über Duisburg", "Kommando Mitternacht", "Stahlfaust", "Die Jagd nach dem Goldkoffer", "Vollgas auf der A9", "Zone 9", "Feuer im Hafen"],
  "Monumental": ["Das Goldene Imperium", "Die Wikinger von Haithabu", "Barbarossa", "Sturm über Karthago", "Die Pharaonin", "Der Turm von Babel"],
  "Komödie": ["Hilfe, die Schwiegermutter kommt", "Urlaub mit Opa", "Chaos in der WG", "Ein Kamel für Bielefeld", "Familie Krause zieht um", "Der Pinguin im Kofferraum", "Diät ab Montag", "Zwei Trottel auf Tour"],
  "Krimi": ["Spurensuche in Kreuzberg", "Der Fall Lenz", "Schatten über dem Moor", "Mord auf der Zugspitze", "Die tote Tante", "Kommissarin Kowalski", "Tod im Weinberg", "Der Schlüssel im Brunnen"],
  "Kultur": ["Oper am Abend: Fidelio", "Auf Bachs Spuren", "Museumsnacht live", "Lyrik um zehn", "Theater: Der zerbrochne Krug", "Bauhaus – Form und Idee", "Sinfonie der Großstadt", "Dürer und die Welt"],
  "Show": ["Das Quotenquiz", "Schlager-Karussell", "Wer kocht, gewinnt", "Samstagabend-Spektakel", "Die Talentgala", "Hausmusik XXL", "Das große Ratespiel"],
  "Science-Fiction": ["Raumschiff Gurke", "Die Marsbäcker", "Planet der Hausmeister", "Zeitreise nach Gestern", "Roboter Rudi", "Invasion aus dem Kleingarten", "Sternenstaub 2099"],
  "Serie": ["Die Hafenklinik", "Schrebergarten-Geschichten", "Revier 12", "Familie Brömmel", "Wache Ost", "Das Landarzt-Team", "Hotel Alpenglück", "Die Werkstatt"],
};
const BRANDS = ["Knusperflocken Kalle", "Autohaus Brummer", "Zahncreme Strahlweiß", "Bausparkasse Eigenheim+", "Limo Prickel", "Waschmittel Blütenrein", "Versicherung Sorgenfrei", "Katzenfutter Miezi", "Baumarkt Hammerhart", "Reisebüro Fernweh", "Brauerei Gipfelglück", "Möbel Gemütlich", "Strom von Wattmann", "Kaffee Morgenrot"];
const HEADLINES = [
  "Sturmtief zieht über Norddeutschland", "FC Bayern gewinnt Spitzenspiel deutlich", "Fachkräftemangel: Betriebe suchen händeringend",
  "DAX schließt auf Rekordhoch", "Landshuter Hochzeit lockt Zehntausende", "Europäische Sonde erreicht den Jupiter",
  "Streit um die Rentenreform", "Hitzewelle in Südeuropa", "Autoindustrie stellt neue E-Plattform vor",
  "Bahnstreik legt Fernverkehr lahm", "Lebensmittelpreise sinken leicht", "Neues Rekordjahr für Ausbildungsplätze",
  "Orkanböen auf der Zugspitze", "Forschungsteam entdeckt neue Käferart", "Großbrand in Lagerhalle gelöscht",
  "Weltraumteleskop liefert erste Bilder", "Pokal-Überraschung in der zweiten Runde", "Digitalisierung der Schulen kommt voran",
];
// Räume im Turm. Etage 0 = Erdgeschoss.
const FLOORS = 6, FH = 130, TOP = 120, W = 1000, H = TOP + FLOORS * FH + 34, LIFT_X = 500;
const ROOMS = [
  { id: "boss", f: 5, side: "L", name: "Intendanz", sub: "Chefetage · Kredite" },
  { id: "jury", f: 5, side: "R", name: "Goldene Antenne", sub: "Jury & Kulturstiftung" },
  { id: "r1", f: 4, side: "L", name: "FLIMMER TV", sub: "Büro der Konkurrenz", owner: 1 },
  { id: "r2", f: 4, side: "R", name: "SONNENKANAL", sub: "Büro der Konkurrenz", owner: 2 },
  { id: "office", f: 3, side: "L", name: "KANAL 13", sub: "Ihr Büro · Sendeplan", owner: 0 },
  { id: "archiv", f: 3, side: "R", name: "Archiv", sub: "Programme verkaufen" },
  { id: "ads", f: 2, side: "L", name: "Spotfabrik", sub: "Werbeagentur" },
  { id: "kantine", f: 2, side: "R", name: "Kantine", sub: "Gerüchte & Spionage" },
  { id: "market", f: 1, side: "L", name: "Filmkiste", sub: "Programmhandel" },
  { id: "news", f: 1, side: "R", name: "Ticker24", sub: "Nachrichtenagentur" },
];
ROOMS.forEach(r => { r.x = r.side === "L" ? 250 : 750; });
const RM = Object.fromEntries(ROOMS.map(r => [r.id, r]));

// ---------- Hilfsfunktionen ----------
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const r1000 = v => Math.round(v / 1000) * 1000;
const eur = v => (v < 0 ? "−" : "") + Math.abs(Math.round(v)).toLocaleString("de-DE") + " €";
const mio = v => v.toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " Mio.";
const hhmm = m => String(Math.floor(m / 60) % 24).padStart(2, "0") + ":" + String(Math.floor(m % 60)).padStart(2, "0");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
function fit(genre, h) {
  const d = Math.min(...GENRES[genre].map(b => Math.abs(b - h)));
  return Math.max(0.45, 1 - 0.13 * d);
}
const stars = f => f >= 0.9 ? "★★★" : f >= 0.7 ? "★★☆" : "★☆☆";
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// ---------- Spielzustand ----------
let G = null;           // speicherbarer Zustand
let actors = [], lift = null, player = null;
let paused = true, speed = 1, openRoom = null, officeTab = "plan";

function uid() { return ++G.idc; }
function newTitle(genre) {
  const base = pick(TITLES[genre]);
  let t = base, n = 1;
  while (G.used.includes(t)) { n++; t = base + (n === 2 ? " II" : n === 3 ? " III" : " " + n); }
  G.used.push(t);
  return t;
}
function makeProgram(qMin = 20, qMax = 95) {
  const genre = pick(Object.keys(GENRES));
  const q = ri(qMin, qMax);
  if (genre === "Serie") {
    const eps = ri(6, 13);
    return { id: uid(), title: newTitle(genre), genre, kind: "serie", q, len: 1, eps, ep: 0, topic: 1, fsk: false,
      price: r1000((6000 + q * q * 9) * (eps / 9) * rnd(0.85, 1.15)) };
  }
  let len = 1;
  if (genre === "Monumental") len = 2;
  else if (["Action", "Liebesfilm", "Komödie", "Science-Fiction", "Kultur"].includes(genre)) len = Math.random() < 0.45 ? 2 : 1;
  const fsk = ["Action", "Krimi", "Science-Fiction"].includes(genre) && Math.random() < 0.3;
  const price = r1000((8000 + q * q * 13) * (len === 2 ? 1.3 : 1) * (fsk ? 0.85 : 1) * rnd(0.85, 1.2));
  return { id: uid(), title: newTitle(genre), genre, kind: "film", q, len, topic: 1, fsk, price };
}
function makeAd() {
  const min = pick([0.15, 0.2, 0.3, 0.4, 0.5, 0.65, 0.8, 1.0, 1.2]);
  const spots = ri(2, 6);
  const pay = r1000(min * 42000 * rnd(0.85, 1.2) + 3000);
  return { id: uid(), brand: pick(BRANDS), min, spots, done: 0, days: spots + ri(1, 3), pay, penalty: r1000(pay * spots * 0.6) };
}
function makeNews() {
  const fresh = HEADLINES.filter(h => !G.newsOffers.some(n => n.title === h));
  const q = ri(15, 95);
  return { id: uid(), title: pick(fresh), q, price: r1000(2000 + q * q * 2.2) };
}
function emptySched() { return HOURS.map(() => ({ p: null, ad: null, cont: false })); }

function newGame() {
  G = { day: 1, min: DAY_START, idc: 0, used: [], market: [], adOffers: [], newsOffers: [], log: [], over: null, today: HOURS.map(() => null), stations: [] };
  G.stations = STATION_DEF.map((d, i) => ({
    i, name: d.name, color: d.color, money: 400000, credit: 0, image: i === 0 ? 34 : 33, favor: 0,
    progs: [], contracts: [], sched: emptySched(), news: [], last: HOURS.map(() => 0), hist: [],
    income: 0, giftDay: 0, imageStart: 0, moneyStart: 0,
  }));
  for (const st of G.stations) {
    for (let k = 0; k < 5; k++) st.progs.push(makeProgram(30, 65));
    for (let k = 0; k < 2; k++) { const a = makeAd(); a.min = pick([0.15, 0.2, 0.3]); a.pay = r1000(a.min * 42000 + 3000); a.penalty = r1000(a.pay * a.spots * 0.6); st.contracts.push(a); }
    autoPlan(st, 0);
  }
  refreshOffers(true);
  logMsg("Willkommen bei KANAL 13! Ihr Vorgänger hat einen Sendeplan hinterlassen. Ab 16:00 Uhr wird gesendet.");
  startDay();
}

function refreshOffers(first) {
  if (!first) {
    shuffle(G.market);
    G.market.splice(0, Math.min(4, G.market.length));
  }
  while (G.market.length < 9) G.market.push(makeProgram());
  G.adOffers = [];
  for (let k = 0; k < 6; k++) G.adOffers.push(makeAd());

  for (let k = 0; k < 5; k++) G.newsOffers.push(makeNews());

function logMsg(msg, toastIt) {

  if (toastIt) toast(msg);
}

// ---------- Sendeplan-Logik ----------
const progOf = (st, id) => st.progs.find(p => p.id === id);
const adOf = (st, id) => st.contracts.find(c => c.id === id);
function clearProgAt(st, i) {
  const c = st.sched[i];
  if (!c.p) return;
  const p = progOf(st, c.p);
  let start = c.cont ? i - 1 : i;
  st.sched[start].p = null; st.sched[start].cont = false;
  if (p && p.len === 2 && st.sched[start + 1]) { st.sched[start + 1].p = null; st.sched[start + 1].cont = false; }
  if (!p) { c.p = null; c.cont = false; }
}
function canPlace(p, i) {
  if (p.len === 2 && i >= HOURS.length - 1) return "Zu lang für den letzten Sendeplatz";
  if (p.fsk && HOURS[i] < 21) return "FSK 18 erst ab 21 Uhr";
  if (slotLocked(i) || (p.len === 2 && slotLocked(i + 1))) return "Sendeplatz läuft bereits";
  return "";
}
function setProg(st, i, p) {
  clearProgAt(st, i);
  if (!p) return;
  if (p.len === 2) clearProgAt(st, i + 1);
  st.sched[i].p = p.id; st.sched[i].cont = false;
  if (p.len === 2) { st.sched[i + 1].p = p.id; st.sched[i + 1].cont = true; }
}
const slotLocked = i => G.min >= HOURS[i] * 60;
// Fortsetzung eines bereits laufenden Zweistünders ist ebenfalls gesperrt
const cellLocked = (st, i) => slotLocked(i) || (st.sched[i].cont && slotLocked(i - 1));
function expected(st, i) { return st.last[i] || BASE[i] * 0.24; }
function plannedSpots(st, adId) { let n = 0; st.sched.forEach((c, i) => { if (!slotLocked(i) && c.ad === adId) n++; }); return n; }

// Automatischer Plan (KI und „Vorschlag“-Knopf), nur für noch nicht gesendete Plätze
function autoPlan(st, fromIdx) {
  for (let i = fromIdx; i < HOURS.length; i++) {
    if (st.sched[i].cont && i === fromIdx) continue; // Fortsetzung eines laufenden Films behalten
    st.sched[i].p = null; st.sched[i].cont = false; st.sched[i].ad = null;
  }
  const used = {};
  st.sched.forEach((c, i) => { if (i < fromIdx && c.p && !c.cont) used[c.p] = (used[c.p] || 0) + 1; });
  const order = HOURS.map((h, i) => i).filter(i => i >= fromIdx).sort((a, b) => BASE[b] - BASE[a]);
  for (const i of order) {
    if (st.sched[i].p) continue;
    let best = null, bestS = 0;
    for (const p of st.progs) {
      if (canPlace(p, i)) continue;
      if (p.len === 2 && st.sched[i + 1].p) continue;
      let s = p.q * fit(p.genre, HOURS[i]) * (0.35 + 0.65 * p.topic);
      if (used[p.id]) s *= 0.35;
      if (s > bestS) { bestS = s; best = p; }
    }
    if (best) { setProg(st, i, best); used[best.id] = (used[best.id] || 0) + 1; }
  }
  // Werbung: höchste Mindestquote, die sicher erreicht wird
  for (let i = fromIdx; i < HOURS.length; i++) {
    if (!st.sched[i].p) continue;
    const exp = expected(st, i) * 0.92;
    let best = null;
    for (const c of st.contracts) {
      const left = c.spots - c.done - plannedSpots(st, c.id);
      if (left <= 0 || c.min > exp) continue;
      if (!best || c.pay > best.pay) best = c;
    }
    if (best) st.sched[i].ad = best.id;
  }
}

// ---------- Sendung auswerten ----------
function airHour(i) {
  const h = HOURS[i];
  const res = G.stations.map(st => {
    const c = st.sched[i];
    const p = c.p ? progOf(st, c.p) : null;
    const newsMult = 1 + Math.min(st.news.reduce((a, n) => a + n.q, 0) / 3, 100) / 420;
    const imgMod = 1 + (st.image - 33) / 120;
    let A = 2;
    if (p) {
      A = p.q * fit(p.genre, h) * (0.35 + 0.65 * p.topic) * imgMod * newsMult * rnd(0.9, 1.1);
      if (c.cont) A *= 0.95;
      A = Math.max(1, A);
    }
    return { st, p, c, A };
  });
  const sum = res.reduce((a, r) => a + r.A, 0) + OUTSIDE;
  for (const r of res) {
    r.v = BASE[i] * r.A / sum;
    const st = r.st;
    st.last[i] = r.v;
    r.title = r.p ? r.p.title + (r.p.kind === "serie" ? ` (Folge ${(r.p.ep % r.p.eps) + 1})` : "") : "Testbild";
    if (r.p && !r.c.cont) {
      if (r.p.kind === "serie") { r.p.ep++; r.p.topic = Math.max(0.15, r.p.topic - (r.p.ep % r.p.eps === 0 ? 0.5 : 0.07)); }
      else r.p.topic = Math.max(0.1, r.p.topic * 0.68);
      if (r.p.genre === "Kultur" && h >= 21) st.favor = Math.min(st.image * 2, 100, st.favor + 2 + r.p.q / 25);
    }
    // Werbespot
    const ad = r.c.ad ? adOf(st, r.c.ad) : null;
    if (ad && ad.done < ad.spots) {
      if (r.v >= ad.min) {
        ad.done++; st.money += ad.pay; st.income += ad.pay;
        if (st.i === 0) logMsg(`${HOURS[i]}:00 Spot „${ad.brand}“ gesendet: +${eur(ad.pay)}`);
        if (ad.done >= ad.spots) {
          st.contracts = st.contracts.filter(x => x !== ad);
          st.sched.forEach(s => { if (s.ad === ad.id) s.ad = null; });
          if (st.i === 0) logMsg(`Vertrag „${ad.brand}“ erfüllt.`, true);
        }
      } else if (st.i === 0) logMsg(`${HOURS[i]}:00 Spot „${ad.brand}“ verfehlt: ${mio(r.v)} statt ${mio(ad.min)}`, true);
    }
    if (!r.p) { st.image = Math.max(0, st.image - 1); if (st.i === 0) logMsg(`${HOURS[i]}:00 Sendepause! Testbild kostet Image.`, true); }
  }
  // Imagepunkt vom schwächsten zum stärksten Sender
  const sorted = [...res].sort((a, b) => b.v - a.v);
  if (sorted[0].v > sorted[2].v * 1.1) { sorted[0].st.image++; sorted[2].st.image--; }
  // Punkte aus Sendepausen dem Quotensieger gutschreiben, damit es 100 bleiben
  const total = G.stations.reduce((a, s) => a + s.image, 0);
  sorted[0].st.image += 100 - total;
  G.stations.forEach(s => { s.image = clamp(s.image, 0, 100); s.favor = Math.min(s.favor, s.image * 2); });
  G.today[i] = res.map(r => ({ v: r.v, title: r.title }));
  if (sorted[0].st.i === 0) logMsg(`${HOURS[i]}:00 Quotensieg mit ${mio(sorted[0].v)}!`);
  renderLive(); renderHud();
  if (openRoom) renderPanel();
}

// ---------- Tagesablauf ----------
function startDay() {
  G.min = DAY_START;
  G.today = HOURS.map(() => null);
  for (const st of G.stations) {
    st.income = 0; st.imageStart = st.image; st.moneyStart = st.money; st.news = [];
    st.sched.forEach(c => { if (c.ad && !adOf(st, c.ad)) c.ad = null; if (c.p && !progOf(st, c.p)) { c.p = null; c.cont = false; } });
  }
  ROOMS.forEach(r => { r.occ = null; });
  lift = { y: 0, queue: [], occ: null, phase: "idle", timer: 0 };
  actors = G.stations.map((st, i) => ({ st: i, floor: 0, x: 90 + i * 40, mode: "idle", target: null, timer: 0, bubble: "", face: 1 }));
  player = actors[0];
  for (const st of G.stations.slice(1)) planAI(st);
  save();
  renderAll();
}
function planAI(st) {
  const first = shuffle(["market", "ads", "news"]);
  if (Math.random() < 0.35) first.splice(ri(0, 2), 0, "kantine");
  if (st.money > 180000 && Math.random() < 0.45) first.push("jury");
  st.ai = { queue: [...first, st.i === 1 ? "r1" : "r2", pick(["market", "ads"]), st.i === 1 ? "r1" : "r2"], next: DAY_START + ri(0, 40) };
}
function endDay() {
  paused = true;
  if (openRoom) closePanel();
  const report = [];
  for (const st of G.stations) {
    const costs = 15000 + Math.round(st.credit * 0.015);
    st.money -= costs;
    st.costs = costs; st.penalties = 0;
    for (const c of [...st.contracts]) {
      c.days--;
      if (c.days <= 0 && c.done < c.spots) {
        st.money -= c.penalty; st.penalties += c.penalty;
        st.contracts = st.contracts.filter(x => x !== c);
        if (st.i === 0) report.push(`Vertragsstrafe „${c.brand}“: −${eur(c.penalty)}`);
      }
    }
    st.progs.forEach(p => { p.topic = Math.min(1, p.topic + 0.08); });
    st.hist.push({ day: G.day, image: st.image, money: st.money, views: G.today.reduce((a, r) => a + (r ? r[st.i].v : 0), 0) });
  }
  const me = G.stations[0];
  let over = null;
  if (me.favor >= 100) over = { win: true, why: "Die Jury verleiht KANAL 13 die Goldene Antenne. Ihr Programm hat Kultur und Quote verbunden." };
  else if (me.image >= 60) over = { win: true, why: "KANAL 13 ist unangefochtener Marktführer mit " + me.image + " Imagepunkten." };
  else if (me.image < 5) over = { win: false, why: "Das Senderimage ist unter 5 Punkte gefallen. Die Intendanz setzt Sie vor die Tür." };
  else if (me.money < -250000) over = { win: false, why: "Die Schulden sind zu hoch. Die Intendanz zieht die Notbremse." };
  else {
    const rival = G.stations.slice(1).find(s => s.favor >= 100 || s.image >= 60);
    if (rival) over = { win: false, why: `${rival.name} hat das Rennen gemacht (${rival.favor >= 100 ? "Goldene Antenne" : "Marktführerschaft"}).` };
  }
  G.over = over;
  showSummary(report);
}
function nextDay() {
  G.day++;
  // KI-Kredit: Konkurrenten fangen sich bei Schulden
  for (const st of G.stations.slice(1)) if (st.money < 0 && st.credit < 400000) { st.money += 150000; st.credit += 150000; }
  refreshOffers(false);
  startDay();
  paused = false;
  setSpeedUI();
}

// ---------- KI ----------
function aiEnter(actor, room) {
  const st = G.stations[actor.st];
  if (room.id === "market") {
    let bought = 0;
    const cands = [...G.market].sort((a, b) => b.q / b.price - a.q / a.price + (b.q - a.q) / 400);
    for (const p of cands) {
      if (bought >= (st.i === 1 ? 1 : 2) || st.progs.length >= 12) break;
      if (p.price < st.money - 90000) { buyProgram(st, p); bought++; }
    }
  } else if (room.id === "ads") {
    const prime = Math.max(...st.last, 0.3);
    const cands = [...G.adOffers].filter(a => a.min <= prime * 0.85).sort((a, b) => b.pay - a.pay);
    for (const a of cands.slice(0, 2)) if (st.contracts.length < 5) takeAd(st, a);
  } else if (room.id === "news") {
    const cands = [...G.newsOffers].sort((a, b) => b.q - a.q);
    for (const n of cands) if (st.news.length < 3 && n.price < st.money - 60000) buyNews(st, n);
  } else if (room.id === "jury") {
    if (st.giftDay !== G.day && st.money > 150000) { st.money -= 20000; st.giftDay = G.day; st.favor = Math.min(st.image * 2, 100, st.favor + 8); }
  } else if (room.id === "r1" || room.id === "r2") {
    const from = HOURS.findIndex((h, i) => !slotLocked(i));
    if (from >= 0) autoPlan(st, from);
  }
}
function buyProgram(st, p) {
  st.money -= p.price; st.progs.push(p);
  G.market = G.market.filter(x => x !== p);
  if (st.i !== 0) logMsg(`${st.name} kauft „${p.title}“.`);
}
function takeAd(st, a) { st.contracts.push(a); G.adOffers = G.adOffers.filter(x => x !== a); }
function buyNews(st, n) { st.money -= n.price; st.news.push(n); G.newsOffers = G.newsOffers.filter(x => x !== n); }

// ---------- Figuren & Aufzug ----------
const WALK = 42; // Einheiten pro Spielminute
function setTarget(a, floor, x, room) {
  if (a.mode === "room") return;
  a.target = { floor, x, room };
  a.bubble = "";
  if (a.mode === "lift") return;
  if (a.mode === "waitLift") {
    if (floor !== a.floor) return;
    lift.queue = lift.queue.filter(q => q.actor !== a);
  }
  a.mode = "walk";
}
function updateActor(a, dm) {
  const st = G.stations[a.st];
  if (a.st !== 0 && st.ai) {
    if (a.mode === "idle" && st.ai.queue.length && G.min >= st.ai.next && G.min < DAY_END - 30) {
      const r = RM[st.ai.queue.shift()];
      setTarget(a, r.f, r.x, r.id);
    }
  }
  if (a.mode === "walk") {
    const goal = a.target.floor !== a.floor ? LIFT_X : a.target.x;
    const d = goal - a.x;
    const step = WALK * dm;
    if (Math.abs(d) <= step) {
      a.x = goal;
      if (a.target.floor !== a.floor) { a.mode = "waitLift"; lift.queue.push({ actor: a, floor: a.floor }); }
      else if (a.target.room) tryEnter(a);
      else { a.mode = "idle"; a.target = null; }
    } else { a.x += Math.sign(d) * step; a.face = Math.sign(d); }
  } else if (a.mode === "waitDoor") {
    tryEnter(a);
  } else if (a.mode === "room" && a.st !== 0) {
    a.timer -= dm;
    if (a.timer <= 0) { leaveRoom(a); st.ai.next = G.min + ri(4, 18); }
  }
}
function tryEnter(a) {
  const r = RM[a.target.room];
  if (r.owner !== undefined && r.owner !== a.st) {
    if (a.st === 0) toast(`Abgeschlossen. Das ist das Büro von ${r.name}.`);
    a.mode = "idle"; a.target = null; return;
  }
  if (r.occ && r.occ !== a) { a.mode = "waitDoor"; a.bubble = "Besetzt"; return; }
  r.occ = a; a.mode = "room"; a.bubble = ""; a.x = r.x;
  if (a.st === 0) openPanel(r.id);
  else { aiEnter(a, r); a.timer = r.owner !== undefined ? (G.min < 13 * 60 ? 13 * 60 - G.min + ri(0, 60) : 9999) : ri(18, 40); }
}
function leaveRoom(a) {
  const r = RM[a.target.room];
  if (r && r.occ === a) r.occ = null;
  a.mode = "idle"; a.target = null; a.x = r ? r.x + (r.side === "L" ? 40 : -40) : a.x;
}
function updateLift(dm) {
  const L = lift;
  if (L.phase === "doors") {
    L.timer -= dm;
    if (L.timer > 0) return;
    const f = Math.round(L.y);
    if (L.occ && L.occ.target.floor === f) {
      const a = L.occ; a.floor = f; a.mode = "walk"; L.occ = null;
    }
    if (!L.occ && L.queue.length && L.queue[0].floor === f) {
      const a = L.queue.shift().actor;
      if (a.target && a.target.floor !== f) { L.occ = a; a.mode = "lift"; }
      else if (a.target) a.mode = "walk";
    }
    L.phase = "idle";
    return;
  }
  const dest = L.occ ? L.occ.target.floor : (L.queue.length ? L.queue[0].floor : null);
  if (dest === null) { L.phase = "idle"; return; }
  const d = dest - L.y;
  if (Math.abs(d) < 0.001) { L.y = dest; L.phase = "doors"; L.timer = 1.6; return; }
  L.phase = "move";
  const step = dm / 1.1;
  L.y = Math.abs(d) <= step ? dest : L.y + Math.sign(d) * step;
}

// ---------- Hauptschleife ----------
let lastT = performance.now();
function tick(now) {
  const dtReal = Math.min(100, now - lastT); lastT = now;
  if (!paused && G && !G.over) {
    let dm = dtReal / (MS_PER_MIN / speed);
    while (dm > 0 && !paused) {
      const s = Math.min(dm, 0.5); dm -= s;
      const prev = G.min; G.min += s;
      const hPrev = Math.floor(prev / 60), hNow = Math.floor(G.min / 60);
      if (hNow > hPrev) {
        const idx = HOURS.indexOf(hNow);
        if (idx >= 0) airHour(idx);
      }
      for (const a of actors) updateActor(a, s);
      updateLift(s);
      if (G.min >= DAY_END) { G.min = DAY_END; endDay(); break; }
    }
    renderClock();
  }
  draw();
  requestAnimationFrame(tick);
}

// ---------- Zeichnen ----------
const cv = $("tower"), ctx = cv.getContext("2d");
let scale = 1, offX = 0, offY = 0, cssW = 0, cssH = 0;
const STARS = Array.from({ length: 90 }, () => [Math.random() * W, Math.random() * (TOP + 200), Math.random() * 1.6 + 0.3]);
function resize() {
  const r = cv.getBoundingClientRect();
  cssW = r.width; cssH = r.height;
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(cssW * dpr); cv.height = Math.round(cssH * dpr);
  scale = Math.min(cssW / W, cssH / H);
  offX = (cssW - W * scale) / 2; offY = (cssH - H * scale) / 2;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
new ResizeObserver(resize).observe(cv);
const baseY = f => TOP + (FLOORS - 1 - f) * FH + FH - 12;
function skyColors() {
  const m = G ? G.min : DAY_START;
  if (m < 17 * 60) return ["#3a6fb5", "#8fb8e0", 0];
  if (m < 20 * 60) { const t = (m - 17 * 60) / 180; return [mix("#3a6fb5", "#1b1f4d", t), mix("#8fb8e0", "#e0795a", t), t * 0.6]; }
  const t = Math.min(1, (m - 20 * 60) / 120);
  return [mix("#1b1f4d", "#070a1e", t), mix("#e0795a", "#15193d", t), 0.6 + t * 0.4];
}
function mix(a, b, t) {
  const pa = [1, 3, 5].map(k => parseInt(a.substr(k, 2), 16)), pb = [1, 3, 5].map(k => parseInt(b.substr(k, 2), 16));
  return "rgb(" + pa.map((v, k) => Math.round(v + (pb[k] - v) * t)).join(",") + ")";
}
function draw() {
  ctx.clearRect(0, 0, cssW, cssH);
  const [sk1, sk2, night] = skyColors();
  const g = ctx.createLinearGradient(0, 0, 0, cssH);
  g.addColorStop(0, sk1); g.addColorStop(1, sk2);
  ctx.fillStyle = g; ctx.fillRect(0, 0, cssW, cssH);
  ctx.save();
  ctx.translate(offX, offY); ctx.scale(scale, scale);
  // Sterne
  if (night > 0.2) {
    ctx.fillStyle = `rgba(255,255,255,${(night - 0.2) * 1.2})`;
    for (const [x, y, r] of STARS) { ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); }
  }
  const bx = 60, bw = W - 120, by = TOP - 10, bh = FLOORS * FH + 22;
  // Dach, Antenne, Leuchtschrift
  ctx.fillStyle = "#1d2448"; ctx.fillRect(bx + 40, by - 34, bw - 80, 34);
  ctx.strokeStyle = "#9aa3c7"; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(820, by - 34); ctx.lineTo(820, 8); ctx.stroke();
  ctx.lineWidth = 2;
  for (let k = 0; k < 4; k++) { ctx.beginPath(); ctx.moveTo(800 + k * 3, 30 + k * 18); ctx.lineTo(840 - k * 3, 30 + k * 18); ctx.stroke(); }
  const blink = (performance.now() / 600 | 0) % 2;
  ctx.fillStyle = blink ? "#ff3b3b" : "#5a1a1a"; ctx.beginPath(); ctx.arc(820, 8, 6, 0, 7); ctx.fill();
  ctx.font = "34px Bungee, Arial Black, sans-serif"; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  ctx.fillStyle = "#ffb21a"; ctx.shadowColor = "#ffb21a"; ctx.shadowBlur = 14 * night;
  ctx.fillText("QUOTENTURM", 130, by - 46);
  ctx.shadowBlur = 0;
  // Fassade
  ctx.fillStyle = "#262d55"; ctx.fillRect(bx, by, bw, bh);
  for (let f = 0; f < FLOORS; f++) {
    const y0 = TOP + (FLOORS - 1 - f) * FH;
    ctx.fillStyle = f % 2 ? "#2f3866" : "#2b3460"; ctx.fillRect(bx + 12, y0 + 4, bw - 24, FH - 16);
    ctx.fillStyle = "#151a38"; ctx.fillRect(bx, y0 + FH - 12, bw, 12);
    // Fenster-Leisten
    ctx.fillStyle = night > 0.3 ? "rgba(255,214,120,.18)" : "rgba(170,210,255,.15)";
    for (const wx of [110, 380, 600, 880]) ctx.fillRect(wx - 22, y0 + 18, 44, 30);
    // Etagenschild
    ctx.fillStyle = "#a3abd0"; ctx.font = "600 15px 'Barlow Condensed', Arial, sans-serif"; ctx.textAlign = "center";
    ctx.fillText(f === 0 ? "EG" : f + ". OG", LIFT_X, y0 + 22);
  }
  // Aufzugsschacht
  ctx.fillStyle = "#11152e"; ctx.fillRect(LIFT_X - 40, by, 80, bh - 12);
  const cabY = baseY(0) - lift.y * FH;
  for (let f = 0; f < FLOORS; f++) {
    const y = baseY(f);
    const here = Math.abs(lift.y - f) < 0.02;
    ctx.fillStyle = here ? "#ffb21a" : "#3a4170"; ctx.beginPath(); ctx.arc(LIFT_X, y - 92, 4, 0, 7); ctx.fill();
  }
  ctx.fillStyle = "#4b557f"; ctx.fillRect(LIFT_X - 34, cabY - 80, 68, 80);
  ctx.fillStyle = "#ffe1a1"; ctx.globalAlpha = 0.25; ctx.fillRect(LIFT_X - 30, cabY - 76, 60, 72); ctx.globalAlpha = 1;
  const open = lift.phase === "doors" ? 1 : 0;
  ctx.fillStyle = "#7d88b5";
  const dw = 30 * (1 - open * 0.85);
  ctx.fillRect(LIFT_X - 34, cabY - 80, dw, 80); ctx.fillRect(LIFT_X + 34 - dw, cabY - 80, dw, 80);
  // Lobby
  const y0 = baseY(0);
  ctx.fillStyle = "#4b3a2a"; ctx.fillRect(130, y0 - 34, 120, 34);
  ctx.fillStyle = "#a3abd0"; ctx.font = "600 14px 'Barlow Condensed', Arial, sans-serif"; ctx.textAlign = "center";
  ctx.fillText("EMPFANG", 190, y0 - 42);
  ctx.fillStyle = "#151a38"; ctx.fillRect(840, y0 - 96, 70, 96);
  ctx.fillStyle = "#a3abd0"; ctx.fillText("AUSGANG", 875, y0 - 104);
  // Türen
  for (const r of ROOMS) drawDoor(r);
  // Ziel-Markierung
  if (player && player.target && player.mode !== "room") {
    const t = player.target, ty = baseY(t.floor);
    ctx.strokeStyle = "#ffb21a"; ctx.lineWidth = 2; ctx.setLineDash([5, 4]);
    ctx.beginPath(); ctx.ellipse(t.x, ty + 2, 22, 6, 0, 0, 7); ctx.stroke(); ctx.setLineDash([]);
  }
  // Figuren
  for (const a of actors) {
    if (a.mode === "room") continue;
    const y = a.mode === "lift" ? cabY : baseY(a.floor);
    drawPerson(a, a.mode === "lift" ? LIFT_X + (a.st - 1) * 6 : a.x, y);
  }
  ctx.restore();
}
function drawDoor(r) {
  const y = baseY(r.f), x = r.x;
  const own = r.owner !== undefined ? STATION_DEF[r.owner].color : null;
  ctx.fillStyle = "#151a38"; ctx.fillRect(x - 40, y - 100, 80, 100);
  ctx.fillStyle = own || "#6b5a8a"; ctx.fillRect(x - 34, y - 94, 68, 94);
  ctx.fillStyle = "rgba(0,0,0,.25)"; ctx.fillRect(x - 28, y - 86, 56, 34);
  ctx.fillStyle = "#e8e2cf"; ctx.beginPath(); ctx.arc(x + 22, y - 46, 4, 0, 7); ctx.fill();
  // Schild
  ctx.font = "15px Bungee, Arial Black, sans-serif"; ctx.textAlign = "center";
  const tw = Math.max(90, ctx.measureText(r.name).width + 20);
  const sx = r.side === "L" ? x + 50 : x - 50 - tw;
  ctx.fillStyle = "#0e1230"; ctx.fillRect(sx, y - 100, tw, 42);
  ctx.fillStyle = own || "#f3efe4"; ctx.fillText(r.name, sx + tw / 2, y - 80);
  ctx.font = "500 13px 'Barlow Condensed', Arial, sans-serif"; ctx.fillStyle = "#a3abd0";
  ctx.fillText(r.sub.split(" · ")[0], sx + tw / 2, y - 64);
  // Besetzt-Lampe
  const busy = !!r.occ;
  ctx.fillStyle = busy ? "#ff3b3b" : "#2a6e47";
  ctx.beginPath(); ctx.arc(x, y - 108, 6, 0, 7); ctx.fill();
  if (busy && r.occ.st !== undefined) {
    ctx.fillStyle = STATION_DEF[r.occ.st].color; ctx.beginPath(); ctx.arc(x, y - 108, 3, 0, 7); ctx.fill();
  }
}
function drawPerson(a, x, y) {
  const d = STATION_DEF[a.st];
  const bob = a.mode === "walk" ? Math.sin(performance.now() / 90) * 2 : 0;
  ctx.fillStyle = "#1a1f3d"; ctx.fillRect(x - 8, y - 22, 6, 22 + bob); ctx.fillRect(x + 2, y - 22, 6, 22 - bob);
  ctx.fillStyle = d.color; ctx.fillRect(x - 11, y - 52, 22, 32);
  ctx.fillStyle = d.skin; ctx.beginPath(); ctx.arc(x, y - 62, 10, 0, 7); ctx.fill();
  ctx.fillStyle = "#1a1f3d"; ctx.beginPath(); ctx.arc(x + a.face * 4, y - 63, 1.8, 0, 7); ctx.fill();
  if (a === player) {
    ctx.fillStyle = "#ffb21a"; ctx.beginPath(); ctx.moveTo(x - 7, y - 90); ctx.lineTo(x + 7, y - 90); ctx.lineTo(x, y - 80); ctx.fill();
  }
  if (a.bubble) {
    ctx.font = "600 14px 'Barlow Condensed', Arial, sans-serif"; ctx.textAlign = "center";
    const w = ctx.measureText(a.bubble).width + 14;
    ctx.fillStyle = "#f3efe4"; ctx.fillRect(x - w / 2, y - 112, w, 20);
    ctx.fillStyle = "#0d1330"; ctx.fillText(a.bubble, x, y - 97);
  }
}

cv.addEventListener("pointerdown", e => {
  if (!G || G.over || openRoom || paused && !$("ovl").hidden) return;
  const r = cv.getBoundingClientRect();
  const lx = (e.clientX - r.left - offX) / scale, ly = (e.clientY - r.top - offY) / scale;
  for (const room of ROOMS) {
    const y = baseY(room.f);
    const sx0 = room.side === "L" ? room.x - 45 : room.x - 170, sx1 = room.side === "L" ? room.x + 170 : room.x + 45;
    if (lx >= sx0 && lx <= sx1 && ly >= y - 115 && ly <= y + 8) { setTarget(player, room.f, room.x, room.id); return; }
  }
  const f = FLOORS - 1 - Math.floor((ly - TOP) / FH);
  if (f >= 0 && f < FLOORS && lx > 70 && lx < W - 70) setTarget(player, f, clamp(lx, 90, 910), null);
});

      const mx = Math.max(...vals);
      return `<tr><td>${hr}:00</td>${vals.map(v => `<td class="${v === mx && v > 0 ? "win" : ""}">${v ? v.toFixed(2) : "–"}</td>`).join("")}</tr>`;
    }).join("");
    h += `<p class="intro">Zuschauer in Millionen, heute bzw. zuletzt gemessen. Grün = Quotensieg der Stunde.</p>
    <div class="tbl-wrap"><table><thead><tr><th>Stunde</th>${G.stations.map(s => `<th style="color:${s.color}">${esc(s.name)}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>
    <h3 style="margin:0">Letzte Meldungen</h3><ul class="feed">${G.log.slice(0, 20).map(l => `<li>Tag ${l.day}, ${l.t} · ${esc(l.msg)}</li>`).join("")}</ul>`;
  }
  return h;
}
function openPicker(kind, i) {
  const me = G.stations[0];
  const hr = HOURS[i];
  let list = "";
  if (kind === "prog") {
    const sorted = [...me.progs].sort((a, b) => b.q * fit(b.genre, hr) * (0.35 + 0.65 * b.topic) - a.q * fit(a.genre, hr) * (0.35 + 0.65 * a.topic));
    list = sorted.map(p => {
      const why = canPlace(p, i);
      const usedToday = me.sched.some((c, k) => k !== i && c.p === p.id && !c.cont);
      return `<button class="pick" data-act="setProg" data-i="${i}" data-id="${p.id}" ${why ? "disabled" : ""}>
        <b>${esc(p.title)}</b>
        <span class="meta"><span class="chip">${esc(p.genre)}</span>${p.fsk ? '<span class="chip fsk">FSK 18</span>' : ""}<span>${stars(fit(p.genre, hr))}</span><span>Q ${p.q}</span><span>Aktualität ${Math.round(p.topic * 100)} %</span><span>${p.len} Std.</span>${usedToday ? '<span class="chip warn">heute schon geplant</span>' : ""}${why ? `<span>${why}</span>` : ""}</span></button>`;
    }).join("") || '<p class="empty">Sie besitzen keine Programme.</p>';
    list = `<button class="pick" data-act="setProg" data-i="${i}" data-id=""><b>Sendeplatz leeren</b><span class="meta">Achtung: Testbild kostet Image</span></button>` + list;
  } else {
    const exp = expected(me, i);
    list = `<button class="pick" data-act="setAd" data-i="${i}" data-id=""><b>Keine Werbung</b><span class="meta">Erwartet ca. ${mio(exp)}</span></button>` +
      me.contracts.map(a => {
        const left = a.spots - a.done - plannedSpots(me, a.id) + (me.sched[i].ad === a.id ? 1 : 0);
        return `<button class="pick" data-act="setAd" data-i="${i}" data-id="${a.id}" ${left <= 0 ? "disabled" : ""}>
          <b>${esc(a.brand)} · ${eur(a.pay)}</b>
          <span class="meta"><span class="chip ${a.min <= exp * 0.95 ? "good" : "warn"}">mind. ${mio(a.min)}</span><span>${a.done}/${a.spots} gesendet</span><span>noch ${Math.max(0, left)} einplanbar</span><span>Frist ${a.days} T.</span></span></button>`;
      }).join("");
  }
  $("picker").innerHTML = `<div class="picker-box"><header><h3>${hr}:00 Uhr · ${kind === "prog" ? "Programm wählen" : "Werbespot wählen"}</h3><button class="btn" data-act="closePicker">Abbrechen</button></header><div class="picker-list">${list}</div></div>`;
  $("picker").hidden = false;
}
$("panel").addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b || b.disabled) return;
  const me = G.stations[0];
  const id = b.dataset.id ? +b.dataset.id : null, i = b.dataset.i !== undefined ? +b.dataset.i : null;
  switch (b.dataset.act) {
    case "tab": officeTab = b.dataset.k; break;
    case "buy": { const p = G.market.find(x => x.id === id); if (p && p.price <= me.money) { buyProgram(me, p); toast(`„${p.title}“ gekauft.`); } break; }
    case "ad": { const a = G.adOffers.find(x => x.id === id); if (a && me.contracts.length < 6) { takeAd(me, a); toast(`Vertrag mit ${a.brand} geschlossen.`); } break; }
    case "news": { const n = G.newsOffers.find(x => x.id === id); if (n && me.news.length < 3) { buyNews(me, n); toast("Meldung gekauft."); } break; }
    case "sell": { const p = progOf(me, id); if (p) { me.money += r1000(p.price * 0.4); me.progs = me.progs.filter(x => x !== p); toast(`„${p.title}“ verkauft.`); } break; }
    case "credit": me.money += 100000; me.credit += 100000; toast("Kredit über 100.000 € erhalten."); break;
    case "repay": me.money -= 100000; me.credit -= 100000; toast("100.000 € zurückgezahlt."); break;
    case "gift": {
      const [, c, f] = [["", 5000, 3], ["", 20000, 8], ["", 60000, 18]][+b.dataset.k];
      me.money -= c; me.giftDay = G.day; me.favor = Math.min(me.image * 2, 100, me.favor + f);
      toast("Die Jury bedankt sich."); break;
    }
    case "pickProg": openPicker("prog", i); return;
    case "pickAd": openPicker("ad", i); return;
    case "closePicker": $("picker").hidden = true; return;
    case "setProg": {
      if (cellLocked(me, i)) break;
      const p = id ? progOf(me, id) : null;
      if (p && canPlace(p, i)) break;
      setProg(me, i, p);
      me.sched.forEach((c, k) => { if (!c.p && !slotLocked(k)) c.ad = null; });
      $("picker").hidden = true; break;
    }
    case "setAd": if (!slotLocked(i)) me.sched[i].ad = id; $("picker").hidden = true; break;
    case "auto": {
      const from = HOURS.findIndex((h, k) => !slotLocked(k));
      if (from >= 0) { autoPlan(me, from); toast("Offene Plätze wurden gefüllt."); }
      break;
    }
  }
  renderPanel(); renderHud(); renderLive();
});

// ---------- Overlays ----------
function showOverlay(html) { $("ovlSheet").innerHTML = html; $("ovl").hidden = false; }
function hideOverlay() { $("ovl").hidden = true; }
$("ovl").addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  if (b.dataset.act === "new") { hideOverlay(); newGame(); paused = false; setSpeedUI(); }
  if (b.dataset.act === "load") { if (load()) { hideOverlay(); startDay(); paused = false; setSpeedUI(); } }
  if (b.dataset.act === "next") { hideOverlay(); if (G.over) showEnd(); else nextDay(); }
  if (b.dataset.act === "menu") { hideOverlay(); clearSave(); showStart(); }
});
function showStart() {
  paused = true; setSpeedUI();
  const has = hasSave();
  showOverlay(`<div class="testcard" aria-hidden="true"></div>
    <h1>Quotenturm</h1>
    <p>Sie sind neue Programmdirektion von <b style="color:var(--amber)">KANAL 13</b>. Im selben Hochhaus sitzen FLIMMER TV und SONNENKANAL. Alle drei Sender teilen sich 100 Imagepunkte. Wer zur vollen Stunde die meisten Zuschauer hat, nimmt dem schwächsten Sender einen Punkt ab.</p>
    <ul>
      <li><b>Laufen:</b> Tippen Sie auf eine Tür. Ihre Figur (gelber Pfeil) nimmt den Aufzug, der immer nur eine Person mitnimmt. Jeder Raum fasst nur eine Person. Rotes Licht heißt besetzt.</li>
      <li><b>Einkaufen:</b> Programme in der Filmkiste (1. OG), Werbeverträge in der Spotfabrik (2. OG), Nachrichten bei Ticker24 (1. OG).</li>
      <li><b>Planen:</b> In Ihrem Büro (3. OG) legen Sie das Abendprogramm von 16 bis 24 Uhr fest. Die Uhr läuft auch, während Sie in einem Raum sind.</li>
      <li><b>Sendezeiten:</b> Krimis und Serien am Vorabend, Liebesfilme, Komödien und Shows zur Primetime um 20 Uhr, Action ab 21 Uhr, Kultur um 22 Uhr, FSK 18 erst ab 21 Uhr.</li>
      <li><b>Gewinnen:</b> 60 Imagepunkte erreichen oder von der Jury die Goldene Antenne bekommen (Kultur ab 21 Uhr und Geschenke, 5. OG).</li>
      <li><b>Verlieren:</b> Image unter 5, Schulden über 250.000 € oder ein Konkurrent ist schneller.</li>
    </ul>
    <div class="actions">${has ? '<button class="btn primary" data-act="load">Weiterspielen</button>' : ""}<button class="btn ${has ? "" : "primary"}" data-act="new">Neues Spiel</button></div>
    <p class="intro" style="font-size:14px">Tipp fürs iPad: In Safari „Teilen“ und dann „Zum Home-Bildschirm“ wählen. Der Spielstand wird nur lokal auf diesem Gerät gespeichert.</p>`);
}
function showSummary(report) {
  const me = G.stations[0];
  const rows = HOURS.map((hr, i) => {
    const r = G.today[i];
    if (!r) return "";
    const mx = Math.max(...r.map(x => x.v));
    return `<tr><td>${hr}:00</td>${r.map((x, k) => `<td class="${x.v === mx ? "win" : ""}" title="${esc(x.title)}">${x.v.toFixed(2)}</td>`).join("")}</tr>`;
  }).join("");
  const dImg = me.image - me.imageStart, dMoney = me.money - me.moneyStart;
  showOverlay(`<h2>Sendeschluss · Tag ${G.day}</h2>
    <div class="kpis">
      <div class="kpi" style="--c:var(--amber)"><b>${me.image} (${dImg >= 0 ? "+" : ""}${dImg})</b><span>Imagepunkte</span></div>
      <div class="kpi" style="--c:var(--good)"><b>${eur(me.income)}</b><span>Werbeeinnahmen</span></div>
      <div class="kpi"><b>${eur(-me.costs - me.penalties)}</b><span>Kosten & Strafen</span></div>
      <div class="kpi" style="--c:${dMoney >= 0 ? "var(--good)" : "var(--onair)"}"><b>${eur(dMoney)}</b><span>Saldo des Tages</span></div>
    </div>
    <div class="tbl-wrap"><table><thead><tr><th>Mio. Zuschauer</th>${G.stations.map(s => `<th style="color:${s.color}">${esc(s.name)}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>
    <div class="meta">Jury-Ansehen: ${G.stations.map(s => `<span style="color:${s.color}">${esc(s.name)} ${Math.round(s.favor)}</span>`).join(" · ")}</div>
    ${report.length ? `<ul class="feed">${report.map(r => `<li>${esc(r)}</li>`).join("")}</ul>` : ""}
    <div class="actions"><button class="btn primary" data-act="next">${G.over ? "Weiter" : "Nächster Tag"}</button></div>`);
}
function showEnd() {
  const o = G.over;
  clearSave();
  showOverlay(`<div class="testcard" aria-hidden="true"></div>
    <h1 style="color:${o.win ? "var(--amber)" : "var(--onair)"}">${o.win ? "Goldene Quote!" : "Sendeschluss"}</h1>
    <p>${esc(o.why)}</p>
    <p>Gespielt: ${G.day} ${G.day === 1 ? "Tag" : "Tage"} · Endstand Image ${G.stations.map(s => `${esc(s.name)} ${s.image}`).join(", ")}</p>
    <div class="actions"><button class="btn primary" data-act="new">Neues Spiel</button></div>`);
}

// ---------- Speichern (nur lokal im Browser) ----------
const KEY = "quotenturm-v1";
function save() { try { localStorage.setItem(KEY, JSON.stringify(G)); } catch (e) { /* ohne Speicher spielbar */ } }
function hasSave() { try { return !!localStorage.getItem(KEY); } catch (e) { return false; } }
function load() { try { const s = localStorage.getItem(KEY); if (!s) return false; G = JSON.parse(s); return true; } catch (e) { return false; } }
function clearSave() { try { localStorage.removeItem(KEY); } catch (e) { /* egal */ } }

// ---------- Start ----------
function start(data) {
  resize();
  lift = { y: 0, queue: [], occ: null, phase: "idle", timer: 0 };
  if (data && data.G && !data.G.over) {
    G = data.G; const m = G.min; startDay(); G.min = m; paused = false; setSpeedUI();
  } else showStart();
  requestAnimationFrame(t => { lastT = t; tick(t); });
}
if (window.claude && window.claude.hot && typeof window.claude.hot.snapshot === "function") {
  window.claude.hot.snapshot(() => ({ G }));
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
