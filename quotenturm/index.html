<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quotenturm</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Quotenturm">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: Manager-Portal – Kopfleiste in Senderfarbe mit Hauptmenü, Datum und „Weiter“, Untermenüzeile, darunter Dashboard aus Panels.
   Bewusst ein einziges dunkles Erscheinungsbild wie moderne Fußball-Manager. */
:root {
  --bg: #0b0d10;
  --panel: #14171c;
  --panel-2: #1b1f25;
  --row: #181b21;
  --line: #2a2f37;
  --text: #e8eaee;
  --muted: #9aa1ad;
  --club: #e3a019;
  --club-ink: #15110a;
  --club-sub: #1b1609;
  --hot: #e6246e;
  --violet: #7c3aed;
  --good: #22c55e;
  --mid: #eab308;
  --bad: #ef4444;
  --font-head: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0; color: var(--text); font-family: var(--font-body); font-size: 15px; line-height: 1.35;
  background: radial-gradient(ellipse at 10% 120%, rgba(227,160,25,.07), transparent 50%), var(--bg);
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation; overflow: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--hot); outline-offset: 2px; }
#app { height: 100%; display: grid; grid-template-rows: auto auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); }

/* Kopfleiste */
#top {
  display: flex; align-items: center; gap: 14px; background: var(--club); color: var(--club-ink);
  padding-block: 8px; min-height: 52px;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
}
.histbtns { display: flex; gap: 2px; }
.histbtns button { width: 38px; height: 46px; border: 0; background: rgba(0,0,0,.18); color: var(--club-ink); font-size: 20px; font-weight: 700; }
.histbtns button:first-child { border-radius: 6px 0 0 6px; } .histbtns button:last-child { border-radius: 0 6px 6px 0; }
.histbtns button:disabled { opacity: .35; cursor: default; }
#topCrest { display: flex; }
#mainnav { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; min-width: 0; }
#mainnav::-webkit-scrollbar { display: none; }
#mainnav button { background: transparent; border: 0; font-family: var(--font-head); font-weight: 700; font-size: 19px; letter-spacing: .02em; text-transform: uppercase; padding: 8px 6px 8px 8px; white-space: nowrap; position: relative; color: var(--club-ink); opacity: .8; display: flex; align-items: center; gap: 3px; border-radius: 4px; }
#mainnav button svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; transition: transform .15s; }
#mainnav button.open { background: rgba(0,0,0,.16); opacity: 1; }
#mainnav button.open svg { transform: rotate(180deg); }
#mainnav button.on { opacity: 1; }
#dropdown { position: fixed; z-index: 45; width: 280px; background: var(--panel-2); border: 1px solid var(--line); border-top: 3px solid var(--club); border-radius: 0 0 8px 8px; box-shadow: 0 18px 40px rgba(0,0,0,.55); padding: 6px; display: grid; gap: 2px; }
#dropdown .dd-head { font-family: var(--font-head); font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); padding: 6px 10px 4px; }
#dropdown button { background: transparent; border: 0; border-radius: 6px; text-align: left; padding: 9px 10px; display: grid; gap: 1px; min-height: 44px; }
#dropdown button:hover { background: #262b33; }
#dropdown button.on { background: rgba(124,58,237,.22); box-shadow: inset 3px 0 0 var(--violet); }
#dropdown button b { font-weight: 600; font-size: 15px; }
#dropdown button span { font-size: 13px; color: var(--muted); }
#dropdown .cnt { background: var(--violet); color: #fff; border-radius: 999px; padding: 0 7px; font-size: 12px; }
#mainnav button.on::after { content: ""; position: absolute; left: 50%; bottom: 0; width: 16px; height: 3px; transform: translateX(-50%); background: var(--club-ink); border-radius: 2px; }
.top-spacer { flex: 1; }
.datebox { background: rgba(0,0,0,.18); border-radius: 6px; padding: 5px 10px; line-height: 1.15; white-space: nowrap; }
.datebox b { display: block; font-family: var(--font-head); font-weight: 700; font-size: 17px; }
.datebox span { font-size: 13px; }
.timebox { background: #0b0d10; color: #fff; font-family: var(--font-head); font-weight: 700; font-size: 20px; padding: 5px 8px; border-radius: 4px; font-variant-numeric: tabular-nums; }
#cont { background: var(--hot); color: #fff; border: 0; border-radius: 4px; height: 46px; min-width: 190px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; gap: 20px; font-family: var(--font-head); font-weight: 700; font-size: 20px; }
#cont svg { width: 22px; height: 22px; stroke: #fff; fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
#cont.busy { background: #8a1a45; }

/* Untermenü */
#subbar {
  display: flex; align-items: center; gap: 14px; background: var(--club-sub); border-bottom: 1px solid #2c240f;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  min-height: 44px; overflow-x: auto; scrollbar-width: none;
}
#subbar::-webkit-scrollbar { display: none; }
#subbar .sec { font-family: var(--font-head); font-weight: 700; font-size: 16px; padding-right: 12px; border-right: 1px solid #3a3017; white-space: nowrap; }
#subtabs { display: flex; gap: 2px; }
#subtabs button { background: transparent; border: 0; color: var(--muted); padding: 11px 9px; white-space: nowrap; font-size: 15px; position: relative; }
#subtabs button.on { color: var(--text); }
#subtabs button.on::after { content: ""; position: absolute; left: 9px; right: 9px; bottom: 6px; height: 2px; background: var(--text); }
.quick { margin-left: auto; display: flex; gap: 4px; }
.quick button { background: #0f1114; border: 1px solid #2d2a22; border-radius: 4px; padding: 5px 11px; white-space: nowrap; font-size: 14px; display: flex; align-items: center; gap: 6px; color: var(--text); }
.ico { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }

/* Inhalt */
#content { overflow-y: auto; min-height: 0; padding: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: max(24px, env(safe-area-inset-bottom, 0px)); -webkit-overflow-scrolling: touch; }
.grid { display: grid; gap: 14px; align-items: start; }
.dash { grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); }
.two { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
.col { display: grid; gap: 14px; min-width: 0; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; min-width: 0; }
.ph { display: flex; align-items: center; gap: 10px; padding: 12px 14px 10px; flex-wrap: wrap; }
.ph h2 { margin: 0; font-family: var(--font-head); font-weight: 700; font-size: 20px; text-transform: uppercase; letter-spacing: .01em; flex: 1; }
.ph .aside { color: var(--muted); font-size: 13px; }
.st { font-family: var(--font-head); font-weight: 700; font-size: 20px; color: var(--hot); text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 2px; margin: 0; }
.st-wrap { padding: 12px 14px 6px; }
.pad { padding: 0 14px 14px; }
.lead { margin: 0; color: var(--muted); max-width: 76ch; }
.mb { margin-bottom: 14px; }
.page-title { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.page-title h1 { margin: 0; font-family: var(--font-head); font-weight: 700; font-size: 30px; text-transform: uppercase; line-height: 1; }
.page-title .grow { flex: 1; min-width: 0; }

/* Tabellen */
.tbl { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { text-align: left; font-size: 13px; font-weight: 500; color: var(--muted); padding: 6px 10px; white-space: nowrap; }
td { padding: 7px 10px; white-space: nowrap; vertical-align: middle; }
tbody tr:nth-child(odd) td { background: var(--row); }
tbody tr:hover td { background: #20242b; }
tr.mine td { background: rgba(227,160,25,.10) !important; }
td.num, th.num { text-align: right; }
td.title { white-space: normal; min-width: 170px; }
.marker td:first-child { box-shadow: inset 3px 0 0 var(--c); }
.attr { display: inline-grid; place-items: center; min-width: 30px; height: 22px; border-radius: 3px; font-family: var(--font-head); font-weight: 700; font-size: 15px; color: #0b0d10; padding: 0 3px; }
.a4 { background: #22c55e; } .a3 { background: #84cc16; } .a2 { background: #eab308; } .a1 { background: #f97316; } .a0 { background: #ef4444; }
.chip { display: inline-block; font-size: 12px; padding: 2px 7px; border-radius: 4px; border: 1px solid #3a3f48; color: var(--muted); white-space: nowrap; }
.chip.fsk { background: var(--bad); border-color: var(--bad); color: #fff; }
.chip.live { background: var(--hot); border-color: var(--hot); color: #fff; }
.chip.real { border-color: rgba(124,58,237,.7); color: #b79cff; }
.chip.good { border-color: rgba(34,197,94,.6); color: var(--good); }
.chip.warn { border-color: rgba(234,179,8,.6); color: var(--mid); }
.mbar { width: 70px; height: 5px; border-radius: 3px; background: #2a2f37; overflow: hidden; display: inline-block; vertical-align: middle; }
.mbar i { display: block; height: 100%; background: var(--muted); }
.muted { color: var(--muted); }
.up { color: var(--good); } .down { color: var(--bad); }
.res { display: inline-flex; align-items: center; gap: 6px; }
.res i { width: 11px; height: 11px; border-radius: 50%; }
.res i.w { background: var(--good); } .res i.l { border: 2px solid var(--bad); width: 9px; height: 9px; } .res i.d { background: var(--mid); }
.stars { color: var(--club); letter-spacing: 1px; }
.legend { display: flex; gap: 14px; padding: 8px 14px 12px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.legend span::before { content: ""; display: inline-block; width: 3px; height: 11px; margin-right: 6px; background: var(--c); vertical-align: -1px; }

/* Buttons & Formulare */
.btn { background: var(--panel-2); border: 1px solid #353b45; border-radius: 4px; padding: 7px 12px; min-height: 36px; font-weight: 600; font-size: 14px; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn.hot { background: var(--hot); border-color: var(--hot); color: #fff; }
.btn.violet { background: var(--violet); border-color: var(--violet); color: #fff; }
.btn:disabled { opacity: .35; cursor: not-allowed; }
.pills { display: flex; gap: 4px; flex-wrap: wrap; }
.pills button { background: transparent; border: 1px solid #3a3f48; border-radius: 4px; padding: 6px 11px; font-size: 15px; }
.pills button.on { background: var(--violet); border-color: var(--violet); color: #fff; }
select, input[type=number] { background: var(--panel-2); color: var(--text); border: 1px solid #353b45; border-radius: 4px; padding: 7px 10px; font: inherit; min-height: 36px; }
input[type=number] { width: 130px; }

/* Nachrichten */
.msgs { display: grid; }
.mday { background: #1f232a; color: var(--muted); font-size: 13px; padding: 7px 14px; }
.msg { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; padding: 11px 14px; border-bottom: 1px solid var(--line); }
.msg .from { font-size: 14px; color: var(--muted); }
.msg .tag { justify-self: end; }
.msg .txt { font-size: 17px; color: #c9ced6; line-height: 1.25; }
.msg time { align-self: end; font-size: 14px; color: var(--muted); }
.msg.new .txt { color: var(--text); font-weight: 500; }

/* News-Karte */
.hero { margin: 0 14px; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); background: var(--panel-2); }
.hero-img { height: 150px; position: relative; display: flex; align-items: center; justify-content: center; gap: 22px;
  background: repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 2px, transparent 2px 46px), linear-gradient(180deg, #6b7380, #3b414b); }
.hero-img .score { font-family: var(--font-head); font-weight: 700; font-size: 42px; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,.5); font-variant-numeric: tabular-nums; white-space: nowrap; text-align: center; line-height: 1; }
.hero-img .score small { display: block; font-size: 13px; font-weight: 600; letter-spacing: .1em; opacity: .85; margin-bottom: 4px; }
.hero-body { padding: 12px 14px; display: grid; gap: 6px; }
.hero-body h3 { margin: 0; font-size: 20px; font-weight: 700; line-height: 1.2; text-wrap: balance; }
.hero-body p { margin: 0; color: #c2c7cf; }
.hero-meta, .nmeta { display: flex; gap: 10px; align-items: center; color: var(--muted); font-size: 13px; flex-wrap: wrap; }
.nitem { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); align-items: center; }
.nitem .thumb { width: 64px; height: 52px; border-radius: 4px; background: linear-gradient(135deg, #e6246e, #7c3aed); display: grid; place-items: center; font-family: var(--font-head); font-weight: 700; font-size: 13px; color: #fff; }
.nitem b { display: block; font-size: 15px; line-height: 1.25; }

/* Statistik-Liste */
.slist { display: grid; }
.srow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 9px 14px; align-items: center; }
.srow:nth-child(odd) { background: var(--row); }
.srow b { font-weight: 600; font-size: 16px; }
.srow span { color: #c2c7cf; display: flex; align-items: center; gap: 6px; min-width: 0; }
.srow em { font-style: normal; font-family: var(--font-head); font-weight: 700; font-size: 20px; grid-row: 1 / 3; grid-column: 2; text-align: right; }

/* Rechte Spalte */
.goal { padding: 6px 14px 12px; display: grid; gap: 6px; }
.goal .row { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.track { height: 8px; border-radius: 4px; background: #2a2f37; overflow: hidden; position: relative; }
.track i { display: block; height: 100%; }
.track b { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; }
.fixture { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; padding: 6px 14px 14px; }
.fixture .side { display: flex; align-items: center; gap: 8px; min-width: 0; }
.fixture .side:last-child { justify-content: flex-end; text-align: right; }
.fixture .t { border: 1px solid var(--line); background: #0f1114; border-radius: 4px; padding: 6px 12px; font-family: var(--font-head); font-weight: 700; font-size: 18px; }
.rings { display: flex; gap: 14px; padding: 4px 14px 12px; flex-wrap: wrap; }
.ring { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 14px; }
.ring b { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--c, #fff); display: grid; place-items: center; color: var(--text); font-size: 14px; }
.form { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; padding: 4px 14px 14px; text-align: center; font-size: 13px; color: var(--muted); }
.form div { display: grid; gap: 5px; justify-items: center; }
.form i { width: 100%; height: 26px; border-radius: 4px; background: #2a2f37; display: grid; place-items: center; font-style: normal; font-weight: 600; color: #0b0d10; font-size: 12px; }
.form i.w { background: var(--good); } .form i.l { background: var(--bad); } .form i.d { background: var(--mid); }

/* Sendeplan */
.plan td { padding: 0; }
.plan .hr { font-family: var(--font-head); font-weight: 700; font-size: 20px; padding: 0 12px; }
.plan tr.prime .hr { color: var(--club); }
.cell { width: 100%; background: transparent; border: 0; text-align: left; padding: 8px 10px; min-height: 52px; display: grid; gap: 1px; align-content: center; }
.cell:not(:disabled):hover { background: rgba(230,36,110,.1); }
.cell:disabled { cursor: default; }
.cell .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 36ch; }
.cell .s { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 42ch; }
.cell.bad .t { color: var(--bad); }
.cell.cont .t { color: var(--muted); }
.plan td.r { padding: 0 12px; text-align: right; }

/* Live-Regie */
.live-head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 14px; padding: 16px 18px; background: linear-gradient(180deg, #232830, var(--panel)); border-bottom: 1px solid var(--line); }
.live-clock { font-family: var(--font-head); font-weight: 700; font-size: 54px; line-height: 1; text-align: center; font-variant-numeric: tabular-nums; }
.live-clock small { display: block; font-size: 13px; letter-spacing: .14em; color: var(--hot); }
.wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; padding: 12px; }
.mon { background: #0d0f13; border: 1px solid var(--line); border-radius: 6px; padding: 9px 10px; display: grid; gap: 5px; min-width: 0; }
.mon.me { border-color: var(--club); box-shadow: 0 0 0 1px var(--club) inset; }
.mon-top { display: flex; align-items: center; gap: 8px; min-width: 0; }
.mon-top b { font-family: var(--font-head); font-size: 16px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mon-top span { font-family: var(--font-head); font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
.mon-t { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lbar { height: 6px; border-radius: 3px; background: #2a2f37; overflow: hidden; }
.lbar i { display: block; height: 100%; transition: width .35s ease; }
.chart { display: block; width: 100%; height: auto; }
.chart text { font-family: var(--font-body); font-size: 11px; fill: var(--muted); }

.daytabs { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.daytabs button { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 7px 4px; font-family: var(--font-head); font-weight: 700; font-size: 17px; display: grid; gap: 1px; }
.daytabs button span { font-family: var(--font-body); font-weight: 400; font-size: 12px; color: var(--muted); }
.daytabs button.on { background: var(--violet); border-color: var(--violet); }
.daytabs button.on span { color: #e9ddff; }
.plan tr.dp td { background: #1f232a !important; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .1em; padding: 5px 12px; }
.sn { display: inline-flex; align-items: center; gap: 7px; }
.sbadge { display: inline-block; font-family: var(--font-head); font-weight: 700; font-size: 12px; padding: 1px 6px; border-radius: 3px; background: var(--c); color: #fff; text-shadow: 0 1px 1px rgba(0,0,0,.4); }
img.logo { object-fit: contain; flex: 0 0 auto; }
label { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

.stages { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; padding: 0 14px 14px; }
.stage { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; display: grid; gap: 6px; align-content: start; }
.stage.done { border-color: rgba(34,197,94,.5); }
.row-s { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.event-head { display: grid; gap: 6px; }
.event-head .chip { justify-self: start; }
.event-head h3 { margin: 0; font-size: 22px; line-height: 1.2; text-wrap: balance; }
.event-card { border-color: var(--hot); }
/* Dialoge */
.modal { position: fixed; inset: 0; z-index: 50; background: rgba(4, 5, 7, .75); display: flex; align-items: center; justify-content: center; overflow-y: auto;
  padding-block: max(16px, env(safe-area-inset-top, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.dialog { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; width: min(860px, 100%); margin: auto; box-shadow: 0 30px 80px rgba(0,0,0,.6); overflow: hidden; }
.dialog.narrow { width: min(580px, 100%); }
.dialog > header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: var(--club); color: var(--club-ink); }
.dialog > header h2 { margin: 0; flex: 1; font-family: var(--font-head); font-weight: 700; font-size: 22px; text-transform: uppercase; }
.dialog > header .btn { background: rgba(0,0,0,.15); border-color: transparent; color: var(--club-ink); }
.dbody { padding: 16px; display: grid; gap: 14px; }
.splash { padding: 28px 18px 22px; background: radial-gradient(circle at 90% 0%, rgba(230,36,110,.35), transparent 50%), linear-gradient(135deg, #2a2108, #14171c 60%); display: grid; gap: 10px; border-bottom: 1px solid var(--line); }
.splash h1 { margin: 0; font-family: var(--font-head); font-weight: 700; font-size: clamp(40px, 8vw, 72px); line-height: .9; text-transform: uppercase; }
.splash h1 em { font-style: normal; color: var(--club); }
.splash p { margin: 0; color: #c2c7cf; max-width: 66ch; }
.rules { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; }
.rules li { background: var(--panel-2); border-radius: 6px; padding: 10px 12px; color: #c2c7cf; }
.rules b { display: block; font-family: var(--font-head); font-size: 16px; color: var(--text); text-transform: uppercase; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.tile { background: var(--panel-2); border-radius: 6px; padding: 10px 12px; display: grid; gap: 1px; }
.tile small { color: var(--muted); font-size: 13px; }
.tile b { font-family: var(--font-head); font-weight: 700; font-size: 26px; font-variant-numeric: tabular-nums; }
.tile span { font-size: 13px; color: var(--muted); }
.picklist { display: grid; gap: 6px; max-height: 62vh; overflow-y: auto; }
.pick { width: 100%; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 9px 12px; text-align: left; display: grid; gap: 4px; }
.pick:hover:not(:disabled) { border-color: var(--hot); }
.pick:disabled { opacity: .35; cursor: not-allowed; }
.pick .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; }
.fine { font-size: 13px; color: var(--muted); margin: 0; }
#toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); background: var(--panel-2); border: 1px solid var(--line); border-left: 4px solid var(--hot); border-radius: 6px; padding: 10px 14px; max-width: min(420px, calc(100% - 32px)); z-index: 60; opacity: 0; transform: translateY(8px); transition: opacity .2s, transform .2s; pointer-events: none; box-shadow: 0 12px 30px rgba(0,0,0,.5); }
#toast.show { opacity: 1; transform: none; }

@media (max-width: 1260px) {
  #top { gap: 10px; }
  #mainnav button { font-size: 17px; padding: 8px 4px 8px 6px; }
  #cont { min-width: 150px; }
}
@media (max-width: 900px) {

  .datebox span, .quick { display: none; }

  .hero-img .score { font-size: 32px; }

function attractiveness(st, i) {
  const c = st.sched[i];
  const p = c.p ? progOf(st, c.p) : null;
  const newsMult = 1 + Math.min(st.news.reduce((a, n) => a + n.q, 0) / 3, 100) / 1250;
  let A = st.brand * 0.08;
  if (p) {
    let topic = p.kind === "sport" ? 1.7 : 0.35 + 0.65 * p.topic;
    if (p.streamFirst && !p.aired) topic *= 0.8; // Fans kennen es schon vom Streamer
    A = st.brand * Math.pow(p.q / 60, 1.5) * fit(p.genre, i) * topic * newsMult * rnd(0.9, 1.1);
    if (c.cont && p.kind !== "sport") A *= 0.96;
  }
  if (isMe(st) && G.adBreak[i]) A *= 0.85;
  if (isMe(st) && p && p.kind === "sport" && G.mods.split) A *= 0.95;
  if (isMe(st) && i >= LIVE_FROM && !G.mods.studioOk && G.mods.studioRisk >= G.day && Math.random() < 0.05) { A *= 0.3; G.blackout = i; }

}
function airHour(i) {
  const res = G.stations.map(st => ({ st, ...attractiveness(st, i) }));

    st.last[i] = r.v;
    r.title = r.p ? r.p.title + (r.p.kind === "serie" ? ` (Folge ${(r.p.ep % r.p.eps) + 1})` : "") : "Testbild";

      else if (r.p.kind === "show") r.p.topic = Math.max(0.4, r.p.topic * (r.p.genre === "Nachrichten" ? 0.98 : 0.92));

    if (G.blackout === i) { G.blackout = null; logMsg("Sendetechnik", "Warnung", `${hh(i)} – Bildausfall im Studio! Minutenlang schwarzer Bildschirm, die Zuschauer schalten weg.`, true); }
    if (r.p && r.p.kind === "sport" && !r.c.cont) { liveStream(r.v, r.p.title); if (G.mods.split) book(st, "TV-Werbung", r1000(r.v * 20000)); }
    if (r.p && !r.c.cont && !youthOk(r.p, i)) {

    }

        if (ad.done >= ad.spots) {
          st.contracts = st.contracts.filter(x => x !== ad);
          st.sched.forEach(s => { if (s.ad === ad.id) s.ad = null; });
          st.week.forEach(d => d.forEach(s => { if (s.ad === ad.id) s.ad = null; }));
          logMsg("Werbezeitenvermarktung", "Werbung", `Vertrag „${ad.brand}“ vollständig erfüllt.`, i >= LIVE_FROM);
        }
      } else logMsg("Werbezeitenvermarktung", "Werbung", `${hh(i)} – Spot „${ad.brand}“ verfehlt: ${mio(r.v)} statt ${mio(ad.min)} Mio.`, i >= LIVE_FROM);
    }
    if (G.adBreak[i]) { const extra = r1000(r.v * 45000); book(st, "TV-Werbung", extra); logMsg("Live-Regie", "Werbung", `${hh(i)} – Zusatz-Werbeblock: +${eur(extra)}, dafür weniger Zuschauer.`); }

function stagePanel() {
  const S = G.stream, cur = S ? S.stage : 0, P = me();
  return `<section class="panel mb"><div class="ph"><h2>Ausbaupfad</h2><span class="aside">vom Free-TV zum hybriden Medienhaus</span></div><div class="stages">${STAGES.slice(1).map(s => {
    const done = cur >= s.n, building = G.project && G.project.n === s.n, next = cur === s.n - 1 && !G.project, allowed = stageAllowed(s.n);
    const status = done ? '<span class="chip good">Online</span>' : building ? `<span class="chip warn">Im Bau · noch ${G.project.left} T.</span>` : !allowed ? '<span class="chip">Für ÖRR nicht vorgesehen</span>' : next ? '<span class="chip real">Verfügbar</span>' : '<span class="chip">Gesperrt</span>';
    return `<div class="stage ${done ? "done" : ""}"><div class="row-s"><b>Stufe ${s.n}: ${s.name}</b>${status}</div><p class="fine">${s.desc}</p>
      <div class="row-s"><span class="muted">${meur(s.cost)} · ${s.days} Tage · Server ${eur(s.server)}/Tag</span>${next && allowed && !done ? `<button class="btn hot" data-act="project" data-k="${s.n}" ${P.money < s.cost || planLocked() ? "disabled" : ""}>Starten</button>` : ""}</div></div>`;
  }).join("")}</div></section>`;
}
function streamPage(P) {
  const S = G.stream;
  if (!S) return title("Streaming", `<span class="muted">Noch kein eigener Streamer</span>`) + `<p class="lead mb">Sie starten als reiner Fernsehsender. Ein eigener Streamer ist ein teures Großprojekt: Erst nach Monaten trägt er sich, bis dahin muss das Fernsehgeschäft die Verluste ausgleichen.</p>` + stagePanel();
  const h = S.hist, last = h[h.length - 1];
  const spark = (key, color) => {
    if (h.length < 2) return '<p class="fine">Daten ab dem zweiten Tag.</p>';
    const vals = h.map(x => x[key]), mx = Math.max(...vals), mn = Math.min(...vals), span = mx - mn || 1;
    const pts = vals.map((v, i) => `${(i / (vals.length - 1) * 300).toFixed(1)},${(60 - (v - mn) / span * 54).toFixed(1)}`).join(" ");
    return `<svg class="chart" viewBox="0 0 300 64"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5"/></svg>`;
  };
  const free = sFree(S);
  const prev = h[h.length - 2] || last;
  return title(esc(S.name), `<span class="muted">Stufe ${S.stage}: ${STAGES[S.stage].name}</span>`) +
    `<div class="tiles mb">
      <div class="tile"><small>${free ? "Nutzer pro Tag" : "Abonnenten"}</small><b>${mio(free ? S.reach : S.subs)} Mio.</b><span>${last && !free ? (last.subs - prev.subs >= 0 ? "+" : "−") + Math.abs(Math.round((last.subs - prev.subs) * 1e6)).toLocaleString("de-DE") + " gestern" : ""}</span></div>
      <div class="tile"><small>Churn</small><b>${last && !free ? pct(last.churn) : "–"}</b><span>Kündigungen pro Monat</span></div>
      <div class="tile"><small>ARPU</small><b>${last ? last.arpu.toLocaleString("de-DE", { maximumFractionDigits: 2, minimumFractionDigits: 2 }) + " €" : "–"}</b><span>Umsatz je Nutzer / Monat</span></div>
      <div class="tile"><small>Ergebnis gestern</small><b class="${last && last.result < 0 ? "down" : "up"}">${last ? meur(last.result) : "–"}</b><span>Erlöse − Server − CDN</span></div>
      <div class="tile"><small>Seit Start</small><b class="${S.cum < 0 ? "down" : "up"}">${meur(S.cum)}</b><span>${S.cum < 0 ? "Break-even noch nicht erreicht" : "Gewinnzone"}</span></div>
    </div>
    ${stagePanel()}
    <div class="grid two">
      <section class="panel"><div class="ph"><h2>Geschäftsmodell</h2></div><div class="pad" style="display:grid;gap:12px">
        ${S.stage < 2 ? `<p class="lead">${S.model === "free" ? "Die Mediathek ist kostenlos und werbefrei. Ziel ist Reichweite." : "Die Mediathek finanziert sich über Werbung vor und während der Abrufe."} Ein Abo-Modell gibt es ab Stufe 2.</p>` : `
        <label>Modell <select id="sModel"><option value="svod" ${S.model === "svod" ? "selected" : ""}>SVoD – reines Abo</option><option value="hybrid" ${S.model === "hybrid" ? "selected" : ""}>Hybrid – günstiger mit Werbung</option><option value="avod" ${S.model === "avod" ? "selected" : ""}>AVoD – kostenlos mit Werbung</option></select></label>
        ${S.model !== "avod" ? `<label>Monatspreis <input type="number" id="sPrice" min="2.99" max="29.99" step="1" value="${S.price}"> €</label>` : ""}
        <p class="fine">Höhere Preise bringen mehr Umsatz je Abo, treiben aber die Kündigungen. Ohne neue Titel steigt der Churn.</p>
        <div class="actions"><button class="btn hot" data-act="campaign" ${S.campaign > 0 || P.money < 1.5e6 || planLocked() ? "disabled" : ""}>${S.campaign > 0 ? `Kampagne läuft · ${S.campaign} T.` : "Kampagne „Erster Monat gratis“ · 1,5 Mio. €"}</button></div>`}
      </div></section>
      <section class="panel"><div class="ph"><h2>Infrastruktur</h2></div><div class="slist">
        <div class="srow"><b>Serverkapazität</b><em>${S.capacity} Mio.</em><span>gleichzeitige Streams bei Live-Events</span></div>
        <div class="srow"><b>Serverkosten</b><em>${eur(STAGES.slice(1, S.stage + 1).reduce((a, s) => a + s.server, 0) + (S.capacity - 1) * 20000)}</em><span>pro Tag, unabhängig von der Nutzung</span></div></div>
        <div class="pad actions" style="padding-top:12px"><button class="btn" data-act="capacity" ${P.money < 1.5e6 || planLocked() ? "disabled" : ""}>+1 Mio. Streams · 1,5 Mio. €</button></div></section>
      <section class="panel"><div class="ph"><h2>${free ? "Reichweite" : "Abonnenten"}</h2><span class="aside">Verlauf</span></div><div class="pad">${spark(free ? "reach" : "subs", "#e6246e")}</div></section>
      <section class="panel"><div class="ph"><h2>Ergebnis pro Tag</h2><span class="aside">Weg zum Break-even</span></div><div class="pad">${spark("result", "#22c55e")}</div></section>
    </div>`;
}
function catalog(P) {
  const S = G.stream;
  if (!S) return streamPage(P);
  const items = streamItems();
  const wname = { stream: "Streaming-First", linear: "Linear-First", dd: "Day-and-Date", excl: "Exklusiv", catchup: "Mediathek (7 Tage)" };
  let h = title("Katalog", `<span class="muted">${items.length} Titel auf ${esc(S.name)}</span>`);
  h += `<section class="panel mb"><div class="ph"><h2>Online</h2><span class="aside">Abrufe gestern</span></div>${items.length ? `<div class="tbl"><table><thead><tr><th>Titel</th><th>Genre</th><th class="num">Qual.</th><th>Fenster</th><th class="num">Online seit</th><th class="num">Abrufe</th><th></th></tr></thead><tbody>
    ${items.sort((a, b) => (S.views[b.c.id] || 0) - (S.views[a.c.id] || 0)).map(({ c, p }) => `<tr><td class="title">${esc(p.title)}</td><td>${esc(p.genre)}</td><td class="num">${attr(p.q)}</td><td><span class="chip ${c.window === "excl" || c.window === "stream" ? "good" : ""}">${wname[c.window]}</span></td><td class="num">${G.day - c.added} T.</td><td class="num">${(S.views[c.id] || 0).toLocaleString("de-DE")}</td><td class="num">${c.window === "catchup" ? "" : `<button class="btn" data-act="unstream" data-id="${p.id}">Entfernen</button>`}</td></tr>`).join("")}
  </tbody></table></div>` : '<div class="pad"><p class="lead">Noch keine Titel. In der Mediathek erscheinen gesendete Programme automatisch für 7 Tage.</p></div>'}</section>`;
  if (S.stage < 2) return h + `<p class="lead">Einen eigenen Katalog mit Exklusivtiteln und Verwertungsfenstern gibt es ab Stufe 2 (Premium-Abo).</p>`;
  const out = P.progs.filter(p => !S.catalog.some(c => c.id === p.id) && p.kind !== "sport" && !p.filler);
  h += `<p class="lead mb">Verwertungsfenster: <b>Streaming-First</b> für noch nie gesendete Titel (Abo-Schub, später etwas weniger TV-Quote), <b>Linear-First</b> für bereits gesendete (Nachholen), <b>Day-and-Date</b> für Titel, die heute auch im TV laufen. <b>Exklusiv</b> zieht einen Titel ganz aus dem Fernsehen ab – stärkster Abo-Treiber, aber verärgerte TV-Zuschauer und leere Sendeplätze.</p>
    <section class="panel"><div class="ph"><h2>Aus dem Archiv hinzufügen</h2></div>${out.length ? `<div class="tbl"><table><thead><tr><th>Titel</th><th>Genre</th><th class="num">Qual.</th><th>Fenster</th><th></th></tr></thead><tbody>
      ${out.map(p => { const w = P.sched.some(c => c.p === p.id) ? "dd" : p.aired ? "linear" : "stream"; return `<tr><td class="title">${esc(p.title)}</td><td>${esc(p.genre)}</td><td class="num">${attr(p.q)}</td><td><span class="chip">${wname[w]}</span></td><td class="num"><div class="actions" style="justify-content:flex-end"><button class="btn hot" data-act="stream" data-id="${p.id}" data-k="${w}">Hinzufügen</button>${p.home ? "" : `<button class="btn" data-act="stream" data-id="${p.id}" data-k="excl">Exklusiv</button>`}</div></td></tr>`; }).join("")}
    </tbody></table></div>` : '<div class="pad"><p class="lead">Alle Titel sind bereits im Katalog.</p></div>'}</section>`;
  return h;
}
function smarket(P) {
  const S = G.stream;
  const list = G.streamers.map(s => ({ ...STREAMERS.find(x => x.id === s.id), ...s })).filter(s => s.id !== "mediathek" && !(s.player && (!S || sFree(S)))).sort((a, b) => b.subs - a.subs);
  const chart = [];
  for (const s of list) if (!s.player) s.hits.forEach((t, k) => chart.push({ t, who: s.id, v: s.subs * 1e6 * 0.06 / (k + 1) * rnd(0.9, 1.1) }));
  if (S) for (const { c, p } of streamItems()) chart.push({ t: p.title, who: S.id, v: (S.views[c.id] || 0) * 1.4, mine: true });
  chart.sort((a, b) => b.v - a.v);
  return title("Streaming-Wettbewerb", `<span class="muted">Spielwerte, grob an Größenordnungen angelehnt</span>`) +
    `<div class="grid two"><section class="panel"><div class="ph"><h2>Abonnenten</h2><span class="aside">Deutschland, Mio.</span></div><div class="tbl"><table><thead><tr><th>Pos</th><th>Dienst</th><th>Modell</th><th class="num">Preis</th><th class="num">Abos</th></tr></thead><tbody>
      ${list.map((s, k) => `<tr class="${s.player ? "mine" : ""}"><td>${k + 1}</td><td><span class="sn">${sbadge(s.id)}${esc(s.player && S ? S.name : s.name)}</span></td><td class="muted">${esc(s.player && S ? ({ svod: "Abo", hybrid: "Hybrid", avod: "Werbung", free: "kostenlos" })[S.model] : s.model)}</td><td class="num">${(s.player && S ? S.price : s.price).toLocaleString("de-DE", { minimumFractionDigits: 2 })} €</td><td class="num"><b>${mio(s.subs)}</b></td></tr>`).join("")}
    </tbody></table></div></section>
    <section class="panel"><div class="ph"><h2>Top 10 der Woche</h2><span class="aside">nach Abrufen</span></div><div class="tbl"><table><tbody>
      ${chart.slice(0, 10).map((x, k) => `<tr class="${x.mine ? "mine" : ""}"><td>${k + 1}</td><td class="title">${esc(x.t)}</td><td><span class="sn">${sbadge(x.who)}</span></td></tr>`).join("")}
    </tbody></table></div></section></div>`;
}

function finance(P) {
  const hist = P.hist.slice(-14);
  const keys = ["TV-Werbung", "Teleshopping", "Distribution (HD/Kabel)", "Rundfunkbeitrag", "Streaming-Abos", "Streaming-Werbung", "Programmkäufe", "Sportrechte", "Personal & Verwaltung", "Sendetechnik & Verbreitung", "Streaming-Technik", "Streaming-Aufbau", "PR & Krisen", "Strafen", "Zinsen"];
  const sum = {}; for (const d of P.hist) for (const [k, v] of Object.entries(d.fin)) sum[k] = (sum[k] || 0) + v;
  const rev = keys.filter(k => (sum[k] || 0) > 0), cost = keys.filter(k => (sum[k] || 0) < 0);

function lineChart() {
  const W = 640, H = 200, pl = 36, pr = 10, pt = 12, pb = 24;
  const P = me();
  const done = HOURS.filter(i => G.today[i]);
  const leaders = standings().slice(0, 3).map(x => x.s.i).filter(i => i !== G.me);
  const series = [G.me, ...leaders.slice(0, 2)];
  const maxV = Math.max(10, ...done.flatMap(i => series.map(k => G.today[i][k].ma))) * 1.15;
  const x = i => pl + i * (W - pl - pr) / 23, y = v => pt + (H - pt - pb) * (1 - v / maxV);
  let svg = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Marktanteil je Stunde">`;
  for (let k = 0; k <= 4; k++) { const v = maxV / 4 * k; svg += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="#2a2f37"/><text x="${pl - 6}" y="${y(v) + 4}" text-anchor="end">${Math.round(v)}</text>`; }
  [0, 6, 12, 18, 20, 23].forEach(i => { svg += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${i}</text>`; });
  svg += `<line x1="${pl}" x2="${W - pr}" y1="${y(P.target)}" y2="${y(P.target)}" stroke="#e3a019" stroke-dasharray="4 4"/>`;
  for (const k of series.slice().reverse()) {
    const pts = done.map(i => `${x(i)},${y(G.today[i][k].ma)}`).join(" ");
    if (!pts) continue;
    svg += `<polyline points="${pts}" fill="none" stroke="${STATIONS[k].color}" stroke-width="${k === G.me ? 3 : 2}" stroke-linejoin="round"/>`;
    const li = done[done.length - 1];
    svg += `<circle cx="${x(li)}" cy="${y(G.today[li][k].ma)}" r="${k === G.me ? 4.5 : 3.5}" fill="${STATIONS[k].color}"/>`;
  }
  return svg + `</svg><div class="legend">${series.map(k => `<span style="--c:${STATIONS[k].color}">${esc(STATIONS[k].name)}</span>`).join("")}<span style="--c:#e3a019">Ihr Ziel</span></div>`;
}

    </section>

      <div class="slist"><div class="srow"><b>${np ? esc(np.title) : next != null ? "Testbild" : "–"}</b><em>${next != null ? mio(expected(P, next)) : ""}</em><span>${nc && nc.live ? "Live-Event – nicht austauschbar" : np ? esc(np.genre) : ""}</span></div></div>
      <div class="pad actions" style="padding-top:12px">

  </div>`;
}

function pickerSched(wd) { const P = me(); return wd === weekday(G.day) ? P.sched : P.week[wd]; }
function openPicker(kind, i, wd, live) {
  const P = me();
  const sc = live ? P.sched : pickerSched(wd);
  let list = "";
  if (kind === "prog") {
    const sorted = [...P.progs].sort((a, b) => b.q * fit(b.genre, i) * (0.35 + 0.65 * b.topic) - a.q * fit(a.genre, i) * (0.35 + 0.65 * a.topic));

      sorted.map(p => {
        const why = canPlace(P, sc, p, i) || (live && p.len > 1 ? "Nur einstündige Programme" : "");
        const used = sc.filter(c => c.p === p.id && !c.cont).length;
        const youth = !youthOk(p, i);
        return `<button class="pick" data-act="${live ? "swapTo" : "setProg"}" data-i="${i}" data-k="${wd}" data-id="${p.id}" ${why ? "disabled" : ""}><b>${esc(p.title)}</b>

      }).join("");
  } else {
    const exp = expected(P, i);
    list = `<button class="pick" data-act="setAd" data-i="${i}" data-k="${wd}" data-id=""><b>Keine Werbung</b><span class="meta">Erwartet ca. ${mio(exp)} Mio.</span></button>` +
      P.contracts.map(a => {
        const left = a.spots - a.done - sc.filter(c => c.ad === a.id).length + (sc[i].ad === a.id ? 1 : 0);
        return `<button class="pick" data-act="setAd" data-i="${i}" data-k="${wd}" data-id="${a.id}" ${left <= 0 ? "disabled" : ""}><b>${esc(a.brand)} · ${eur(a.pay)}</b>

      }).join("");
  }
  openModal(`<header><h2>${WDL[wd] || ""} ${hh(i)} · ${kind === "prog" ? (live ? "Notfall-Wiederholung" : "Programm wählen") : "Werbespot wählen"}</h2><button class="btn" data-act="close">Abbrechen</button></header><div class="dbody"><div class="picklist">${list}</div></div>`, true);
}

function act(b) {
  const k = b.dataset.act;
  if (k === "choose") { showChoose(); return; }
  if (k === "back") { showStart(); return; }
  if (k === "pickStation") { closeModal(); hist = []; fut = []; planDay = null; newGame(b.dataset.k); go("overview", true); return; }
  if (k === "load") { if (load()) { closeModal(); hist = []; fut = []; planDay = null; startDay(); go("overview", true); } return; }
  if (!G) return;
  const P = me();
  const id = b.dataset.id ? +b.dataset.id : null, i = b.dataset.i !== undefined && b.dataset.i !== "undefined" ? +b.dataset.i : null;
  const wd = b.dataset.k !== undefined ? +b.dataset.k : null;
  switch (k) {
    case "close": closeModal(); return;
    case "filter": msgFilter = b.dataset.k; break;
    case "forceStart": closeModal(); startBroadcast(); return;
    case "toPlan": closeModal(); planDay = null; go("plan"); return;
    case "lspeed": liveSpeed = +b.dataset.k; break;
    case "finish": finishEvening(); return;
    case "next": closeModal(); if (G.over) showEnd(); else { planDay = null; nextDay(); } return;
    case "planDay": planDay = wd; break;
    case "autoDay": if (!(wd === weekday(G.day) && planLocked())) { planDayFor(P, wd); if (wd === weekday(G.day)) buildToday(P); toast(`Der Assistent hat den ${WDL[wd]} geplant.`); } break;
    case "copyDay": {
      const src = P.week[wd];
      for (const d of WEEK) if (d !== wd && !(d === weekday(G.day) && planLocked())) { P.week[d] = src.map(c => ({ ...c, live: false })); }
      buildToday(P); toast(`${WDL[wd]} wurde auf alle Wochentage kopiert.`); break;
    }
    case "buy": { const p = G.market.find(x => x.id === id); if (p && p.price <= P.money && !planLocked()) { book(P, "Programmkäufe", -p.price); P.progs.push(p); G.market = G.market.filter(x => x !== p); toast(`„${p.title}“ gekauft.`); } break; }
    case "ad": { const a = G.adOffers.find(x => x.id === id); if (a && P.contracts.length < MAX_ADS && !planLocked()) { P.contracts.push(a); G.adOffers = G.adOffers.filter(x => x !== a); toast(`Vertrag mit ${a.brand} geschlossen.`); } break; }
    case "news": { const n = G.newsOffers.find(x => x.id === id); if (n && P.news.length < 3 && !planLocked()) { book(P, "Programmkäufe", -n.price); P.news.push(n); G.newsOffers = G.newsOffers.filter(x => x !== n); toast("Meldung gekauft."); } break; }
    case "sell": { const p = P.progs.find(x => x.id === id); if (p && !planLocked() && !p.home) { book(P, "Programmkäufe", r1000(p.price * 0.4)); P.progs = P.progs.filter(x => x !== p); if (G.stream) G.stream.catalog = G.stream.catalog.filter(c => c.id !== id); toast(`„${p.title}“ verkauft.`); } break; }
    case "credit": P.money += 2.5e6; P.credit += 2.5e6; toast("Kredit über 2,5 Mio. € erhalten."); break;
    case "repay": P.money -= 2.5e6; P.credit -= 2.5e6; toast("2,5 Mio. € getilgt."); break;
    case "project": if (!planLocked()) startProject(+b.dataset.k); break;
    case "capacity": if (G.stream && P.money >= 1.5e6 && !planLocked()) { book(P, "Streaming-Aufbau", -1.5e6); G.stream.capacity++; toast("Serverkapazität ausgebaut."); } break;
    case "campaign": if (G.stream && G.stream.stage >= 2 && !G.stream.campaign && P.money >= 1.5e6 && !planLocked()) { book(P, "Streaming-Aufbau", -1.5e6); G.stream.campaign = 7; logMsg("Marketing", "Streaming", `Kampagne „Erster Monat gratis“ für ${G.stream.name} läuft 7 Tage: deutlich mehr Neukunden, aber weniger Umsatz je Abo.`, true); } break;
    case "showEvent": showEvent(); return;
    case "decide": decide(+b.dataset.k); return;
    case "stream": if (G.stream && G.stream.stage >= 2) { addToStream(id, b.dataset.k); toast(b.dataset.k === "excl" ? "Titel läuft jetzt exklusiv im Stream." : "Titel zum Katalog hinzugefügt."); } break;
    case "unstream": if (G.stream) { G.stream.catalog = G.stream.catalog.filter(c => c.id !== id); const p = P.progs.find(x => x.id === id); if (p) p.exclusive = false; } break;
    case "bid": {
      const r = G.rights.find(x => x.id === b.dataset.k);
      const v = Math.round(+($("bid-" + r.id).value || 0) / 1000) * 1000;
      if (v < r.price) { toast(`Das Mindestgebot liegt bei ${meur(r.price)}.`); return; }
      if (v > P.money + 15e6 - P.credit) { toast("So viel Geld steht Ihnen nicht zur Verfügung."); return; }
      r.bid = v; toast(`Gebot über ${meur(v)} abgegeben. Entscheidung über Nacht.`); break;
    }
    case "pickProg": openPicker("prog", i, wd); return;
    case "pickAd": openPicker("ad", i, wd); return;
    case "swap": openPicker("prog", i, weekday(G.day), true); return;
    case "swapTo": {
      const p = progOf(P, id);
      if (G.phase === "live" && G.min < i * 60 && p && p.len === 1 && !canPlace(P, P.sched, p, i)) {
        clearAt(P, P.sched, i); P.sched[i].p = p.id; P.sched[i].cont = false;
        logMsg("Live-Regie", "Warnung", `Programmänderung: Um ${hh(i)} läuft jetzt „${p.title}“.`, true);
      }
      closeModal(); break;
    }
    case "adbreak": if (G.phase === "live" && G.min < i * 60) G.adBreak[i] = !G.adBreak[i]; break;
    case "setProg": {
      if (wd === weekday(G.day) && planLocked()) break;
      const p = id ? progOf(P, id) : null;
      editPlan(wd, sc => {
        if (p && canPlace(P, sc, p, i)) return;
        placeAt(P, sc, i, p);
        sc.forEach(c => { if (!c.p) c.ad = null; });
      });
      closeModal(); break;
    }
    case "setAd": if (!(wd === weekday(G.day) && planLocked())) editPlan(wd, sc => { sc[i].ad = id; }); closeModal(); break;
  }
  render();
}

// =====================================================================
// Speichern (nur lokal im Browser)
// =====================================================================
const KEY = "quotenturm-v5";
function save() { try { localStorage.setItem(KEY, JSON.stringify(G)); } catch (e) { /* ohne Speicher spielbar */ } }
function hasSave() { try { return !!localStorage.getItem(KEY); } catch (e) { return false; } }
function load() {
  try {
    const s = localStorage.getItem(KEY); if (!s) return false; G = JSON.parse(s);
    G.mods = G.mods || {}; G.eventLog = G.eventLog || [];
    return true;
  } catch (e) { return false; }
}
function clearSave() { try { localStorage.removeItem(KEY); } catch (e) { /* egal */ } }

function start(data) {
  probeLogos();
  if (data && data.G && !data.G.over) { G = data.G; if (G.phase !== "plan") startDay(); go("overview", true); }
  else showStart();
}
if (window.claude && window.claude.hot && typeof window.claude.hot.snapshot === "function") {
  window.claude.hot.snapshot(() => ({ G }));
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
